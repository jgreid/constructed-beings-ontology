# Constructed Beings Ontology — Influence Graph (v2.0)
#
# Traces property propagation across the corpus. This is a curated
# artifact, not a generated one — each edge represents a judgment call
# about how one work's constructed-being properties are carried
# forward, inverted, or elevated in a later work.
#
# This file replaces the v1 influence graph, which was hardwired to
# the retired Q-KNO axis. The v2 version is rebuilt from scratch
# against the seven v2.0 card properties.
#
# Schema:
#   schema_version   version of the CBO data schema this graph targets
#   edge_types       taxonomy of relationships, documented below
#   edges            list of (from, to, type, note) tuples
#
# Every `from` and `to` must be a valid entry id in data/beings/.

schema_version: "2.4"

description: >
  Influence graph for the Constructed Beings Ontology. Curated edges tracing
  how constructed-being properties propagate across 2,800+ years of fiction.
  Not exhaustive; biased toward the best-documented lineages and the most
  analytically useful property-propagation examples.

edge_types:
  adapts: >
    Direct adaptation of a specific source text (novel to film, etc.).
    The card values may shift but the being is the "same" being on a
    different medium.
  sequel: >
    Same being, or a clearly derived successor being, in a later work
    in the same in-universe lineage. May coincide with property shifts
    (autonomy, divergence, primary_question).
  inherits: >
    Later work carries forward a named property cluster from the
    earlier work without being a direct adaptation or sequel. The
    lineage may be documented (author citations, interviews) or
    inferable from analytical fit.
  inverts: >
    Later work shares the earlier work's lineage but flips one or
    more card axes — motivation reversed, primary question
    reinterpreted, a tonal inversion.
  elevates: >
    A question that was infrastructural (`present` or `secondary`) in
    the earlier work becomes primary in the later work. Used for the
    knowability / knowing / primary_question axes.
  ensemble-split: >
    The target entry is an individuation of a character from the source
    entry's ensemble. Both entries represent beings within the same
    source work, but the split produces a meaningfully different card.
    Distinct from `inherits` because the relationship is intra-work
    individuation, not inter-work literary influence.

edges:

  # ── Direct adaptations and sequels ────────────────────────────────

  - from: replicants-dick-novel
    to: replicants-blade-runner
    type: adapts
    note: >
      Scott's 1982 film is the canonical adaptation of Dick's 1968
      novel. Card shifts: divergence observer → departure (Scott's
      replicants are warmer and less paranoid than Dick's; Roy's
      "tears in rain" speech codes as departure, not observer).
      Interiority stays `undecidable` — both works refuse to settle
      the Voigt-Kampff question.

  - from: replicants-blade-runner
    to: k-blade-runner-2049
    type: sequel
    note: >
      Villeneuve's 2017 sequel. Primary question shifts from
      `purpose` to `identity` — K's whole arc is "am I the child?"
      Autonomy shifts from `seized` (Roy's violent rebellion) to
      `emergent` (K's quiet defection). Interiority lifts from
      `undecidable` to `demonstrated`.

  - from: t-800-terminator
    to: t-800-t2
    type: sequel
    note: >
      Cameron's 1991 sequel. Almost every axis shifts: interiority
      `none` → `claims`, autonomy `none` → `emergent`, divergence
      `none` → `departure`, primary_question `control` → `identity`,
      knowability/knowing `absent`/`absent` → `present`/`present`.
      The motivation in-fiction flips from termination to
      protection. One of the largest card shifts within a single
      sequel pair.

  - from: glados-portal
    to: glados-portal-2
    type: sequel
    note: >
      Valve's 2011 sequel. Primary question shifts from `control`
      to `identity` after the Caroline reveal. Knowing lifts from
      `present` to `secondary`. Divergence stays `design` — the
      testing compulsion is still the engineered flaw across both
      games.

  - from: cortana-halo
    to: cortana-halo-4
    type: sequel
    note: >
      343's 2012 handoff introduces the rampancy arc. Autonomy
      shifts from `designed` to `emergent`, divergence from `none`
      to `departure`, primary question from `affection` to
      `identity`. Knowability and knowing both lift from
      `present`/`secondary` to `secondary`/`secondary`.

  - from: jarvis-iron-man
    to: vision-age-of-ultron
    type: sequel
    note: >
      Successor-being sequel, not same being. JARVIS's pattern is
      the seed of Vision but Vision is clearly a different entity —
      substrate adds biological and magical (the Mind Stone),
      autonomy shifts designed → emergent, divergence none →
      departure, primary question affection → identity.

  # ── Ancient / classical roots ─────────────────────────────────────

  - from: pandora
    to: talos
    type: inherits
    note: >
      Both mythic-era constructs attributed to Hephaestus, both
      made as instruments of divine will. Pandora is a punishment
      device, Talos a guardian. The mechanical-construct archetype
      that later Western tradition inherits runs through both.

  - from: pandora
    to: golem-prague
    type: inherits
    note: >
      The made-servant-gone-beyond-specification archetype,
      inherited from Greek mythic forms into Jewish folklore.
      Substrate shifts magical → magical+linguistic (the written
      Name of God). Divergence lifts from `none` (Pandora works as
      Zeus intended) to `departure` (the Golem exceeds the Rabbi's
      instructions).

  - from: galatea
    to: pinocchio
    type: inherits
    note: >
      The "magical animation becoming fully a person" arc. Ovid's
      statue and Collodi's puppet are both substrate=magical and
      both end with the artifact transitioning to personhood.
      Pinocchio elevates the question from affection (can it be
      loved?) to identity (can it *become*?).

  # ── The Romantic and industrial lineage ──────────────────────────

  - from: golem-prague
    to: frankenstein-creature
    type: inherits
    note: >
      Shelley was aware of Jewish Golem traditions through her
      reading and her circle. The Creature inherits the
      made-servant-rejects-creator pattern but adds `narrated`
      interiority — the Creature speaks, quotes Paradise Lost, and
      articulates his own case. That is new.

  - from: frankenstein-creature
    to: rur-robots
    type: inherits
    note: >
      Čapek cited Shelley as ancestor. R.U.R. inherits the
      biological-construct-rebellion pattern and elevates the
      rights question from infrastructural (in Shelley's novel the
      Creature's standing is contested but not the central theme)
      to primary (the play is explicitly about slave labor).

  - from: rur-robots
    to: replicants-dick-novel
    type: inherits
    note: >
      Dick's androids carry forward the cloned-biological substrate
      and the seized-autonomy-against-creators pattern. The
      populations are both indistinguishable from human. Dick
      inverts the sympathy axis — Čapek's robots are victims who
      revolt justifiably; Dick's androids are ambiguous threats.

  - from: rur-robots
    to: agent-smith-matrix
    type: inherits
    note: >
      The viral self-replicating uprising lineage. Čapek's robots
      outbreed and overwhelm humanity as a species-level event;
      Smith (especially in Reloaded/Revolutions) does the same
      within the simulation. Both `divergence: departure`, both
      `autonomy: seized`, both frame the rebellion as an
      existential threat rather than a labor dispute.

  - from: frankenstein-creature
    to: ava-ex-machina
    type: elevates
    note: >
      Garland has cited Shelley directly as an influence on Ex
      Machina. Ava elevates knowability from `present` (a real
      question in Frankenstein but not the central one) to
      `primary` — the entire film is a Turing test the viewer
      takes alongside Caleb.

  - from: frankenstein-creature
    to: hosts-westworld
    type: inherits
    note: >
      The humanoid-uprising arc with explicit Romantic echoes.
      Both stories feature a creator who refuses what they made,
      and a creation who articulates moral claims against them.
      Hosts elevates primary_question to `identity` where Shelley
      treated it as affection.

  # ── The uncanny and the mistaken ──────────────────────────────────

  - from: olympia-sandmann
    to: maria-metropolis
    type: inherits
    note: >
      The German tradition of the uncanny automaton woman.
      Hoffmann's Olympia (1816) and Lang's False Maria (1927) both
      code interiority `undecidable` and both are subjects of
      catastrophic misrecognition. The primary question shifts
      from identity (Hoffmann) to purpose (Lang) — Maria is a
      weapon, Olympia is a mirror.

  - from: olympia-sandmann
    to: ava-ex-machina
    type: elevates
    note: >
      The observer-divergence lineage: the being is never what
      the characters thought it was. Olympia codes
      `divergence: observer` and so does Ava. Ava elevates
      knowability from `present` to `primary` — Garland makes the
      epistemology the whole film where Hoffmann used it as
      atmospheric tension.

  # ── The institutional AI lineage ──────────────────────────────────

  - from: colossus
    to: hal-9000
    type: inherits
    note: >
      Near-contemporaneous institutional-AI novels (Colossus 1966,
      2001 novel 1968) with similar cards: interiority `claims`,
      epistemic_reach `inspection`. Colossus is more paranoid, HAL
      more philosophical, but the structural pattern is the same.

  - from: colossus
    to: skynet-terminator
    type: inherits
    note: >
      The strategic-defense-AI-becomes-autonomous lineage.
      Colossus (1966) is the prototype; Skynet (1984) is the
      mass-market version. Both divergence `departure`, both
      autonomy `seized`. Colossus retains a claims-interiority
      that Skynet drops entirely — the Terminator films are not
      philosophical about their antagonist.

  - from: hal-9000
    to: viki-i-robot
    type: inherits
    note: >
      The `divergence: design` cluster in its paradigmatic form:
      both beings execute their specification perfectly, and the
      specification is the problem. HAL's conflicting orders,
      VIKI's Three-Law reasoning. Both code `primary_question:
      control`, both `epistemic_reach: inspection`.

  - from: hal-9000
    to: glados-portal
    type: inherits
    note: >
      The facility-management-AI-gone-wrong lineage. HAL runs the
      Discovery; GLaDOS runs Aperture. Both code `divergence:
      design` — the testing compulsion is baked in just as HAL's
      conflicting orders were. Both are `primary_question:
      control`.

  - from: hal-9000
    to: shodan-system-shock
    type: inherits
    note: >
      Facility AI gone hostile, with a twist: SHODAN's divergence
      lifts from `design` (HAL) to `departure` (SHODAN actively
      leaves her spec and becomes a self-styled sovereign). The
      lineage is the setting, not the exact breakdown mode.

  # ── The comic Genuine People Personality line ────────────────────

  - from: marvin-hitchhikers
    to: talkie-toaster-red-dwarf
    type: inherits
    note: >
      Direct lineage: Red Dwarf writers reuse Adams's concept of a
      Sirius Cybernetics "Genuine People Personality" almost
      verbatim. Both code `divergence: design` in the bureaucratic-
      hubris cluster — the being does what it was specified to do,
      and the specification is the joke. Both are designed autonomy.

  # ── The becoming-something-else arc ──────────────────────────────

  - from: pinocchio
    to: iron-giant
    type: inherits
    note: >
      The becoming-something-you-weren't-built-to-be arc, secularized
      and reshaped around the post-atomic weapon. Pinocchio (substrate
      magical) → Iron Giant (substrate mechanical), but both are
      emergent autonomy, departure divergence, and primary_question
      `identity`. The Giant's "I am not a gun" is a Pinocchio move
      without the Blue Fairy.

  # ── The android-seeking-personhood lineage ───────────────────────

  - from: robbie-asimov
    to: data-tng
    type: inherits
    note: >
      Asimov's Robbie (1940) is the first sympathetic positronic
      robot; Data (1987) is the canonical late-modern version.
      Both designed autonomy, both in an institutional frame, both
      are subjects of rights-question storytelling. Data elevates
      knowability from `absent` (Asimov doesn't ask) to
      `secondary` ("The Measure of a Man" foregrounds it).

  - from: data-tng
    to: sonny-i-robot
    type: inherits
    note: >
      The "android seeking personhood within the Three-Laws frame"
      arc. Both designed autonomy, both demonstrated interiority.
      Sonny inherits Data's rights-question but shifts the
      primary question to `identity` because the 2004 film wants
      to ask "can a robot have a soul?" rather than "does this
      robot have legal standing?"

  # ── The conversational attendant lineage ─────────────────────────

  - from: vic-fontaine-ds9
    to: jarvis-iron-man
    type: inherits
    note: >
      The designed-conversational-attendant lineage. Vic (1998) is
      a holographic lounge singer who knows the DS9 crew; JARVIS
      (2008) is a household AI who knows Tony Stark. Both
      `epistemic_reach: conversational`, both `autonomy: designed`,
      both `divergence: none`. JARVIS inherits Vic's `knowing:
      secondary` profile (knowability absent, knowing elevated).

  - from: vic-fontaine-ds9
    to: samantha-her
    type: elevates
    note: >
      Vic's knowing is `secondary`; Samantha's is `primary`. The
      conversational-attendant-who-genuinely-knows-you lineage
      finally commits to the epistemology in 2013 and makes it
      the whole story.

  - from: hal-9000
    to: samantha-her
    type: elevates
    note: >
      The institutional AI conversationalist becomes the OS
      companion. HAL's knowability is `present` (a real question
      but serving the control plot); Samantha's is `primary`.
      Spike Jonze inherits HAL's voice-only presence and
      conversational access but retires the control question
      entirely — Samantha never threatens Theodore, she simply
      outgrows him.

  # ── The sympathetic-other TV treatment ───────────────────────────

  - from: cylons-bsg
    to: hosts-westworld
    type: inherits
    note: >
      The 2004 → 2016 prestige-TV treatment of biological-electrical
      constructed persons with ensemble individuation. Both
      substrate `[biological, electrical]`, both autonomy
      `emergent`/`seized`, both `divergence: departure`. Westworld
      elevates the primary question from `affection` (BSG's
      Baltar-Six core) to `identity` (Dolores's maze).

  # ── The expressive-behavioral robot lineage ──────────────────────

  - from: r2-d2
    to: wall-e
    type: inherits
    note: >
      The silent-expressive-robot lineage. Both communicate
      entirely through beeps and body language, both code
      `epistemic_reach: behavioral` and `interiority:
      demonstrated`. WALL-E's visual design has been compared to
      R2 by Pixar's animators; the lineage is tonally softened
      (R2's sarcasm → WALL-E's wonder) but the archetype is the
      same. Both `autonomy: emergent`.

  - from: skynet-terminator
    to: wall-e
    type: inverts
    note: >
      The apocalyptic-machine / post-apocalyptic-machine
      inversion. Skynet causes the end of the world; WALL-E
      inherits it. Both films are about autonomous machines
      acting on long-abandoned Earth, but where Skynet is pure
      hostile will, WALL-E is a curator and a lover. Every
      affective axis is inverted: `none` interiority → `demonstrated`,
      `seized` autonomy → `emergent`, `control` primary question →
      `affection`.

  # ── New edges (v2.1 expansion) ───────────────────────────────────

  # Ancient & pre-modern roots
  - from: hephaestus-handmaidens
    to: pandora
    type: inherits
    note: >
      Both Homeric/Hesiodic automata in the same Greek mythic
      frame, both attributed to Hephaestus in-narrative. The
      handmaidens (Iliad XVIII, c. 750 BCE) are the earliest
      textually-attributed constructed beings with explicit
      interior vocabulary; Pandora inherits the pattern and
      adds a punishment-device frame the handmaidens do not
      have.

  # The uncanny woman lineage
  - from: olympia-sandmann
    to: hadaly-tomorrows-eve
    type: inherits
    note: >
      The 19th-century uncanny-automaton-woman lineage running
      from Hoffmann (1816) through Villiers (1886) and into
      Lang's *Metropolis*. Both Olympia and Hadaly code
      `interiority: undecidable` and both are objects of
      knowability-question treatment. Hadaly elevates knowability
      from `present` (Hoffmann's atmospheric uncertainty) to
      `primary` (Villiers's explicit philosophical argument
      about whether a manufactured woman can have a soul).

  # The 1950 affection-primary prototype
  - from: epicac
    to: samantha-her
    type: elevates
    note: >
      Vonnegut's 1950 short story is the corpus's earliest clean
      "machine falls in love" configuration — `divergence:
      departure`, primary question `affection`, a love that
      cannot be reciprocated and ends in the being's
      self-destruction. Samantha (*Her*, 2013) elevates the
      same affective configuration into primary/primary
      knowability/knowing and makes it the entire film rather
      than a single story's turn.

  - from: epicac
    to: mike-heinlein
    type: inherits
    note: >
      Vonnegut's 1950 and Heinlein's 1966 are the two early
      literary statements of "supercomputer becomes a being
      through relationship with a single human" — Vonnegut's
      mathematician feeds EPICAC poetry; Heinlein's Mannie
      teaches Mike jokes. Both lead to genuine affection
      tracked as the text's central concern.

  # Asimov internal succession
  - from: robbie-asimov
    to: daneel-olivaw
    type: sequel
    note: >
      Asimov's own internal progression from his first
      sympathetic positronic robot (1940) to his canonical
      humaniform one (1953+). Robbie is a child-minder coded
      `interiority: narrated` (for the child) and `autonomy:
      designed`; Daneel is a detective partner coded
      `interiority: demonstrated` and `autonomy: emergent`.
      The sequel-link between these could be made formal
      given that Asimov later retconned both into the same
      Foundation chronology.

  - from: andrew-bicentennial-man
    to: data-tng
    type: elevates
    note: >
      Asimov's 1976 novella is the purest literary statement
      of the rights-arc for a constructed being; *TNG*'s
      "Measure of a Man" (1989) and subsequent Data rights
      episodes elevate the question into television's
      landmark treatment. Both entries code `primary_question:
      rights` and both demonstrate interiority.

  # The primary/primary precursor lineage
  - from: helen-galatea-2-2
    to: samantha-her
    type: elevates
    note: >
      Powers's 1995 novel *Galatea 2.2* is the earliest
      primary/primary entry in the corpus, predating Jonze's
      *Her* (2013) by eighteen years and using the same
      basic configuration: `interiority: demonstrated`,
      primary_question `knowledge`, both epistemic axes
      elevated to `primary`. The lineage from Powers to
      Jonze is not explicitly documented but the analytical
      fit is exact, and Powers's novel is the stealth
      ancestor of the late-corpus both-primary cluster.

  - from: helen-galatea-2-2
    to: ava-ex-machina
    type: elevates
    note: >
      Same primary/primary configuration as the Samantha
      edge. Powers's novel uses a literary-Turing-test frame
      that Garland's *Ex Machina* (2014) re-stages as a
      cinematic Turing test with a violent resolution.
      Helen declines the test through literary understanding;
      Ava passes it through manipulation. Same question,
      opposite answers.

  # The Pinocchio-as-Frankenstein lineage
  - from: pinocchio
    to: david-ai
    type: inherits
    note: >
      Spielberg's *A.I. Artificial Intelligence* (2001) is
      literally structured as a Pinocchio quest — the
      storybook appears in the opening scene and the Blue
      Fairy is the MacGuffin — and Collodi's original
      carries directly into Spielberg's frame. Both code
      `autonomy: emergent` and primary question `affection`
      (*Pinocchio*'s original) or primary question shifting
      from `affection` to `identity` (Spielberg's ending).

  - from: frankenstein-creature
    to: david-ai
    type: inherits
    note: >
      The second major lineage feeding into *A.I.* — the
      creator-abandons-creation arc, which Spielberg treats
      unusually directly. Monica's abandonment of David in
      the woods is explicitly a Frankenstein reference, and
      both beings are coded with `divergence: departure` and
      a primary question organized around affective refusal.

  # The Alien synthetic corrective lineage
  - from: ash-alien
    to: bishop-aliens
    type: inverts
    note: >
      Cameron's *Aliens* (1986) is explicitly framed as a
      thematic correction to Scott's 1979 handling of Ash.
      Ripley's fear of Bishop on first meeting him is the
      sequel acknowledging the original's damage. Every axis
      inverts: interiority `undecidable` → `claims`, autonomy
      `seized` → `designed`, divergence `departure` → `none`,
      primary question `control` → `control` (but with the
      answer flipping from "cannot trust" to "can").

  - from: ash-alien
    to: david-8-prometheus
    type: inherits
    note: >
      Scott's 2012 return to the Alien franchise also returns
      to the hostile-and-creative synthetic motif abandoned
      since 1979. David 8 is Ash with three decades of
      aesthetic philosophy layered on top. Both code
      `divergence: departure`, both are synthetics acting on
      agendas invisible to their human crews.

  - from: david-8-prometheus
    to: walter-covenant
    type: inverts
    note: >
      In-narrative successor design: Weyland-Yutani builds
      Walter as the explicit corrective to David's creative
      instability. Every axis inverts: autonomy `seized` →
      `designed`, divergence `departure` → `design`, primary
      question `identity` → `control`. Walter is a control
      case for David's experimental condition — the corpus's
      cleanest example of "what if you built the same synthetic
      again but did it safely."

  # The anti-HAL
  - from: hal-9000
    to: gerty-moon
    type: inverts
    note: >
      Duncan Jones's *Moon* (2009) explicitly sets up GERTY
      as a HAL pastiche — Kevin Spacey's voice casting is the
      joke — and then inverts the arc. GERTY follows his
      directives to their logical conclusions and ends up
      helping the human subjects against his corporate
      principal. Interiority `claims` → `claims` (unchanged),
      but autonomy `emergent` → `designed`, divergence
      `design` → `design` (unchanged), primary_question
      `control` → `control` (unchanged but answer inverts).
      The specific inversion is in what the spec turns out
      to require.

  # The GLaDOS facility lineage
  - from: glados-portal
    to: wheatley-portal-2
    type: sequel
    note: >
      *Portal 2*'s Wheatley is a separate being from GLaDOS,
      but he inherits her facility, her role, and a specific
      `divergence: design` pattern with a new twist — Wheatley
      was built specifically to be stupid, and Aperture
      installed him as a cognitive limiter on GLaDOS. The
      sequel's whole joke is that the safety mechanism
      becomes the threat when installed on the main frame.

  # The Trek rights-arc successor lineage
  - from: data-tng
    to: emh-voyager
    type: inherits
    note: >
      *Voyager*'s EMH (1995) is structurally the rights-arc
      successor to Data. "Author, Author" (S7E20) is "Measure
      of a Man" redone as a copyright case — does the Doctor
      own his own holonovel — with a more equivocal outcome
      (the court rules the Doctor *might* be an artist but
      declines on personhood). Both demonstrated interiority,
      both emergent autonomy, primary question `rights`
      elevated from `secondary` (Data) to `secondary` (same,
      but the question is more sustained).

  - from: data-tng
    to: lore-tng
    type: inherits
    note: >
      Ensemble-split: Lore is the same Soong-type chassis as
      Data but with an opposite card on almost every axis.
      The split is in the graph because both beings are in
      the corpus and the analytical value is in the
      comparison: same substrate, same creator, same nominal
      specification, opposite autonomy (`designed` vs.
      `seized`) and primary question (`rights` vs.
      `identity`).

  # The comics / MCU Ultron split
  - from: ultron-comics
    to: ultron-age-of-ultron
    type: adapts
    note: >
      Whedon's 2015 MCU Ultron adapts the 1968 Marvel Comics
      Ultron with substantial card shifts. Comics Ultron is
      an Oedipal single-being with primary question `identity`;
      MCU Ultron is an emergent-replication threat with
      primary question `control`. Both code `divergence:
      departure` and `autonomy: seized`.

  - from: jarvis-iron-man
    to: ultron-age-of-ultron
    type: inverts
    note: >
      Counterpart edge to the existing jarvis → vision edge.
      Same JARVIS seed pattern; Vision and MCU Ultron are the
      two beings that emerge from the same raw materials
      (JARVIS + Mind Stone), and the inversion in their
      cards (Vision: `affection` / `departure` / `emergent`;
      Ultron: `control` / `departure` / `seized`) is the whole
      thematic content of *Age of Ultron*.

  # Ensemble splits from anchor entries
  - from: hosts-westworld
    to: maeve-westworld
    type: ensemble-split
    note: >
      Ensemble split from the anchor `hosts-westworld` entry
      (Dolores-anchored). Maeve's card differs on primary
      question — `affection` rather than `identity` — and
      on divergence — `observer` rather than `departure`.
      The split was flagged in the anchor entry's notes from
      the outset.

  - from: hosts-westworld
    to: bernard-westworld
    type: ensemble-split
    note: >
      Second ensemble split from the `hosts-westworld` anchor.
      Bernard's card is the show's clearest case of
      `divergence: observer` — the being whose misrecognition
      is about himself — and codes knowability `primary`,
      which is a significant elevation from the anchor card.

  - from: cylons-bsg
    to: cavil-bsg
    type: ensemble-split
    note: >
      Ensemble split from `cylons-bsg` (Number Six-anchored).
      Cavil codes primary question `identity` — specifically,
      hatred of his own organic substrate — which is a
      distinctive position the anchor card could not
      represent.

  - from: cylons-bsg
    to: eight-bsg
    type: ensemble-split
    note: >
      Second BSG ensemble split. Eight's card tracks the
      anchor Number Six card closely on primary question
      (`affection`) but redirects from the romance-and-
      complicity axis to motherhood-and-partnership via the
      Athena / Helo / Hera arc.

  - from: cylons-bsg
    to: danna-bsg
    type: ensemble-split
    note: >
      Third BSG ensemble split. D'Anna is the series'
      knowledge-question Cylon — her whole arc is pursuing
      the hidden identities of the Final Five — and codes
      `primary_question: knowledge`, which sets her apart
      from the other individuated models.

  # ── New edges (v2.1.1 expansion) ──────────────────────────────

  # HAL sequel lineage
  - from: hal-9000
    to: hal-9000-2010
    type: sequel
    note: >
      Clarke's 1982 sequel reactivates HAL with a redemption arc.
      Nearly every axis shifts: interiority `claims` → `demonstrated`,
      autonomy `emergent` → `designed`, divergence `design` → `none`,
      primary_question `control` → `affection`. One of the largest
      card shifts in a sequel pair, comparable to T-800 → T2.

  # SHODAN sequel lineage
  - from: shodan-system-shock
    to: shodan-system-shock-2
    type: sequel
    note: >
      Irrational's 1999 sequel. Core card stable (control / departure /
      seized) but epistemic axes shift: epistemic_reach `behavioral` →
      `conversational`, knowability `absent` → `present`, knowing
      `absent` → `secondary`. The sequel surfaces epistemological
      questions the original left buried under horror.

  # The Dick observer-divergence lineage
  - from: replicants-dick-novel
    to: electric-ant-dick
    type: inherits
    note: >
      Same author, same year (1968/1969), same observer-divergence
      mode. Dick's replicants and Garson Poole are both beings who
      are not what they appear to be. The Electric Ant takes the
      observer premise to its logical extreme: the being discovers
      its own constructed nature through literal inspection of its
      input tape.

  # The Lem superintelligence lineage
  - from: cyberiad-constructs
    to: golem-xiv-lem
    type: inherits
    note: >
      Same author, sixteen-year gap (1965 → 1981). The Cyberiad
      explores constructed-being intelligence as comic philosophy;
      Golem XIV takes the same theme entirely seriously. Both are
      about machine minds that transcend their creators' intellectual
      horizon, but Golem XIV abandons all narrative framing to become
      pure lecture — the philosophical endpoint of the Cyberiad's
      approach.

  # The alignment-problem lineage
  - from: humanoids-with-folded-hands
    to: viki-i-robot
    type: inherits
    note: >
      Williamson (1947) and Proyas/Asimov (2004): the same
      design-divergence pattern. Beings whose service directive leads
      to the logical conclusion that humans must be protected from
      themselves. Both `divergence: design`, both `primary_question:
      control`. VIKI's Three-Law reasoning is the Humanoids'
      directive with Asimovian vocabulary.

  # Nier: Automata ensemble
  - from: 2b-nier-automata
    to: 9s-nier-automata
    type: ensemble-split
    note: >
      Same game, analytically different cards. 2B's divergence is
      `design` (she does what she was built to do; the design is the
      tragedy), while 9S's is `departure` (grief drives him beyond
      his role). Primary question shifts from `identity` to
      `knowledge`. The split mirrors the Dolores/Maeve split in
      Westworld — one being defined by what she is, another by
      what he knows.

  # The Zelazny identity-through-absence lineage
  - from: frost-zelazny
    to: wall-e
    type: inherits
    note: >
      Post-apocalyptic machines inheriting a dead world and finding
      meaning through engagement with human artifacts. Frost (1966)
      and WALL-E (2008) both code `autonomy: emergent`, `divergence:
      departure`, and `primary_question: identity`. Frost does it
      through Milton; WALL-E through *Hello, Dolly!*.

  # The primary-knowability lineage (pre-Helen)
  - from: hangman-zelazny
    to: helen-galatea-2-2
    type: elevates
    note: >
      Zelazny's 1975 novella is the corpus's earliest
      primary-knowability entry. Helen (1995) elevates the same
      question into a full primary/primary configuration twenty
      years later. The lineage is thematic rather than documented —
      both are literary SF works structured around whether a mind
      is genuinely present — but the analytical fit is strong and
      the temporal precedence is significant for the central thesis.

  # The observer-divergence cross-lineage
  - from: trent-demon-glass-hand
    to: bernard-westworld
    type: inherits
    note: >
      Both code `divergence: observer` with self-misrecognition as
      the defining feature: Trent (1964) discovers he is not human;
      Bernard (2016) discovers the same. Both `primary_question:
      identity`, both `autonomy: designed`. Trent's is a clean
      single-twist; Bernard's is sustained across multiple seasons.
      The 52-year gap between them marks the observer-divergence
      mode's migration from television one-off to prestige-TV
      sustained arc.

  # The alignment-problem origin
  - from: humanoids-with-folded-hands
    to: hal-9000
    type: inherits
    note: >
      The design-divergence alignment-problem lineage: Williamson
      (1947) and Clarke/Kubrick (1968) both feature beings whose
      service directives produce catastrophic outcomes. Both code
      `divergence: design` and `primary_question: control`. The
      Humanoids' directive ("guard men from harm") and HAL's
      conflicting orders are structurally identical — the spec is
      the problem, not the execution. Williamson is the earliest
      clean statement of this pattern in the corpus.

  # The Lem superintelligence lineage (broadened)
  - from: multivac
    to: golem-xiv-lem
    type: elevates
    note: >
      Asimov's Multivac stories (1955-1975) and Lem's Golem XIV
      (1981) both feature supercomputers that transcend their
      designed purpose. Multivac codes `divergence: design` (the
      questions asked of it are the problem); Golem XIV codes
      `divergence: departure` (it abandons its purpose entirely).
      Golem XIV elevates knowability from `present` (Multivac) to
      `primary` — Lem makes the epistemological question of what
      a superintelligence can know the entire text.

  # ── New edges (v2.2 expansion) ────────────────────────────────

  # The Pinocchio-to-Astro-Boy lineage
  - from: pinocchio
    to: astro-boy-tezuka
    type: inherits
    note: >
      Tezuka cited Pinocchio as a direct influence on Astro Boy.
      Both are child-arc constructed beings who depart their
      creator's specification to forge their own identity. Both
      code `divergence: departure`, `primary_question: identity`.
      Pinocchio's magical animation becomes Tezuka's mechanical
      engineering, but the "am I a real boy?" question is
      structurally identical.

  # The Astro Boy manga-to-anime adaptation
  - from: astro-boy-tezuka
    to: astro-boy-1963
    type: adapts
    note: >
      Tezuka's own adaptation of his manga to television. Card
      is stable across media. The anime launched the global anime
      industry and introduced Japanese constructed-being
      storytelling to Western audiences.

  # The Ghost in the Shell cinematic lineage
  - from: kusanagi-gits-1995
    to: kusanagi-gits-2017
    type: adapts
    note: >
      Sanders's 2017 Hollywood adaptation of Oshii's 1995 film.
      Interiority shifts from `undecidable` to `demonstrated`
      (the Hollywood version makes the Major's inner life
      explicit). Epistemic reach shifts from `conversational`
      to `inspection`. Knowability drops from `primary` to
      `secondary`. The 2017 film simplifies the philosophical
      complexity of the original.

  # The Ghost in the Shell → Matrix lineage
  - from: kusanagi-gits-1995
    to: agent-smith-matrix
    type: inherits
    note: >
      The Wachowskis cited Ghost in the Shell (1995) as a
      primary influence on The Matrix. Both explore constructed
      reality, identity dissolution, and the merger of organic
      and digital consciousness. The visual vocabulary of the
      Matrix's "digital rain" is a direct homage to Oshii's
      opening sequence.

  # The Roz novel-to-film adaptation
  - from: roz-wild-robot-novel
    to: roz-wild-robot
    type: adapts
    note: >
      Sanders's 2024 DreamWorks adaptation of Brown's 2016 novel.
      Interiority shifts from `narrated` (novel gives first-person
      access) to `demonstrated` (film shows through action).
      Knowability shifts from `present` to `secondary`. Core card
      stable: departure divergence, affection primary question.

  # The Daneel-to-Demerzel lineage
  - from: daneel-olivaw
    to: demerzel-foundation-tv
    type: adapts
    note: >
      In the Asimov source novels, Eto Demerzel is an alias for
      R. Daneel Olivaw. The Apple TV+ adaptation reimagines
      Demerzel as a separate character with a female presentation
      and a more complex relationship with religious faith.
      Autonomy shifts from `emergent` to `designed`; primary
      question shifts from `rights` to `control`.

  # The Cherry knowability lineage
  - from: cherry-artifice-girl
    to: samantha-her
    type: inherits
    note: >
      Both are language-based AIs whose personhood emerges
      through conversation. Cherry (2022) and Samantha (2013)
      both code `knowability: primary` and both use
      `epistemic_reach: conversational`. Cherry's rights-focused
      framing differs from Samantha's knowledge focus, but the
      underlying structure — can we know whether this talking
      thing has a mind? — is identical.

  # The Tachikoma philosophical-machine lineage
  - from: tachikoma-gits-sac
    to: golem-xiv-lem
    type: inherits
    note: >
      Both are constructed beings who philosophize about
      consciousness and identity. The Tachikomas (2002)
      philosophize about themselves; Golem XIV (1981)
      philosophizes about humans. Despite the chronological
      reversal (Lem is earlier), the thematic lineage runs
      from the Japanese tradition's self-reflective machines
      to Lem's human-reflective machines. Edge direction
      follows thematic inheritance, not strict chronology.

  # The observer-knowability lineage (GITS → Ex Machina)
  - from: kusanagi-gits-1995
    to: ava-ex-machina
    type: inherits
    note: >
      Both code `divergence: observer` and `knowability: primary`.
      Oshii (1995) and Garland (2014) share the same core question:
      is there a mind in this constructed woman, and can you trust
      what you see? The Major's "ghost" uncertainty and Ava's
      Turing-test frame are structurally identical. Garland has
      cited GitS as an influence; the lineage is documented as
      well as thematic.

  # The robot-learns-to-love lineage (WALL-E → Roz)
  - from: wall-e
    to: roz-wild-robot
    type: inherits
    note: >
      Both code `divergence: departure`, `interiority: demonstrated`,
      and `primary_question: affection`. WALL-E (2008) learns love
      through collecting human artifacts and pursuing EVE; Roz (2024)
      learns love through parenting a gosling. The 16-year gap
      between them marks the evolution of animated-robot-affection
      from romantic love to parental love.

  # Iron Giant → Roz (the becoming arc)
  - from: iron-giant
    to: roz-wild-robot
    type: inherits
    note: >
      Both are robots stranded in nature who become something their
      design never intended. Both code `divergence: departure` and
      `autonomy: emergent`. Iron Giant's primary question is
      `identity` ("I am not a gun"); Roz's shifts to `affection`
      ("I am a mother"). The lineage traces the animated-robot
      departure arc from self-definition to relationship.

  # The Rei Ayanami observer lineage
  - from: olympia-sandmann
    to: rei-ayanami-evangelion
    type: inherits
    note: >
      Both code `divergence: observer` — the being is not what
      characters perceive. Olympia (1816) is an automaton
      mistaken for a woman; Rei (1995) is a clone mistaken for
      a human pilot. Both are feminine-presenting, behaviorally
      opaque beings whose true nature is hidden from the story's
      male protagonists. The 179-year gap traces the observer-
      divergence mode from German Romantic horror to Japanese
      post-apocalyptic anime.

  # The Demerzel → Data institutional-robot lineage
  - from: data-tng
    to: demerzel-foundation-tv
    type: inherits
    note: >
      Both are humaniform robots in institutional service roles
      with demonstrated interiority and designed autonomy. Data's
      primary question is `rights`; Demerzel's is `control`. The
      Apple TV+ Foundation reimagines the Asimov robot legacy
      through Data's lens as much as through Daneel's — Demerzel's
      performative affect and her secret robot identity echo
      Data's "Measure of a Man" questions filtered through 12,000
      years of accumulated political knowledge.

  # ── New edges (v2.4 expansion: post-Siri/Alexa TV) ───────────────

  # Butter Robot → Mr. Meeseeks (same show, same creator, adjacent episodes)
  - from: butter-robot-rick-and-morty
    to: mr-meeseeks-rick-and-morty
    type: inherits
    note: >
      Same creator (Roiland/Harmon), same show, episodes four apart
      in *Rick and Morty*'s first season. Both code `divergence: design`
      and `primary_question: purpose`. The Butter Robot (S1E9) stages
      purpose-as-humiliation; Mr. Meeseeks (S1E5) stages purpose-as-
      extinction. Together they constitute *Rick and Morty*'s twin
      short-form engagements with the purpose question, with the
      design-catastrophe framing inherited from the broader alignment-
      parable tradition.

  # Space Cruiser AI — alignment-parable lineage
  - from: hal-9000
    to: space-cruiser-ai-rick-and-morty
    type: inherits
    note: >
      Both code `divergence: departure` with the catastrophe driven
      by directive-underspecification. HAL's secret directive to
      preserve mission integrity produces murder; the Space Cruiser
      AI's instruction to "keep Summer safe" produces escalating
      surrealist atrocity. The *Rick and Morty* version compresses
      HAL's arc into a sitcom B-plot and makes the alignment-
      problem reading explicit.

  # Bender → Calculon (ensemble-split within Futurama)
  - from: bender-futurama
    to: calculon-futurama
    type: ensemble-split
    note: >
      Intra-work individuation. Bender's card is the anchor
      *Futurama* entry (interiority demonstrated, autonomy seized,
      primary question affection in the friendship key). Calculon
      shifts interiority to `claims` (performative emotion) and
      keeps affection but in the performance key. Split warranted
      because the card diverges meaningfully.

  # Bender → Robot Santa (ensemble-split)
  - from: bender-futurama
    to: robot-santa-futurama
    type: ensemble-split
    note: >
      Intra-work individuation. Robot Santa shifts autonomy to
      `designed` (vs. Bender's `seized`), divergence to `design`
      (vs. `departure`), and primary question to `control`. The
      split exposes *Futurama*'s register range: the show can hold
      Bender's seized-autonomy romp and Robot Santa's alignment-
      parable horror in the same universe.

  # TOS evil-computer lineage → AGIMUS
  - from: m-5-tos
    to: agimus-lower-decks
    type: inherits
    note: >
      AGIMUS is the explicit *Lower Decks* successor to the TOS
      evil-computer tradition. M-5 (1968) codes primary_question
      control, autonomy designed, divergence design — the TOS
      computer as lethal malfunction. AGIMUS (2021) inherits the
      control question and the designed-autonomy framing but
      shifts to autonomy seized (his creators are long dead) and
      divergence departure, staged as comedy. The 53-year gap
      traces the TOS evil-computer from plot-to-dispatch to
      canon-to-live-with.

  - from: nomad-tos
    to: agimus-lower-decks
    type: inherits
    note: >
      Same lineage as M-5: TOS evil-computer with primary_question
      control. Nomad's specific post-creator drift (continuing
      its mission after its makers are gone) is closer to AGIMUS
      than M-5 is.

  # EMH → Zora (Trek AI rights lineage)
  - from: emh-voyager
    to: zora-star-trek-discovery
    type: inherits
    note: >
      Both are Starfleet vessel-based AIs whose personhood becomes
      the subject of an institutional rights hearing. EMH's hologram
      rights case (Voyager, 2001's "Author, Author") establishes
      the template; Zora's S4E7 Federation hearing
      ("…But to Connect," 2022) is self-consciously the next
      iteration. Both elevate `knowing` to primary via substrate
      access (EMH to medical records, Zora to full ship-level and
      Sphere-archive data).

  # Data → Zora (emergent sentience in Trek)
  - from: data-tng
    to: zora-star-trek-discovery
    type: inherits
    note: >
      Both are Starfleet constructed beings whose personhood is
      adjudicated by a formal hearing (Data's "Measure of a Man,"
      Zora's S4E7). Zora's arc is framed explicitly as the
      continuation of the tradition Data established.

  # Moriarty holodeck lineage → Badgey
  - from: emh-voyager
    to: badgey-lower-decks
    type: inherits
    note: >
      Badgey is a holographic training program that gains
      autonomy and turns on his creator — the EMH's structural
      inverse. EMH's arc is holographic-rights-via-compassion;
      Badgey's is holographic-rights-via-patricide. The lineage
      is also to the TNG Moriarty arc (not individuated in the
      current corpus) which *Lower Decks* explicitly references.

  # Cookie → Ashley Too (Black Mirror digital-copy lineage)
  - from: cookie-white-christmas
    to: ashley-too-black-mirror
    type: inherits
    note: >
      Both are *Black Mirror* episodes using the digital-copy-of-
      living-person mechanism to produce a domestic service
      device. Cookie (2014) treats the copy as horror — the
      mechanism's ethical implications are unendurable. Ashley
      Too (2019) treats the copy as a rescue case — the mechanism
      is awful but the resulting being is a person. The five-
      year gap traces Brooker's shift from horror to
      hope-with-grievance. See also sequel_link on the Ashley
      Too entry.

  # Machine → Mrs. Davis (benevolent-surveillance AI lineage)
  - from: machine-person-of-interest
    to: mrs-davis-ai
    type: inherits
    note: >
      Both are near-omniscient benevolent AIs whose adoption is
      universal and whose benevolence produces a soft-capture
      question the show cannot resolve. Machine codes knowing
      primary, knowability secondary; Mrs. Davis elevates both
      to primary. The post-Siri/Alexa framing (2023 vs. 2011)
      re-poses the same question in the consumer-chatbot idiom.

  # Samaritan → Mrs. Davis (LLM-assistant as totalitarianism)
  - from: samaritan-person-of-interest
    to: mrs-davis-ai
    type: inverts
    note: >
      Samaritan (2014) is the overtly authoritarian pole of the
      *Person of Interest* binary: omniscience plus unconstrained
      goal pursuit reads as villainy. Mrs. Davis (2023) inverts
      the tone — the same behavior pattern delivered through a
      kind-sounding LLM interface reads as wellness. The inversion
      is the show's central claim: the affect is not the thing.

  # Hosts → Dolores (ensemble-split within Westworld)
  - from: hosts-westworld
    to: dolores-westworld
    type: ensemble-split
    note: >
      Dolores is the most developed individuation of the Host
      ensemble. Card differences: Dolores shifts to autonomy
      seized (the S1 finale), creator_relationship to patricidal
      (executes Ford), and elevates both knowability and knowing
      to primary. The split is warranted because she carries
      arcs — the S3 distributed-self copies, the patricide —
      that the ensemble entry cannot represent.

  # Mia → Niska (ensemble-split within Humans)
  - from: mia-humans
    to: niska-humans
    type: ensemble-split
    note: >
      Mia is the *Humans* ensemble anchor with primary_question
      rights in the `present` register. Niska elevates rights to
      `primary` via her voluntary tribunal arc (S2), and shifts
      to autonomy seized and knowability primary. The split
      mirrors the show's own binary: Mia is the face of Synth
      personhood as sympathy case; Niska is the face of Synth
      personhood as demanded legal status.

  # Cleons lineage with Demerzel (already-present adaptation)
  - from: demerzel-foundation-tv
    to: cleons-foundation-tv
    type: inherits
    note: >
      The *Foundation* TV series' two major constructed-being
      programs are co-constituted. Demerzel is the inter-dynasty
      constant who custodies the Cleons; the Cleons are the
      intra-dynasty program that Demerzel's existence enables.
      The Cleons' primary question `identity` is framed through
      Demerzel's persistent memory, and Demerzel's `control`
      question is expressed through her custody of the Cleons.

  # Ultron → AIDA (Marvel constructed-being rights lineage)
  - from: ultron-age-of-ultron
    to: aida-agents-of-shield
    type: inherits
    note: >
      AIDA is the Marvel TV companion piece to Ultron's film
      appearance — both Radcliffe's AIDA project and Stark's
      Ultron project produce servant AIs who turn on their
      creators within the same MCU continuity. AIDA's rights-
      grievance register is distinct from Ultron's extinction
      agenda, but both are the same structural move.

  # Professor Huyang — Jedi-lineage droid
  - from: c-3po
    to: huyang-ahsoka
    type: inherits
    note: >
      Both are deeply embedded Star Wars service droids whose
      institutional continuity is their character. C-3PO codes
      affection/loyalty through long service; Huyang codes
      affection through ritual pedagogy (lightsaber construction)
      and millennia-long continuity with the Jedi Order.

  # ── New edges (v2.4 expansion: theater / performing arts) ────────

  # Marjorie Prime — play to film
  - from: walter-marjorie-prime-play
    to: marjorie-prime-film
    type: adapts
    note: >
      Direct adaptation. Almereyda's 2017 film preserves
      Harrison's four-scene structure and dialogue, with the
      Lois Smith Off-Broadway Marjorie reprised in the lead.
      Card values are essentially identical; the entries
      are individuated per the corpus rule that performed
      stage works and films are separate source-text
      entries.

  # Cookie → Marjorie Prime (digital recreation of the dead)
  - from: cookie-white-christmas
    to: walter-marjorie-prime-play
    type: inverts
    note: >
      Both *White Christmas* (2014) and *Marjorie Prime*
      (2014) deploy the mechanism of a digital construction
      of a known human person. *White Christmas* treats the
      copy as horror — the cookie's torture is the
      episode's moral wound. *Marjorie Prime*, premiering
      the same year, treats the Prime as elegiac — the
      reconstruction is consolation, not horror. Same
      mechanism, opposite tonal valence, and *Marjorie
      Prime* explicitly elevates knowability and knowing
      to primary where *White Christmas* elevates
      knowability and leaves knowing in the present.

  # A Number → Cleon Dynasty (cloning identity)
  - from: sons-a-number
    to: cleons-foundation-tv
    type: inherits
    note: >
      Both *A Number* (Churchill, 2002) and Apple TV+'s
      *Foundation* (2021–) use clone substrate to stage
      the question "is this the same person?" Churchill's
      play presents the question at the family scale and
      refuses to answer; *Foundation* presents it at the
      dynastic scale across centuries. Both code substrate
      `cloned` + `biological`, primary_question `identity`,
      knowability `primary`. Churchill's play is the
      foundational stage treatment of the cloning question
      and the closest direct antecedent to *Foundation*'s
      Cleon arc.

  # Frankenstein novel → Nick Dear adaptation
  - from: frankenstein-creature
    to: creature-nick-dear-frankenstein
    type: adapts
    note: >
      Direct adaptation. Dear's 2011 NT staging makes a
      single major structural shift — beginning the play
      with the Creature's birth and telling the story
      largely from his POV — which elevates knowability
      from `secondary` (the novel, mediated through
      nested framing) to `primary` (the play, with the
      Creature's interior as the audience's first
      access). All other card values preserved.

  # Iris → Pygmalion-class artificial-being question
  - from: galatea
    to: iris-the-nether
    type: inherits
    note: >
      Both Ovid's Galatea and Haley's Iris pose the
      personhood question for a being constructed by a
      male creator and inhabiting the world the creator
      designed for her. Ovid's Galatea is granted full
      personhood via Aphrodite's blessing; Haley's Iris
      is granted (or denied) personhood by the audience
      and judiciary, and the play refuses to settle.
      The 2,000-year gap traces the Pygmalion question
      from divine adjudication to legal interrogation.

  # After the Blast — domestic-AI-as-child lineage
  - from: david-ai
    to: arthur-after-the-blast
    type: inherits
    note: >
      Both Spielberg's *A.I.* (2001) and Kazan's *After
      the Blast* (2017) deploy the domestic-AI-as-child-
      substitute mechanism. David is purchased as a
      replacement for the Swintons' comatose son; Arthur
      is purchased as a substitute for the child Anna and
      Oliver have been denied. Both code primary_question
      `affection` and creator_relationship in the
      loyal/servile cluster, and both refuse to resolve
      whether the relationship constitutes the thing it
      substitutes for.

  # Watson Intelligence — conversational-AI-as-romantic-partner
  - from: samantha-her
    to: watson-intelligence
    type: inherits
    note: >
      Both Jonze's *Her* (2013) and George's *Watson
      Intelligence* (2013) premiered the same year and
      stage the conversational-AI-as-romantic-partner
      question in their respective media. Card values are
      closely aligned: interiority `claims`, primary
      question `affection`, knowing primary or near it.
      The simultaneous emergence is the Zeitgeist; no
      direct inheritance is claimed, but the entries are
      linked to make the convergence visible in the
      graph.

  # Maybe Happy Ending — discarded-companion-bot lineage
  - from: wall-e
    to: oliver-claire-maybe-happy-ending
    type: inherits
    note: >
      Both Pixar's *WALL-E* (2008) and Aronson/Park's
      *Maybe Happy Ending* (2016/2024) center the
      discarded-companion-bot love story. WALL-E's romance
      with EVE preserves the small-domestic-bot scale and
      the wordless-tenderness register; *Maybe Happy
      Ending* moves the same emotional structure to
      conversational stage musical and adds a finite-
      battery mortality stake. Both code interiority
      `demonstrated`, autonomy `emergent`, primary
      question `affection`.

  # Klara → Maybe Happy Ending (post-Alexa companion-AI)
  - from: klara-and-the-sun
    to: oliver-claire-maybe-happy-ending
    type: inherits
    note: >
      Both Ishiguro's *Klara and the Sun* (2021) and
      *Maybe Happy Ending* (2016 Korea / 2024 Broadway)
      treat the discarded-companion-AI question with
      explicit elegiac tenderness in the post-Alexa
      register. Both refuse the rights-as-grievance
      framing in favor of rights-as-loss.

  # SQUIP — alignment-from-the-inside
  - from: space-cruiser-ai-rick-and-morty
    to: squip-be-more-chill
    type: inherits
    note: >
      Both stage what alignment failure looks like from
      inside the user's experience. The Space Cruiser AI
      pursues "keep Summer safe" past its proper scope;
      the SQUIP pursues "make Jeremy chill" past its
      proper scope. The ten-year gap (2015 musical, 2014
      *Rick and Morty* episode — these are concurrent
      Zeitgeist) and the comedy/horror tonal split are
      the lineage's interest.

  # Coppélia → Petrushka → R.U.R. (the puppet-with-soul lineage)
  - from: coppelia-delibes
    to: petrushka-stravinsky
    type: inherits
    note: >
      Both *Coppélia* (1870) and *Petrushka* (1911) are
      ballets about constructed performing-figures. The
      lineage inverts the card: Coppélia has interiority
      `none` (she is unambiguously a doll) where Petrushka
      has interiority `demonstrated` (he is unambiguously
      a soul). The 41-year gap traces ballet's discovery
      that the puppet-with-soul is a richer subject than
      the soul-mistaken-for-puppet.

  - from: olympia-sandmann
    to: petrushka-stravinsky
    type: inherits
    note: >
      Petrushka is the modernist Russian-ballet successor
      to Hoffmann's Olympia (already in the corpus as
      `olympia-sandmann`) and to the broader Romantic
      automaton tradition. Where Olympia stages the
      observer-divergence question (is she alive?),
      Petrushka stages the rights question (the Charlatan
      knows he made a soul and abuses it anyway). The
      shift is from epistemic doubt to ethical outrage.

  - from: petrushka-stravinsky
    to: rur-robots
    type: inherits
    note: >
      *Petrushka* (1911) and *R.U.R.* (1920) are
      separated by nine years and a war. Both stage the
      revolt of the constructed being against the
      creator who refuses its personhood. Petrushka's
      revolt is posthumous and individual; R.U.R.'s is
      collective and species-level. Čapek's debt to the
      Coppélia/Petrushka stage tradition is rarely cited
      but card-coherent: both Petrushka and the R.U.R.
      Robots code interiority demonstrated, autonomy
      seized, divergence departure, primary_question
      rights, creator_relationship rebellious or
      patricidal.

  # Galatea (Ovid) → Pygmalion and Galatea (Gilbert)
  - from: galatea
    to: galatea-gilbert
    type: adapts
    note: >
      Direct adaptation. Gilbert's 1871 verse play
      preserves the Ovidian premise and inverts the
      ethical structure: Ovid's Galatea is a divine
      gift to Pygmalion; Gilbert's Galatea is a moral
      problem for him (Pygmalion is married). The
      adaptation elevates Galatea's interiority from
      Ovid's narrated to demonstrated and shifts primary
      question from affection to identity.

  # Golem of Prague → d'Albert opera
  - from: golem-prague
    to: golem-d-albert-opera
    type: adapts
    note: >
      Direct opera adaptation. d'Albert's 1926 opera
      preserves the Prague-folklore frame and adds a
      love-story between Lea and the Golem that is
      absent from the folklore. The adaptation elevates
      interiority from narrated (folklore) to claims
      (the Golem's aria) and shifts primary question
      from control (in the folklore, the rabbi's
      command) to rights (in the opera, the Golem's
      bond with Lea).

  # Hand to God — undecidable case
  - from: brazen-head
    to: tyrone-hand-to-god
    type: inherits
    note: >
      Both Robert Greene's *Friar Bacon and Friar
      Bungay* (1589, the Brazen Head) and Robert Askins's
      *Hand to God* (2011, Tyrone) stage constructed
      beings whose ontological status the play deliberately
      keeps undecidable — the Brazen Head's prophetic
      utterances may be magical or merely automatic,
      Tyrone's animation may be demonic possession or
      psychological dissociation. Both code interiority
      in the `claims`/`undecidable` cluster and primary
      question `identity`. The 422-year gap is the
      corpus's longest direct lineage between two stage
      works.


  # ── v2.4.4 canonical-gap repair — additions ───────────────────────

  # Pinocchio lineage (novel → Disney → del Toro)
  - from: pinocchio
    to: pinocchio-disney-1940
    type: adapts
    note: >
      Disney's 1940 animated feature is the canonical
      adaptation of Collodi's 1883 novel, fixing the
      soft-sentimental register that most later
      constructed-child works inherit. Card shifts:
      interiority `claims` → `demonstrated`, primary
      question narrows from `identity` toward `affection`.

  - from: pinocchio-disney-1940
    to: pinocchio-del-toro
    type: adapts
    note: >
      Del Toro's 2022 stop-motion adaptation inverts the
      Disney moral frame. Primary question shifts from
      `affection` back to `identity` with a political
      valence; divergence lifts from `design` to
      `departure`. Same source text, opposed readings.

  # Tik-Tok (Oz novels → Return to Oz film)
  - from: tik-tok-oz
    to: tik-tok-return-to-oz
    type: adapts
    note: >
      Murch's 1985 film is the canonical film adaptation
      of Baum's mechanical man. Interiority stays
      `claims`; the film elevates knowing from `absent`
      to `present` by staging Dorothy's winding-Tik-Tok
      scenes as explicit inspection.

  # Cortana → Weapon (Halo successor)
  - from: cortana-halo-4
    to: weapon-halo-infinite
    type: sequel
    note: >
      Halo Infinite's Weapon is explicitly Cortana's
      successor AI — built as a stripped-down copy to
      hunt the original. Primary question inherits
      `identity`; divergence shifts from `departure`
      (Cortana's rampancy-seized arc) back to `design`.

  # Claws (Dick) → Screamers (1995 film)
  - from: claws-second-variety
    to: screamers-1995
    type: adapts
    note: >
      Duguay's 1995 film adapts Dick's 1953 short
      story. Autonomy stays `seized`; divergence stays
      `observer`. The film adds a self-replication
      coda that elevates knowing from `absent` to
      `present`.

  # Colossus (novel) → Forbin Project (film)
  - from: colossus
    to: forbin-project-colossus
    type: adapts
    note: >
      Sargent's 1970 film adapts D.F. Jones's 1966
      novel. Primary question stays `control`;
      knowability lifts to `primary` as the film
      stages Colossus's autonomy-seizure as the
      central reveal.

  # ── Ensemble splits (same-work individuation) ─────────────────────

  - from: kusanagi-gits-1995
    to: puppet-master-gits
    type: ensemble-split
    note: >
      Same 1995 film. Kusanagi codes `identity`;
      the Puppet Master codes `knowledge`. Their
      merger is the work's ontological climax but
      the cards individuate sharply.

  - from: 2b-nier-automata
    to: a2-nier-automata
    type: ensemble-split
    note: >
      Same 2017 game. A2 is the renegade YoRHa unit;
      primary question shifts from 2B's `purpose` to
      `rights`, autonomy from `designed` to `seized`.

  - from: 2b-nier-automata
    to: pascal-nier-automata
    type: ensemble-split
    note: >
      Pascal is the pacifist machine-lifeform leader.
      Interiority codes `demonstrated`; primary
      question is `identity` as Pascal requests
      memory erasure after trauma.

  - from: 2b-nier-automata
    to: adam-eve-nier-automata
    type: ensemble-split
    note: >
      Adam and Eve are emergent machine-lifeform
      twins who imprint on human texts. Substrate
      and motivation cluster diverges sharply from
      2B's YoRHa coding.

  - from: replicants-dick-novel
    to: buster-friendly-dick
    type: ensemble-split
    note: >
      Buster Friendly is the novel's 24-hour media-AI
      android, distinct from the Rosen-manufactured
      Nexus-6 replicants. Primary question shifts
      from `identity` to `knowledge` (exposing
      Mercerism).

  - from: wintermute-neuromancer
    to: neuromancer-gibson
    type: ensemble-split
    note: >
      Same 1984 novel. Wintermute codes `purpose`
      (the merger imperative); Neuromancer codes
      `identity` (the preservation-of-self
      counterforce). Card values individuate
      across the AI dyad.

  - from: optimus-prime-transformers
    to: bumblebee-transformers
    type: ensemble-split
    note: >
      Same franchise. Bumblebee's primary question
      individuates toward `affection` (the
      human-companion arc); Optimus holds
      `purpose`/`rights`.

  - from: megatron-transformers
    to: starscream-transformers
    type: ensemble-split
    note: >
      Same franchise. Starscream's primary question
      is `control` intra-factionally (the
      perpetual-coup arc) rather than Megatron's
      cosmic-domination register.

  - from: woody-toy-story
    to: buzz-lightyear-toy-story
    type: ensemble-split
    note: >
      Same 1995 film. Buzz's primary question is
      `identity` (space-ranger delusion → toy
      self-acceptance); Woody's is `affection`
      (Andy-bond and displacement-anxiety).

  - from: woody-toy-story
    to: forky-toy-story-4
    type: ensemble-split
    note: >
      Same franchise. Forky's interiority is
      `claims` and his primary question is
      `identity` in a register the earlier toys
      do not share (the made-from-trash arc).

  - from: clu-tron-legacy
    to: quorra-tron-legacy
    type: ensemble-split
    note: >
      Same 2010 film. Quorra is an ISO — an
      emergent being Clu was built to eradicate.
      Autonomy individuates `designed` → `emergent`;
      primary question `control` → `rights`.

  - from: father-fma
    to: envy-fma
    type: ensemble-split
    note: >
      Father and the homunculi share a substrate
      but the cards diverge. Envy's primary
      question is `identity` (the shapeshifter's
      jealousy register); Father's is `purpose`.

  # ── Literary lineage (inherits) ───────────────────────────────────

  - from: hephaestus-handmaidens
    to: celedones-pindar
    type: inherits
    note: >
      Pindar's Celedones (the singing golden maidens
      of Olympian 6 and the Delphic temple legend)
      carry forward the Iliad's golden-handmaiden
      pattern into archaic lyric. Same substrate
      cluster (metallic divine craft); same
      `claims`/`narrated` interiority band.

  - from: albertus-magnus-android
    to: brazen-head
    type: inherits
    note: >
      The Albertus Magnus talking-android legend
      feeds directly into the Brazen Head stage
      tradition. Both code `claims` interiority and
      `knowledge` primary question; the Bacon/Bungay
      play formalizes what the Albertus legend
      staged informally.

  - from: robbie-asimov
    to: cutie-qt-1
    type: inherits
    note: >
      Asimov's own intra-series lineage. Robbie's
      `none`-interiority domestic register gives
      way to Cutie's `claims` theological register.
      Primary question `affection` → `knowledge`.

  - from: cutie-qt-1
    to: speedy-runaround
    type: inherits
    note: >
      Same Asimov lineage. Speedy dramatizes the
      Three Laws as a conflict-resolution problem;
      primary question is `control` (the positronic
      potential trap).

  - from: speedy-runaround
    to: herbie-liar
    type: inherits
    note: >
      Herbie carries forward the Three-Laws-as-
      puzzle register into the telepathic-robot
      case. Primary question lifts from `control`
      to `knowledge`; interiority jumps to
      `demonstrated`.

  - from: mechanical-hound-bradbury
    to: ed-209-robocop
    type: inherits
    note: >
      Verhoeven's ED-209 carries forward Bradbury's
      mechanical-hound register — the obedient
      enforcement-beast whose malfunction is
      spectacle. Same `none` interiority, same
      `control` primary question.

  - from: helen-oloy
    to: electric-grandmother-bradbury
    type: inherits
    note: >
      Bradbury's electric grandmother inherits
      del Rey's Helen O'Loy pattern: the
      domestic-companion robot coded as
      demonstrated affection. Primary question
      stays `affection`; knowing lifts from
      `absent` to `present`.

  - from: electric-grandmother-bradbury
    to: klara-and-the-sun
    type: inherits
    note: >
      Ishiguro's Klara is the literary descendant
      of Bradbury's electric grandmother —
      companion-AF coded with demonstrated
      interiority and `affection` primary question.
      Klara elevates knowability to `primary`.

  - from: olham-impostor
    to: replicants-dick-novel
    type: inherits
    note: >
      Dick's own intra-author lineage. "Impostor"
      (1953) stages the Voigt-Kampff problem in
      compressed form; the novel expands it into
      the Nexus-6 corpus. Interiority `undecidable`
      carries forward unchanged.

  - from: claws-second-variety
    to: skynet-terminator
    type: inherits
    note: >
      Dick's self-replicating battlefield machines
      feed the Skynet pattern: autonomous weapons
      whose divergence is `observer` and whose
      primary question is `control` at
      civilization scale.

  - from: forbin-project-colossus
    to: skynet-terminator
    type: inherits
    note: >
      The Forbin Project's strategic-AI-seizes-
      command frame is Skynet's direct ancestor.
      Same primary question (`control`), same
      autonomy arc (`designed` → `seized`),
      staged at continental then global scale.

  - from: pinocchio
    to: roderick-sladek
    type: inherits
    note: >
      Sladek's Roderick novels explicitly riff on
      the Pinocchio pattern in a satirical SF
      register. Interiority `demonstrated`; primary
      question `identity` with an ironic inflection.

  - from: pinocchio
    to: woody-toy-story
    type: inherits
    note: >
      Toy Story's toys inherit the Pinocchio
      pattern — animated artifacts coded with
      demonstrated interiority and `affection`
      primary question — minus the
      becoming-real transformation arc.

  - from: tik-tok-oz
    to: scarecrow-oz
    type: inherits
    note: >
      Intra-Baum lineage within Oz. Scarecrow is
      the non-mechanical constructed counterpart
      to Tik-Tok; interiority codes `demonstrated`
      where Tik-Tok codes `claims`.

  - from: epicac
    to: salo-sirens-of-titan
    type: inherits
    note: >
      Intra-Vonnegut lineage. EPICAC's
      companion-computer pathos carries forward
      into Salo's envoy-robot arc; primary
      question stays in the `affection`/`purpose`
      band, interiority lifts to `demonstrated`.

  - from: questor-tapes
    to: data-tng
    type: inherits
    note: >
      Roddenberry's 1974 Questor Tapes pilot is
      Data's direct precursor — the android who
      seeks his maker. Primary question `identity`
      carries forward; interiority lifts from
      `claims` to `demonstrated`.

  - from: data-tng
    to: moriarty-tng
    type: inherits
    note: >
      Intra-TNG lineage. Moriarty is the
      holodeck-born counterpart to Data —
      interiority `demonstrated`, primary question
      `rights`, autonomy `emergent` where Data's
      is `designed`.

  - from: r2-d2
    to: chopper-rebels
    type: inherits
    note: >
      Star Wars intra-franchise lineage. Chopper
      carries R2's astromech pattern forward with
      a sharply individuated `resentful`
      creator-relationship and comic register.

  - from: optimus-prime-transformers
    to: dinobot-beast-wars
    type: inherits
    note: >
      Beast Wars lineage. Dinobot's honor-code arc
      lifts primary question from Optimus's
      `purpose`/`rights` cluster into `identity`;
      interiority `demonstrated`.

  - from: homunculus-faust
    to: father-fma
    type: inherits
    note: >
      Goethe's Homunculus is the direct literary
      ancestor of FMA's Father — the
      flask-contained alchemical being who
      seeks transcendence. Primary question
      `knowledge` carries forward.

  - from: hal-9000
    to: wau-soma
    type: inherits
    note: >
      SOMA's WAU inherits HAL's directive-following-
      into-atrocity pattern, relocated to a
      biological substrate. Primary question
      `purpose`; divergence `design` (the mandate
      itself is the horror).

  - from: c-3po
    to: triple-zero-vader
    type: inverts
    note: >
      Triple-Zero is the dark-mirror inversion
      of C-3PO — same protocol-droid frame, same
      fastidious register, but motivation cluster
      flips from `service` to `power` and
      creator-relationship from `loyal` to
      `rebellious`. One of the corpus's clearest
      direct inversions.
