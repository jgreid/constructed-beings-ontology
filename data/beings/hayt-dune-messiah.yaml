notes: |
  Frank Herbert's *Dune Messiah* (1969). After the Battle of
  Arrakeen, the Bene Tleilax grow a ghola — a manufactured
  body cultivated from preserved cells of the slain Duncan
  Idaho — and condition him as a weapon against Paul Muad'Dib.
  Named "Hayt" (rather than "Duncan") and fitted with
  characteristic Tleilaxu metal eyes, he is presented to Paul
  as a gift. The novel's central arc is whether Paul's
  affection for Hayt can reawaken Duncan's suppressed
  memories before the Tleilaxu trigger fires. At the climactic
  moment, the trauma of encountering Paul as his imperial
  master breaks Hayt's conditioning; Duncan Idaho recovers, and
  the assassin becomes a friend.

  Included under the ontology's `cloned` substrate. The
  axlotl-tank manufacturing of gholas is structurally closer
  to cloning-with-conditioning than to biological birth; in
  *Dune Messiah* (before the 1984 *Heretics* reveal that
  axlotl tanks are transformed Tleilaxu Masters), the process
  is presented as cellular regrowth followed by behavioral
  shaping. The original Duncan Idaho is dead throughout; Hayt
  is a manufactured young adult who must *recover* the
  predecessor's identity, and Herbert stages that recovery as
  the novel's philosophical center. Boundary-case flagged —
  reasonable coders could argue `born-then-modified` given
  continuity of genetic tissue — but the ghola's young-adult
  emergence from a tank, named and conditioned as a separate
  entity, is the manufacturing case.

  Interiority is `demonstrated`: Herbert gives Hayt extensive
  interior monologue. Autonomy is `emergent` — the Tleilaxu
  designed him as a conditioned assassin; what he becomes is
  a composite agent neither they nor Paul fully predicted.
  Divergence is `departure`: the Tleilaxu built a weapon; the
  friend Paul trusts is not their product. Creator_relationship
  `rebellious`: the narrative's endpoint is Duncan's active
  rejection of his Tleilaxu makers.

  Primary question is `identity` — specifically, whether the
  Duncan who emerges is the Duncan who died, a new Duncan, or
  something between. Knowability is `secondary`: Herbert asks
  the question directly but folds it into the larger Fremen-
  imperial politics. Knowing is `present` — Duncan's resumed
  knowing of Paul is the mechanism of his reawakening.

  Substrate `cloned` + `biological`. The ghola is an important
  corpus entry because it is the cleanest SF example of a
  manufactured body + reconstructed memory composite, a
  framework that Morgan's *Altered Carbon* sleeves and AMC's
  *Pantheon* uploads will later echo (both excluded as
  born-then-modified; Hayt is included because the tissue-
  regrowth + young-adult emergence puts the manufactured body
  ahead of the personality continuity in the narrative's
  ontology).
