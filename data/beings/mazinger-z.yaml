notes: |
  Go Nagai's *Mazinger Z* (manga 1972; anime same year)
  is the bridge between Tetsujin 28's remote-controlled
  mech and the modern "pilot inside" super-robot genre.
  Mazinger Z is built by Dr. Juzo Kabuto from "japanium,"
  a fictional alloy mined from Mount Fuji, and piloted
  from a cockpit in the head by Kouji Kabuto, Juzo's
  grandson. The pilot configuration is foundational: it
  is the model for Gundam (1979), Macross (1982),
  Evangelion (1995), and every "kid pilots a giant
  robot" anime since.

  Even with a pilot inside, Mazinger Z himself has no
  interiority — he's a hardware platform that obeys
  Kouji's stick inputs. The corpus codes him by
  controller/control axis: interiority `none`, autonomy
  `none`, divergence `none`. Primary question `control`
  — every weekly episode is whether Kouji can win this
  week's mech-vs-mech fight, with Dr. Hell's mechanical
  monsters as the antagonists.

  Substrate `mechanical + electrical`. Foundational
  prominence — the modern super-robot genre is the
  Mazinger Z lineage. The character itself is among the
  most iconic single mech designs of the 20th century.
