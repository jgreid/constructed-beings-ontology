notes: |
  Key test case for the Knowability split: knowability is
  `secondary` because "The Measure of a Man" (S2E9) foregrounds the
  question explicitly and treats it as a central but not defining
  concern. Data's personhood comes up repeatedly but the series
  usually prioritizes episodic ethics plots over sustained
  epistemology.

  Knowing is `present`: Data observes humans constantly, takes notes,
  models social behavior, attempts to reproduce affection. His
  ability to know others is a running thread that serves
  characterization rather than carrying dramatic weight on its own.

  Divergence is `none`: Soong built Data to be an autonomous
  intelligence with a positive bias toward becoming more human. Data
  does exactly that, at the rate you'd expect. Primary question is
  `rights` — Starfleet repeatedly adjudicates Data's legal standing.
