notes: |
  Key test case for the Knowability/Knowing split. Knowability is
  `absent`: nobody doubts that Vic is a hologram. Nobody tests him.
  The show doesn't ask whether he truly experiences. But knowing is
  `secondary`: Vic's entire character is built around his capacity
  to know the DS9 crew — he listens to Nog's PTSD, reads Odo, plays
  therapist. His usefulness is epistemic. The split captures this
  cleanly in a way v1's single q_kno_status could not.

  Divergence is `none`: Felix designed Vic as a Lounge Singer
  Program with Real Personality™, and that's exactly what he is.
  Autonomy is `designed` — his initiative and warmth are built-in
  features, not emergent surprises. Primary question is `affection`:
  the crew loves him, he loves them back, and the show treats that
  as a real relationship without asking whether it should.

  Low-confidence flag: holographic characters have always been hard
  to code. The designed/emergent boundary is fuzzy for long-running
  programs that accumulate in-fiction history.
