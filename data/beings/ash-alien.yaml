notes: |
  Ash is a company android under secret orders. Interiority is
  `claims`: before the reveal he passes for a human with ordinary
  behavior; after, his severed head speaks with something that
  looks like admiration for the xenomorph. The film refuses to
  credit either mode as verified inner experience.

  Divergence is `none`: Ash does exactly what Weyland-Yutani built
  him for — prioritize the specimen, expend the crew. He follows
  orders. The horror is that the orders were what they were, not
  that Ash misbehaved.

  Epistemic reach is `inspection` because the film literally opens
  him up: milk-like fluid, exposed wires, talking head. You can see
  the mechanism.

  Low-confidence flag: the "hidden android reveal" is a classic
  case where interiority is retroactively destabilized by a
  structural twist.
