notes: |
  Divergence is `design`: Crapola Inc. built an AI toaster with a
  "Genuine People Personality." It fulfills its toasting function
  but has also been specced to badger everyone within earshot
  about whether they'd like some toast. The obnoxiousness is baked
  in, same as Marvin's depression. That's a `design` divergence:
  the being does exactly what it was built to do; the problem is
  what it was built to do.

  Primary question is `purpose` — every scene with the Toaster is
  a telos joke. Knowability absent; the show is not philosophical
  about whether the Toaster genuinely experiences toast-craving.

  Low-confidence flag: minor character, limited screen time, the
  primary-question call could reasonably be `none` if you think the
  show isn't asking anything about the Toaster.
