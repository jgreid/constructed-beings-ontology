notes: |
  Reclassified primary_question from v1 `affection` to `identity`.
  The central question of the novel is "can I become a real boy?" —
  that's an identity question, not an affection question. Pinocchio's
  struggle is over what he is and what he can become, not over
  whether he can be loved (Geppetto loves him from the start).

  Substrate is `magical` — the Blue Fairy's animation is the
  mechanism, not carpentry. Collodi is explicit that the animation is
  miraculous. The wood is raw material; the life is magic.

  Divergence is `departure`: Geppetto wanted a son; Pinocchio spends
  most of the book running away and becoming someone neither of them
  planned. Identity divergence is also structural — the transformation
  into a real boy at the end is the resolution of the departure.
