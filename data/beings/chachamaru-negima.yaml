notes: |
  Ken Akamatsu's *Negima! Magister Negi Magi* manga (2003–
  2012) and its anime adaptations. Chachamaru — full
  designation Chachamaru Karakuri — is a gynoid built
  jointly by the child prodigy engineer Satomi Hakase and
  the centuries-old vampire mage Evangeline A.K. McDowell.
  Her hybrid construction combines standard mecha
  engineering (Hakase's domain) with magical enchantment
  (Evangeline's), resulting in a student-seeming young
  woman who attends Mahora Academy as a pretext for
  Evangeline's monitoring of the series' primary action.

  Chachamaru is the series' clearest articulation of a
  joint technical/magical construction — a genuinely
  hybrid substrate where the engineering and the
  enchantment are both load-bearing, and where neither
  could produce her on its own. Her coding value for the
  corpus is exactly this substrate-hybridity; she is one
  of the cleanest `mechanical + electrical + magical`
  substrate cases in the tradition.

  Interiority is `demonstrated`: Chachamaru's feelings
  toward Evangeline, Negi, and Hakase are staged directly,
  and her own uncertainty about whether her feelings are
  "real" is engaged as a theme. Autonomy is `designed` —
  she operates within Evangeline's service framework by
  choice. Divergence is `design`: the specification was
  "assistant who is also a person," and she is exactly
  that.

  Primary question is `affection` — Chachamaru's bond with
  Evangeline (servant + student + friend + near-daughter)
  is her central narrative material, and the manga's
  romance subplots (most notably with Negi) turn on
  whether her feelings count. Knowability is `present` —
  the manga engages the question directly, particularly
  in arc late where Chachamaru's future is negotiated.
  Knowing is `present`.

  Creator_relationship `loyal` to both Hakase and
  Evangeline. Tags `philosophical`, `love-story`.
  Supporting prominence — Chachamaru is an ensemble
  character whose philosophical register runs deeper than
  her screen time.
