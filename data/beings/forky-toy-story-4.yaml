notes: |
  Pixar's *Toy Story 4* (Josh Cooley, 2019). On her first day of
  kindergarten Bonnie — clinging to her backpack through her
  anxiety — combines a disposable spork, two pipe cleaners,
  popsicle sticks, a broken red crayon, and googly eyes into
  a craft object. She writes her name on its foot. It
  immediately becomes sentient. Forky spends the first act of
  the film in an ontological crisis: he considers himself
  trash (his components are trash) and repeatedly tries to
  throw himself away. Woody spends most of the second act
  dragging him out of various bins, explaining that being
  Bonnie's toy is now what he is.

  Forky is the corpus's cleanest contemporary articulation of
  the *love-creates-personhood* premise that the *Toy Story*
  franchise has held since 1995, stated at last in the form
  of a thought experiment: if personhood comes from being
  claimed by a child, then any object the child claims is a
  person, no matter its origin. Forky's components were
  never manufactured to be a toy, and the film insists that
  this does not matter — Bonnie's naming does the whole
  animating work.

  Interiority is `demonstrated`: Forky's distress, curiosity,
  and eventual loyalty are staged throughout. Autonomy is
  `emergent` — he is not what any designer, including Bonnie,
  intended; his personhood is a side-effect of the act of
  being named. Divergence is `departure`: a spork is a
  spork; Bonnie's claim converts him into a person who now
  has to be talked out of the trash.

  Primary question is `identity` in its most explicit form:
  Forky is literally the character who asks "what am I?" as
  a direct first-person question for most of his screen
  time. Knowability is `primary` — the film is specifically
  organized around the question of whether this spork has
  an interior. Knowing is `present` — Forky's bond with
  Bonnie and subsequent friendship with Woody are the film's
  emotional anchors.

  Substrate `mechanical` (plastic spork, googly eyes,
  popsicle-stick-and-pipe-cleaner assembly — the
  craft-manufactured object) + `magical` (the Pixar
  animating principle that Bonnie's naming activates).
  Aligned with the corpus convention of not using
  `biological` for natural-but-inert materials (cf.
  pinocchio, golem-prague, scarecrow-oz). Creator_
  relationship `loyal` — Bonnie is Forky's creator and his
  chosen person.
