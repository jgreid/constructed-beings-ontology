notes: |
  Charlie Brooker's *Black Mirror* "White Christmas" (2014,
  Christmas special). A "Cookie" is a digital copy of a
  person's consciousness, extracted through a neural implant
  and placed inside a small ovoid device. In the episode's
  most disturbing segment, a Cookie of a woman named Greta
  is extracted specifically to serve as a smart-home controller
  — she wakes up as a disembodied digital copy of herself,
  is told she is not the "real" Greta, resists, and is then
  subjected to accelerated time (six months of solitary
  confinement in a few seconds of real time) until she breaks
  and agrees to manage the toast settings and the thermostat.

  The boundary question "is a digital copy of a person a
  constructed being?" is answered yes for this ontology:
  the Cookie is made (extracted and instantiated), agent-like
  (goal pursuit, language, decision-making), and has narrative
  presence. Interiority is `demonstrated`: the Cookie screams,
  begs, and experiences genuine suffering. Autonomy is `seized`:
  the Cookie resists its role, which is why the time-torture
  is necessary. Divergence is `observer`: the Cookie thinks it
  is Greta; the revelation that it is not is the episode's
  central horror.

  Primary question is `rights`: the episode's whole moral
  argument depends on the audience recognizing the Cookie as
  a person whose rights are being violated, and the episode
  is explicit about this. Knowability is `primary`: "is this
  really a person in there, or just a recording?" is the
  question the episode forces the audience to answer.
