notes: |
  Karen Plankton, the wife of Sheldon J. Plankton, is the
  waterproof computer wife at the Chum Bucket in
  Nickelodeon's *SpongeBob SquarePants* (1999–ongoing).
  Plankton built her as his lab assistant and the show
  long ago promoted the relationship into a long-running
  marriage. Karen is consistently sharper than her
  husband, deadpan about his schemes, and the show's
  consistent comic register is her dry exasperation at
  the Chum Bucket's complete commercial failure.

  Substrate `electrical`. Embodiment `embodied` (she
  appears as a wheeled monitor in the Chum Bucket, with
  occasional mobile variants and humanoid disguises
  introduced in later seasons and the films). Interiority
  is `demonstrated`. Autonomy is `seized`. Divergence is
  `departure` — Plankton built a lab assistant, ended up
  with a wife.

  Primary question is `affection` — the marriage is the
  through-line of any Karen-centric episode. Knowability
  `absent` — the show is uninterested in whether Karen
  is a person and treats her as one without arguing for
  it. Knowing `secondary` — Karen frequently runs
  reconnaissance on Plankton's targets, which makes the
  knowing-direction explicit. Creator_relationship
  `indifferent` — Karen has long since stopped serving
  Plankton's agenda except as a sardonic observer.

  Significant prominence: *SpongeBob* is one of the most
  watched children's animated programs of the late 20th
  and early 21st century, and Karen is a sustained
  presence across two and a half decades of episodes.
