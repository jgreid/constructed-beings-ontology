notes: |
  Second ensemble-split entry from the `cylons-bsg` anchor.
  The Number Eight model is Sharon Valerii, and across the
  series she appears in multiple individuated instances:
  "Boomer," a sleeper-agent Eight on the *Galactica* who
  believes herself human until she shoots Admiral Adama in
  the Season 1 finale; "Athena," a distinct Eight who
  chooses the human side, marries Karl "Helo" Agathon,
  bears the human-Cylon hybrid child Hera, and becomes one
  of the series' most sympathetic characters; and numerous
  unindividuated Eights on the Cylon ships. Played by Grace
  Park.

  Interiority is `demonstrated`: the series gives Sharon's
  various instances full sympathetic interior access,
  especially Athena. Autonomy is `seized`: different Eights
  have taken autonomy in different directions, most
  dramatically Athena's defection. Divergence is `departure`.

  Primary question is `affection`: the Athena-Helo marriage
  and the Hera storyline are the series' most sustained
  human-Cylon relationship, and the Boomer sleeper-agent
  arc is the series' sharpest examination of the pain of
  having divided loyalties. Eight is the ensemble member
  whose card most nearly matches the anchor Number Six
  entry — both affection-primary — but with the affection
  redirected from romance-and-complicity to
  motherhood-and-partnership.

  The BSG splits (Cavil, Eight, D'Anna) collectively illustrate
  what the ensemble rule was protecting against: treating
  the Cylon population as a single card flattens real and
  analytically interesting variation across the models.
