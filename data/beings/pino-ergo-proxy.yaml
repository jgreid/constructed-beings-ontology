notes: |
  Shūkō Murase's *Ergo Proxy* (Manglobe, 2006). Pino is an
  AutoReiv — the series' standard category of humanoid
  domestic android — belonging originally to Raul Creed, the
  head of the domed city of Romdo's security bureau. She is
  infected with the Cogito virus, which grants AutoReivs
  self-awareness, and is subsequently abandoned / reassigned
  and eventually joins the protagonists Vincent Law and Re-l
  on their journey outside Romdo. Pino presents as a small
  girl of perhaps seven or eight years; her emergence into
  self-awareness is one of the series' two major character
  arcs (the other being Vincent's own).

  Canonical entry. *Ergo Proxy* is one of the most
  philosophically ambitious anime works of its era, and
  Pino is its child-protagonist carrier of the series'
  central question: what personhood a recently-awakened
  AutoReiv has, and what the text can be asked to do about
  the AutoReivs that are still on the other side of Cogito.
  Pino's analytical value is the clarity with which her
  post-Cogito consciousness is staged as ordinary
  childhood.

  Interiority is `demonstrated`: Pino's curiosity, fear,
  affection, and grief are rendered throughout. Autonomy
  is `seized` — the Cogito infection is exactly the event
  of her claiming subjectivity against her service role.
  Divergence is `departure`: Romdo manufactures AutoReivs
  as servants; Pino is now something else, and the series
  does not provide a category for her other than "child."

  Primary question is `identity` — Pino is one of the
  corpus's clearest contemporary illustrations of the
  emerging-personhood arc. Knowability is `primary`:
  *Ergo Proxy* engages the question directly throughout.
  Knowing is `primary` — Pino's knowing of Vincent and
  Re-l is the series' emotional center.

  Creator_relationship `absent` — Romdo's manufacturing
  process is abstract infrastructure; Raul Creed (her
  former owner) is not meaningfully her creator. Tags
  `canonical`, `child-arc`, `philosophical`. Pair-reads
  with sammy-time-of-eve, chi-chobits, and isla-plastic-
  memories — the 2000s–2010s Japanese constructed-being-
  as-child / companion cluster.
