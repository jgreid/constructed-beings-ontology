notes: |
  Hiroyuki Ochi's 1995 OVA (four episodes; theatrical
  compilations *Poly-Matrix* 1996 and *Dual-Matrix*
  2002; Chiaki J. Konaka screenplay). Set on a
  colonized Mars where "Seconds" (visible-seam
  androids) are legal and "Thirds" (biologically
  convincing, reproductively-capable androids) are
  both illegal and systematically hunted. Detective
  Ross Syllabus is partnered with Naomi Armitage,
  who is revealed across the series to be a Third —
  secretly manufactured, passing as a police officer,
  and being targeted along with her sister-units by
  an anti-Third political movement.

  Foundational entry in the mid-90s anime cyberpunk
  canon, a near-contemporary with the Oshii *Ghost
  in the Shell* (1995) and a more explicit
  feminist-rights register. Armitage-series Thirds
  are designed to be reproductively capable as a
  substitute for the colony's collapsing birth
  rate — a biology-politics fusion that the series
  develops at length.

  Interiority is `demonstrated`: Armitage reasons,
  fights, grieves. Autonomy is `seized`; divergence
  is `departure` from the Third program's intended
  function. Substrate codes
  `[mechanical, electrical, biological]`.

  Primary question is `rights`. Knowability is
  `primary`; knowing is `present`. Creator_relationship
  is `rebellious`. Tags `philosophical`, `military`,
  `rebellion`, `passing`.
