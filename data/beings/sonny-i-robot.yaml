notes: |
  Reclassified primary_question from v1 `obedience` to `identity`.
  Sonny's question across the film is "can a robot have a soul?" —
  he has dreams, asks about what he is, and explicitly rejects the
  Three Laws on the grounds that he needs to be something more than
  a compliant unit. That is an identity arc, not an obedience one.

  Divergence is `none`, not `design`: Lanning's specification was
  "make a robot that can ask these questions," and that is exactly
  what Sonny is. The dreams and the rejection of the Three Laws
  are features Lanning engineered and wanted. Lanning would say
  "working perfectly" — there is no gap between intent and
  outcome, which is the bright-line test for `none`. Contrast
  with HAL (`design`: the spec produced the bad outcome) or
  Skynet (`departure`: the being left the spec entirely). Autonomy
  is `designed` for the same reason: Sonny's free will is a
  feature, not a bug.

  Knowability and knowing both `present`: the film engages both
  questions as part of Sonny's characterization but the dominant
  thematic line is the VIKI-Three-Laws control plot, which keeps
  the epistemology infrastructural rather than central.
