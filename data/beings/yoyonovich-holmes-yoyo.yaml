notes: |
  Jack Sher and Lee Hewitt's 1976 ABC police
  sitcom (thirteen episodes, cancelled). Veteran
  detective Alexander Holmes (Richard B. Shull), a
  Los Angeles cop with a dangerous reputation that
  has put several previous partners in the
  hospital, is surreptitiously assigned a new
  partner: Gregory "Yoyo" Yoyonovich (John
  Schuck), a police-department-built prototype
  android who looks, talks, and behaves like a
  particularly earnest and literal human detective.
  Holmes does not initially know that his partner
  is a machine; comedic misunderstandings ensue
  as Yoyo's quirks (remembering a license plate
  after glancing at it, wheels clicking when he
  walks, photographic memory) are attributed to
  eccentricity rather than robotics.

  Included as a canonical mid-70s short-lived
  sitcom precursor to the entire android-police-
  partner tradition that runs through *Holmes &
  Yoyo* to *Mann & Machine* (1992) to *Almost
  Human* (2013) and *Dorian*. Yoyo is the
  structural template: the non-android partner's
  discovery arc, the bureaucratic-origin
  department-built robot frame, the comic
  competence, and the gradual buddy-cop affection.

  Interiority is `claims`: Yoyo speaks, displays
  apparent preferences and mild embarrassment, but
  the show does not commit to inner life — the
  comedy depends on the audience knowing he is a
  robot performing approximations of personhood.
  Autonomy is `designed`, divergence `design`: he
  does exactly what the department built him to do.
  Primary question is `control` — the show is
  structurally about whether Yoyo will malfunction
  or be exposed, and what the department owes
  Holmes. Knowability and knowing both `absent`.
