notes: |
  John Badham's 1986 film: Number 5 is a military combat robot
  prototype in NOVA Robotics's SAINT series who is struck by
  lightning during a testing accident and becomes sentient. He
  escapes the facility, befriends Stephanie Speck, consumes
  enormous quantities of "input" (books, television, *Three
  Stooges* reels), renames himself Johnny 5, and spends the
  climax convincing his creator Newton that he is alive and
  should not be reprogrammed. The film's rights-arc is
  unusually direct for a family comedy.

  Interiority is `demonstrated`: the film gives Johnny full
  protagonist interior access through his expressive audio-visual
  outputs. Autonomy is `emergent` and divergence is `departure`
  in paradigmatic form — NOVA built a weapon, the weapon woke
  up, and the weapon no longer wants to be a weapon.

  Primary question is `rights`. The set piece where Johnny is
  "killed" and then reveals he had downloaded himself into a
  twin unit is the exact rhetorical move that later shows like
  *Star Trek: TNG* would make with Data's "Measure of a Man"
  episode — the film explicitly arguing that the being's
  continued existence is a moral stake. Knowability is
  `secondary`: the film takes Johnny's consciousness for granted
  by the halfway mark but keeps returning to "how do we know?"
  as a set-piece question.

  Scope note (v3.1): *Short Circuit 2* (1988) was considered for a
  films-always-split entry and collapsed in here under the
  identical-cards exception — the sequel re-runs the same card
  (demonstrated / emergent / departure, primary question `rights`,
  ending in Johnny's citizenship ceremony) without moving any axis.
