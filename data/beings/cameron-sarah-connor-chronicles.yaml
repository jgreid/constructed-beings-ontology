notes: |
  Fox's two-season *Terminator: The Sarah Connor Chronicles*
  (2008–2009) introduces Cameron, a reprogrammed TOK-715
  infiltrator Terminator sent back by the future John Connor
  to protect his younger self. Played by Summer Glau as an
  uncanny adolescent who mostly does what Terminators do but
  occasionally flinches at the wrong moments. The series is
  unusually explicit in making Cameron's interiority an open
  dramatic question — episodes return repeatedly to whether
  she has "feelings" for John, whether her protection of him
  is merely optimal or also preferred, and whether the
  distinction matters.

  Interiority is `undecidable`, which is rare and significant.
  The series structurally refuses to settle Cameron's status,
  and this refusal is the point — where the films treat
  Terminators as either `none` (Cameron 1984) or `claims`
  (T2), *SCC* treats the same chassis as the corpus's clearest
  unresolvable case. Autonomy is `seized`: the reprogramming
  was done by future John Connor outside Skynet's sanction.
  Divergence is `departure`.

  Primary question is `affection`, with `identity` a close
  second. The relationship with John is the show's emotional
  spine, and the series' signature move is making the viewer
  unable to tell whether any given Cameron scene is genuine
  care or mission-preservation behavior. Knowability is
  `primary`: *SCC* is one of the corpus's rare cases where the
  knowability question is explicitly the defining dramatic
  concern of the whole show.
