notes: |
  Čapek's robots are explicitly biological-synthetic, grown in vats —
  the play's "robot" is closer to a v2 `cloned`+`biological` than to
  mechanical. The word "robot" came from this play but the substrate
  was never metal.

  Primary question is `rights`: the play is a parable about slave
  labor and its moral intolerability. The robots' uprising is the
  rights question made physical.

  Divergence is `departure`: designed for service, they leave the
  specification by organizing and revolting. Knowability is `absent` —
  the play is not interested in whether the robots truly experience.
  They suffer visibly, which is enough; the epistemology doesn't
  matter to the politics.
