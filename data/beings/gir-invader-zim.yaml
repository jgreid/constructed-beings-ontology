notes: |
  Reclassified autonomy from v1 `ambiguous` to `designed`, and
  primary_question from v1 `obedience` to `none`. Per the brief:
  v1's `ambiguous` is eliminated. GIR was made by the Tallest to be
  a servant robot and is catastrophically bad at it. That is
  malfunction within a designed frame, not genuine ambiguity. The
  chaos is the device working as rolled out by careless creators.

  Primary question is `none`: *Invader Zim* asks questions about
  Zim (invasion, alienation, failure) and, obliquely, about Dib.
  Nobody asks a question about GIR. He is deployed for chaotic
  comedy and does not sit in the moral or philosophical center of
  any episode.

  Divergence is `none`: GIR does exactly what a minimum-viable-spec
  servant robot does when thrown together from trash by a
  disinterested manufacturer. The Tallest would say, correctly,
  "working as intended (for our definition of intended)."
