notes: |
  Garson Poole is a corporate executive who, after an accident,
  discovers he is an "electric ant" — an organic robot whose
  perceived reality is generated by a micro-punched tape running
  through his chest. The story follows his experiments with the
  tape: punching new holes to create novel experiences, and
  ultimately cutting it entirely.

  Divergence is `observer`: Poole was never what he (or anyone
  else) thought he was. The gap is entirely in perception. This
  places him in the same cluster as Olympia, Ava, and the Dick
  novel replicants — Dick is the master of the observer-divergence
  mode and this story is his purest statement of it.

  Interiority is `narrated`: the story is told from Poole's POV,
  giving us first-person access to his experience of discovering
  his own constructed nature. Epistemic reach is `inspection`:
  Poole literally opens his chest cavity and examines his own
  input tape — the most literal inspection in the corpus.

  Knowability is `primary`: the entire story asks whether Poole's
  experiences are real or tape-generated, and whether the
  distinction matters. This is primary/secondary (knowability
  dominates, knowing serves it) rather than primary/primary.

  Knowing is `secondary`: the final twist — that Poole's secretary
  may also be an electric ant, and that cutting his tape may have
  destroyed her reality too — raises the question of whether
  constructed beings can know each other's nature, but this is
  a closing provocation rather than a sustained concern.
