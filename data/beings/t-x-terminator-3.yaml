notes: |
  The T-X follows the original T-800's template as a pure mission
  executor with no demonstrated inner life. Like the first-film
  Terminator, it is a weapon, not a person. The film shows no
  interest in whether there is anyone home behind the liquid-metal
  exterior.

  The T-X is notable primarily for its feminine presentation — it
  consistently adopts a female form, making it one of the few
  Terminator-series units coded feminine. This is a design choice
  by Skynet (and the filmmakers) that serves the plot's infiltration
  mechanics without altering the fundamental characterization:
  the T-X is still a servile instrument of Skynet with zero
  autonomy or divergence.

  Primary question is `control`, following the franchise pattern:
  the dramatic engine is whether the heroes can survive the machine
  hunting them. All lens values are `absent` or `none` — the film
  treats the T-X as an obstacle, not a subject of inquiry. Compare
  with t-800-terminator for the same coding pattern and t-800-t2
  for the franchise's exploration of what happens when a Terminator
  is given room to develop.
