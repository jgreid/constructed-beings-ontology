notes: |
  Reclassified primary_question from v1 `control` to `purpose`. The
  myth asks what Pandora is for — she is a punishment device built by
  the gods to undo Prometheus's gift of fire. The story is about her
  telos, not about containing her. Divergence is `none`: she performs
  exactly the function Zeus designed her for (releasing the ills of
  the world from her jar). There is no gap between intent and outcome.

  Motivation includes `other` because "punishment of humanity" doesn't
  cleanly map to any single motive — closer to power than anything else,
  with a retributive flavor the schema doesn't name.
