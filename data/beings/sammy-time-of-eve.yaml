notes: |
  Yasuhiro Yoshiura's 2008–09 six-episode Studio
  Rikka web anime (theatrical compilation 2010).
  In a near-future Japan where androids serve
  domestic roles and are legally required to
  display a holographic status-ring distinguishing
  them from humans, Time of Eve is a small café
  that enforces a rule: "androids and humans are
  to be treated equally inside this café" —
  which means the status-rings are hidden.
  Protagonist Rikuo discovers that his family's
  household android, Sammy, has been visiting
  the café and exhibiting personality there she
  does not show at home.

  Included as the most analytically-concentrated
  short-form anime treatment of the corpus's
  rights-and-passing question, and a clear
  contemporary-Japanese articulation of the
  Asimov / *Bicentennial Man* tradition filtered
  through the Helen O'Loy / Rei Toei feminine-
  companion register. Sammy is coded as the
  series' representative central case though the
  café features several androids; her arc across
  six episodes is the ontology's relevant one.

  Interiority is `demonstrated`: Sammy's
  affection for Rikuo's family and her
  interiority inside the café are staged with
  care. Autonomy is `seized` — the café
  attendance is her initiative, and she
  negotiates the distinction between her two
  presentations herself. Divergence is
  `departure`: domestic-android spec did not
  include "develop a private emotional life
  at a café."

  Primary question is `rights` through the
  passing-and-recognition frame. Knowability is
  `primary`; knowing is `present`. Creator_
  relationship is `indifferent` — her family
  treats her as furniture, which is the
  series' political point.

  Substrate codes `[mechanical, electrical,
  linguistic]`. Tags `philosophical`, `passing`.
