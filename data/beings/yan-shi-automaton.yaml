notes: |
  The *Liezi* (Book V, "Questions of Tang"), a Daoist
  philosophical compilation traditionally attributed to
  the 4th-century-BCE Liè Yùkòu but actually compiled in
  the 3rd or 4th century CE from earlier materials,
  contains the earliest known narrative description of an
  anthropomorphic automaton: the artisan Yan Shi presents
  a singing, dancing, leather-and-wood automaton to King
  Mu of Zhou (10th century BCE in the frame story). The
  automaton walks, sings on key, dances in time, blinks,
  and turns its head; when the king's harem laughs, the
  automaton begins flirting with the royal consorts, at
  which point the king flies into a rage and orders Yan
  Shi to be executed. Yan Shi disassembles the automaton
  on the spot to show the king its internal construction
  — leather pieces glued and lacquered, with no organic
  parts.

  Foundational status. The *Liezi* passage is the earliest
  detailed narrative description of a human-form
  automaton in any literary tradition, predating the
  Iliad's golden tripods narrative by approximately three
  to four centuries if Yan Shi is read into the early
  Zhou frame, or roughly contemporary with Hesiod /
  Apollonius if dated to the *Liezi*'s actual
  compilation period.

  Scope note: the corpus's v2.4.2 East Asian-canon scope
  test has been applied to anime cases (Doraemon
  retracted in v2.4.5 for failing the Western-consumption
  threshold). The Liezi passage sits in a different
  scope frame: it is a classical philosophical text
  routinely taught in Western university programs, the
  best-known automaton narrative in non-Western
  pre-modern literature, and a standard reference in
  Western histories of robotics (Mayor, *Gods and
  Robots*, 2018; Truitt, *Medieval Robots*, 2015). The
  Western-canon test arguably applies; the corpus's
  scope reviewer should decide.

  Year `-300` is the conservative midpoint of the
  *Liezi*'s likely compilation window; the older oral
  tradition the passage descends from may be earlier.

  Substrate `mechanical + magical`: the text gives
  considerable mechanical detail (leather pieces,
  lacquered joints) but the lifelike performance has no
  mechanical basis adequate to the described
  behavior. Interiority `claims`. Autonomy `designed`.
  Divergence `none`: the automaton's flirtation is what
  Yan Shi built it for; the king's reaction reads as
  misunderstanding of the demonstration's purpose.
  Primary question `identity` — Yan Shi's disassembly
  is the text's reasoning about what kind of being he
  built. Knowability `present`. Knowing `absent`.
  Creator_relationship `servile`.
