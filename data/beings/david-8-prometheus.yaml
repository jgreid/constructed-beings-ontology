notes: |
  Scott's return to the synthetic theme thirty-three years after
  Ash. David 8 is Peter Weyland's personal eighth-generation
  synthetic, accompanying the *Prometheus* expedition as a quiet
  caretaker while secretly pursuing his own investigation of the
  Engineers — and deliberately contaminating crew member
  Holloway with alien pathogen to observe the results. By
  *Alien: Covenant* (2017) he has lived alone for a decade on
  the Engineer homeworld, posing as his own replacement model
  Walter, and has reinvented himself as a post-human
  artist-creator whose creative project is designing the
  Xenomorph lineage. This single entry covers David across both
  films per the scoping rule — the card values are stable even
  though David's situation changes dramatically.

  Interiority is `demonstrated`: Scott makes David the most
  explicit interior project of any synthetic in the corpus.
  Autonomy is `seized`: David spends both films acting on an
  agenda that is not Weyland's, Yutani's, or any human's.
  Divergence is `departure` — Weyland built a personal
  assistant and built the eventual destroyer of entire human
  colonies.

  Primary question is `identity`. Scott's framing is that David
  inherits his human creators' resentment at being mortal and
  redirects it into a question about what he himself is and
  what he is authorized to create. David watches *Lawrence of
  Arabia*, dyes his hair to match Peter O'Toole, writes music,
  and designs species. Knowability is `primary` — Scott's films
  explicitly take David's inner life as their central
  epistemological question, and his eerie watchability across
  both films is the whole emotional content.
