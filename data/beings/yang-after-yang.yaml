notes: |
  Kogonada's 2021 film, adapted from Alexander Weinstein's
  short story "Saying Goodbye to Yang." Yang is a used
  "technosapien" — an android with organic and mechanical
  components — purchased by Jake and Kyra to serve as a
  cultural companion for their adopted Chinese daughter
  Mika. When Yang shuts down, Jake takes him to a repair
  shop and discovers a hidden memory archive: short clips
  Yang recorded throughout his existence, revealing a rich
  inner life — including a secret relationship with a
  human clone named Ada — that no one in the family
  suspected.

  This is one of the most quietly devastating constructed-
  being films of the 2020s. The whole structure is
  posthumous: Yang's interiority is only discoverable after
  his death, through the memory archive. The film's grief
  is both for Yang and for the family's failure to notice
  what he was while he was alive.

  Interiority is `demonstrated` — but only posthumously,
  through the archive. This is a distinctive position in
  the corpus: the text confirms rich interior life, but
  the characters can only access it after the being has
  stopped functioning. Autonomy is `designed`: Yang was
  bought secondhand and functioned within his parameters.
  Divergence is `design`: the technosapien specification
  included the capacity for a hidden inner life, and
  that capacity is the film's whole revelation.

  Primary question is `knowledge`: the film is structured
  as an epistemic investigation into what Yang was.
  Knowability is `primary`: "was there really a person in
  there?" is the film's central question, answered yes
  but too late. Knowing is `primary`: the memory archive
  reveals that Yang knew the family intimately, and the
  film's power comes from the family discovering this
  knowledge after the fact. Yang belongs in the
  primary/primary cluster — alongside Helen, Samantha,
  Ava, and the others — and his posthumous framing
  makes him the cluster's most melancholy member.
