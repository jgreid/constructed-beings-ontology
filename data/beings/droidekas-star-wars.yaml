notes: |
  Rolling combat droids in wheel-form, introduced in *The
  Phantom Menace* (1999). They roll into engagement, unfold
  into a tripod with twin blasters and personal deflector
  shields, and clear rooms. Unlike the B1 battle droids,
  they are not vocal; the design is purely a mobile
  gun-platform.

  Interiority is `none`. Autonomy is `designed`.
  Divergence is `none`. Primary question is `none`. The
  Droidekas are pure military hardware in the corpus's
  classic "plot furniture" sense (cf. talos.yaml) — an
  obstacle with a known solution (the saber-stalemate in
  TPM's hangar). They are included to track the
  spectrum within Star Wars droids: the franchise contains
  both the franchise's `foundational`-prominence
  individuated droids (R2-D2, C-3PO) and these
  no-interiority infantry units.
