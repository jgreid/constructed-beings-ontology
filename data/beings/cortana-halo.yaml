notes: |
  Cortana is a military "smart AI" flash-cloned from Catherine
  Halsey's brain tissue — substrate is `electrical` plus
  `biological` to capture the neural template.

  In the original trilogy (CE-3) her card is clean: she does her
  job, her snark is designed-in, and her bond with Master Chief is
  the emotional anchor of the series. Divergence is `none`, autonomy
  is `designed`. Primary question is `affection` — the games ask
  whether a soldier and an AI can love each other, and answer yes.

  The Halo 4 rampancy arc changes the card significantly enough to
  warrant a sequel split (see cortana-halo-4). Halo: CE-3 is the
  coherent stable unit for this entry.
