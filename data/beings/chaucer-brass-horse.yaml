notes: |
  In Geoffrey Chaucer's unfinished *Squire's Tale* (one
  of *The Canterbury Tales*, composed ca. 1390), an
  unnamed knight from the East arrives at the court of
  King Cambyuskan bearing four gifts: a brass horse that
  can fly to any destination via a peg-and-lever mechanism,
  a mirror that shows distant events, a sword that cures
  any wound it inflicts, and a ring that grants the
  ability to understand the speech of birds. The brass
  horse is the most extensively described of the four —
  Chaucer dedicates considerable verse to debate among
  the courtiers about how it might function, summoning
  Aristotelian, alchemical, and engineering speculation.

  The tale is the canonical Middle English reception of
  the *Arabian Nights* "Ebony Horse" (see
  `ebony-horse-arabian-nights`) and a foundational text
  for the corpus's pre-modern English-language
  constructed-being lineage. Linked as `adaptation` to
  the Arabic source.

  Chaucer left the tale unfinished, but its catalogue of
  marvelous artifacts and its sustained engineering-
  speculation passages have been continuously cited
  in the European reception of the brazen-head and
  enchanted-mechanism traditions — including by Spenser
  (whose Faerie Queene completes Chaucer's tale in Book
  IV), Cervantes's Clavileño passage in *Don Quixote*
  Part II (a direct parody of the Squire's Tale), and
  Milton's reference in *Il Penseroso*.

