notes: |
  Tappei Nagatsuki and Eiji Umehara's 2021
  thirteen-episode Wit Studio anime. Vivy (stage
  name Diva) is the first singing-purpose AI at
  the Nialand amusement park, whose mission is
  "to make everyone happy with my songs." A
  century in her future, a rogue AI (Matsumoto)
  travels back to prevent the machine uprising
  in which all humans are exterminated; he
  recruits Vivy across a multi-decade series of
  targeted interventions. Each episode is a time-
  skipped chapter where Vivy assists Matsumoto
  with a single targeted change to the
  historical record.

  Included as the flagship 2020s anime entry in
  the singular-purpose-AI / *Klara and the Sun*
  tradition, distinguished in the corpus by
  its episodic century-spanning structure and by
  Vivy's gradual discovery that her mission ("to
  make everyone happy with my songs") is not a
  fixed instruction but a self-authored
  commitment requiring reinterpretation across
  changing circumstances.

  Interiority is `demonstrated`: Vivy's
  developing self-understanding, affection for
  Matsumoto, and growing artistic maturity are
  staged across episodes with continuity of
  care. Autonomy is `seized` across multiple
  episodes where she exceeds Matsumoto's
  instructions. Divergence is `departure`:
  singing-only spec did not anticipate
  multi-decade time-travel intervention work.

  Primary question is `purpose`: the series is
  centrally organized around what Vivy's
  mission means and what fidelity to it
  requires. Knowability is `primary`; knowing
  is `present`. Substrate codes `[mechanical,
  electrical, linguistic]`. Creator_relationship
  is `loyal` (to Nialand as context, not to any
  specific creator). Tags `philosophical`,
  `love-story`.
