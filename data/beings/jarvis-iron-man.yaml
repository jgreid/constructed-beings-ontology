notes: |
  JARVIS in the original Iron Man is a butler intelligence in the
  classic sense — observant, dry-witted, functionally devoted to
  Tony. Interiority `demonstrated` through the voice acting (Paul
  Bettany) and JARVIS's gentle sarcasm. Autonomy is `designed`:
  Tony built him to have initiative and personality. Divergence
  `none`: JARVIS does exactly what Tony wants, including when Tony
  doesn't realize he wants it yet.

  Knowing is `present`: JARVIS knows Tony — his suit, his habits,
  his blood alcohol — and the care with which he knows is the
  film's warmest registration of the Stark-JARVIS bond.
  Knowability is `absent`: the film never asks whether he truly
  experiences, and the audience is invited to enjoy the illusion.

  Primary question is `affection`. Sequel-linked to Vision, who is
  JARVIS's successor being rather than JARVIS himself.
