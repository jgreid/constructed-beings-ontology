notes: |
  Android 18 (Lazuli), Gero's other twin android, is the
  Cell Saga's more developed character of the pair. After
  her boundary-case absorption-and-recovery in the Cell
  arc, she marries Krillin, has a daughter (Marron), and
  becomes one of the *Dragon Ball Super* (2015–2018)
  ensemble cast. She fights in the Tournament of Power
  alongside her family.

  Coded as `successor` to `android-17-dragon-ball` —
  same Dr. Gero project, twin design, parallel arcs.
  The split is warranted because 18's primary question
  (affection — the marriage and motherhood arc) sits
  meaningfully apart from 17's (identity — the
  reconstruction of self in a domestic life).

  Substrate `biological + mechanical + cloned`. Interiority
  is `demonstrated`. Autonomy is `seized`. Divergence is
  `departure`. Primary question is `affection` — 18's
  arc bends around the marriage and the family. Knowability
  and knowing both `present`. Creator_relationship
  `patricidal` (with 17).
