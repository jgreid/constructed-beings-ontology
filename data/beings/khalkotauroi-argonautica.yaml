notes: |
  Within-source split from talos.yaml. Apollonius Book III describes
  a pair of fire-breathing bronze bulls forged by Hephaestus and
  kept by King Aeëtes in Colchis. Jason must yoke them and plough a
  field with dragon's teeth as a trial before the Golden Fleece.
  Medea's unguent protects him; the bulls are subdued by the same
  kind of concrete weakness-exploitation the Argonauts use against
  Talos.

  Coded as a pair rather than two entries because Apollonius treats
  them as an undifferentiated yoke and the epic assigns them no
  individual names or actions. They are even more plot-furniture
  than Talos — there is no question the text asks about them, only
  the labor-test they constitute. Primary question is `none`;
  interiority is `none`. Substrate `mechanical` + `magical` — forged
  in the divine smithy and animated by Hephaestan craft, in the
  same tradition as Talos and the golden handmaidens.

  Included as a minor complement to talos.yaml and
  hephaestus-handmaidens.yaml because the Khalkotauroi are the
  clearest ancient example of purpose-built combat automata — the
  template for every gate-guardian robot from Harryhausen's Bubo's
  opposite-number to ED-209. Their place in the corpus is to show
  that the martial-automaton lineage is already complete at the
  source.
