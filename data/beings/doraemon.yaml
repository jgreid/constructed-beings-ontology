notes: |
  Fujiko F. Fujio's *Doraemon* manga (1969–1996, Shogakukan),
  with animated adaptations (1973 Nippon TV, 1979 TV Asahi,
  2005 reboot) and innumerable feature films. Doraemon is a
  robotic cat sent from the 22nd century by Nobi Sewashi
  (great-great-grandson of the series protagonist Nobita) to
  improve Nobita's fortunes, and by extension the future
  Nobi family lineage. He carries a four-dimensional pocket
  from which he produces an effectively endless supply of
  future-gadgets, which the weekly episode structure
  invariably misuses.

  *Doraemon* is the single most culturally important
  constructed-being franchise in East Asia and — with its
  decades-long Netflix and subsequent streaming distribution
  — an increasingly globally legible one. Included on
  foundational-prominence grounds, with an explicit scope-
  boundary flag: the exclusions.yaml anime-expansion note
  identifies "Western-consumed" as the current scope test,
  and *Doraemon*'s Western consumption is moderate but
  real (a 2014 Disney XD dub ran for multiple seasons; the
  Netflix catalog has carried the 2005 series; theatrical
  runs of the Doraemon films reach major Western markets).
  A future corpus revision on Asian-origin anime may
  revisit this categorization.

  Doraemon's analytical value is the cleanness of his
  *mission-robot-as-friend* profile. He is designed by the
  22nd-century Matsushiba factory to help children; his
  particular assignment is Nobita; his friendship with
  Nobita is the specification and the story. There is no
  Sonny-style personhood crisis, no Skynet-style
  divergence, and the series does not ask whether Doraemon
  is "really" a person. It assumes that he is, and explores
  the consequences of a friend-robot whose competence at
  friendship is imperfect.

  Interiority is `demonstrated`: Doraemon's exasperation,
  affection, and mood-shifts are the series' comic engine.
  Autonomy is `designed`. Divergence is `design`: the
  specification includes the series' weekly misfires — his
  gadgets fail in characteristic ways that the factory
  anticipated (or should have). Primary question is
  `affection` — Doraemon's friendship with Nobita is the
  series' animating question, though the question is not
  adversarial.

  Epistemic reach `conversational`. Knowability `absent` —
  the question of Doraemon's inner life is not raised.
  Knowing `present` — Doraemon's knowing of Nobita is
  effectively the series' definition. Creator_relationship
  `loyal`: Doraemon regards his future makers and the Nobi
  family with active warmth.

  Tags `canonical` (the canonicality is cross-cultural
  and decades-deep), `child-arc`, `comedy`, `love-story`
  (the friendship is the long arc, but the weekly plots
  often concern Nobita's romantic misadventures).
