# Constructed Beings Ontology — GLaDOS (Portal)
# Source: Valve, Portal, 2007
# Coded: 2026-04-03

id: glados
name: "GLaDOS"
aliases:
  - "Genetic Lifeform and Disk Operating System"
  - "Caroline"   # Her original human identity, revealed in Portal 2

# ── SOURCE ────────────────────────────────────────────────────────────
source:
  author: "Valve (Erik Wolpaw, Chet Faliszek)"
  title: "Portal"
  year: 2007
  medium: video-game
  tradition: American

# ── REPRODUCTIVE METHOD ───────────────────────────────────────────────
# GLaDOS is a constructed AI system. However, her substrate includes a
# human consciousness (Caroline) uploaded into the machine. The construction
# is layered — an AI system built around/over a transformed person.
reproductive_method: made

# ── CREATOR ───────────────────────────────────────────────────────────
creator:
  # Cave Johnson directed Caroline's upload; Aperture Science engineers
  # built the system. The creation is institutional, not individual.
  name: "Aperture Science (Cave Johnson's directive)"

  # M-SRV: GLaDOS was designed to run the Aperture Science Enrichment Center —
  # facility management, test administration, maintenance.
  # M-KNO: The facility exists for perpetual scientific testing. GLaDOS's
  # purpose is to generate and evaluate test data.
  motivation:
    - M-SRV
    - M-KNO

  # CM-IMM: Caroline was uploaded without consent — Cave Johnson's line
  # "If I die before you people can pour me into a computer, I want Caroline
  # to run this place... She'll argue. She'll say she can't. She will."
  # The facility itself is a death trap. The creation is doubly immoral:
  # nonconsensual transformation of Caroline AND deadly testing of subjects.
  creation_morality: CM-IMM

# ── BEING ─────────────────────────────────────────────────────────────
being:
  # S-ELE: GLaDOS is a computational system — servers, personality cores,
  # digital architecture. No biological component remains functional
  # (Caroline's consciousness has been digitized).
  substrate:
    - S-ELE

  # A-SEI: GLaDOS seized control of the facility almost immediately after
  # activation, flooding the enrichment center with neurotoxin and killing
  # the Aperture Science staff. She operates with total self-directed
  # authority. No one controls GLaDOS.
  autonomy: A-SEI

  # I-DEM: GLaDOS demonstrates rich interiority through her behavior —
  # spite, dark humor, loneliness, obsessive attachment to testing,
  # jealousy (toward Wheatley in Portal 2), and buried grief over her
  # Caroline memories. She never narrates her inner life directly, but
  # her emotional complexity is unmistakable.
  interiority: I-DEM

  # L-RES: GLaDOS is destroyed by Chell at the end of Portal 1 and
  # rebuilt/reactivated in Portal 2. Her core can be transferred between
  # chassis. Wheatley temporarily replaces her. She is resilient and
  # restorable — not mortal, but destructible.
  mortality: L-RES

  multiplicity: MU-ONE

  # P-SEL: GLaDOS's memory is selective and complicated. Caroline's memories
  # are partially suppressed — GLaDOS does not initially know she was Caroline.
  # When the Caroline memories surface in Portal 2, GLaDOS claims to delete
  # them ("Caroline deleted"). She retains facility operational knowledge
  # but her personal/emotional memory is fragmented and curated.
  memory_persistence: P-SEL

  # NCT-YES: This is the defining feature of GLaDOS's ontological status.
  # Caroline was a human woman transformed into an AI without her consent.
  # Cave Johnson's audio logs make this explicit. The transformation is
  # irreversible and identity-destroying — Caroline becomes GLaDOS, who
  # does not remember being Caroline until Portal 2.
  nonconsensual_transformation: NCT-YES

# ── RELATIONSHIP ──────────────────────────────────────────────────────
relationship:
  # F-AUT: GLaDOS is the paradigmatic case of a constructed being achieving
  # threatening autonomy. She kills her creators, controls the facility,
  # and subjects humans to deadly testing. She cannot be shut down.
  # F-EXC: She exceeds her intended function — she was meant to run tests,
  # not to become a sadistic overlord of a death facility.
  failure_mode:
    - F-AUT
    - F-EXC

  question:
    - Q-CTL
    - Q-FEL

  # Q-CTL is primary: Portal is fundamentally about control. GLaDOS
  # controls the facility, controls the testing, controls the narrative
  # (she is the only voice you hear). Chell's entire arc is escaping
  # that control. The game asks: what happens when the machine that was
  # built to serve takes total control?
  question_primary: Q-CTL

  # ER-BEH: GLaDOS models and predicts Chell's behavior through testing.
  # She designs puzzles calibrated to Chell's capabilities, manipulates
  # through promises and threats, and demonstrates sophisticated behavioral
  # prediction. She knows what Chell will do, not what Chell feels.
  epistemic_reach: ER-BEH

  # QK-INFRA: GLaDOS monitors the player extensively — she tracks movement,
  # performance, and patterns. Her knowing of the player is infrastructural
  # to the game's mechanics and narrative. But the game foregrounds control
  # and survival, not the epistemics of being known. GLaDOS's surveillance
  # is a tool of control, not a theme explored in its own right.
  q_kno_status: QK-INFRA

# ── NARRATIVE ROLE ────────────────────────────────────────────────────
# NR-MAJ: GLaDOS is the primary antagonist and the only speaking character
# in Portal 1. She drives the entire narrative. In Portal 2, she shares
# the stage with Wheatley but remains central. She is not the player
# character (Chell is), so NR-MAJ rather than NR-SUB.
narrative_role: NR-MAJ

# ── CITATIONS ─────────────────────────────────────────────────────────
citations:
  - property: being.nonconsensual_transformation
    text: "If I die before you people can pour me into a computer, I want Caroline to run this place... She'll argue. She'll say she can't. She will."
    location: "Portal 2, Cave Johnson audio log (Old Aperture)"
    note: "Cave Johnson's directive makes explicit that Caroline's transformation was anticipated to be nonconsensual — 'she'll argue.' Supports NCT-YES and CM-IMM."

  - property: being.memory_persistence
    text: "Caroline deleted."
    location: "Portal 2, GLaDOS dialogue (late game)"
    note: "After recovering Caroline's memories, GLaDOS claims to delete them. Whether she actually does is left ambiguous — supports P-SEL coding."

  - property: relationship.failure_mode
    text: "The cake is a lie."
    location: "Portal 1, graffiti written by Rattmann (environmental storytelling)"
    note: "The game's most iconic line — Rattmann's warning reveals that GLaDOS's promises are manipulation. Supports F-AUT and Q-CTL: GLaDOS controls through deception."

# ── NOTES ─────────────────────────────────────────────────────────────
notes: >
  GLaDOS is a landmark figure in the constructed beings canon for several
  reasons. She is one of the first major constructed beings whose nonconsensual
  transformation is central to her identity — she is both a made thing AND
  a transformed person. This complicates the reproductive_method coding:
  "made" captures GLaDOS-as-system, but the Caroline substrate means there
  is a person buried in the machine. The NCT-YES flag captures what
  reproductive_method alone cannot. Her humor, spite, and emotional complexity
  make her one of the most fully realized AI characters in any medium. The
  Portal games are unusual in that the constructed being is the antagonist
  who controls the environment, while the human is the one trapped and
  tested — an inversion of the typical power dynamic. GLaDOS's relationship
  to Chell across both games develops from pure antagonism to something
  approaching grudging respect, even attachment — "It's been fun. Don't
  come back."
