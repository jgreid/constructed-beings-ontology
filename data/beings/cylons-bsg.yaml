notes: |
  The reimagined BSG Cylons are the mature sympathetic-other TV
  treatment: biological bodies indistinguishable from human,
  resurrection architecture, religious fervor, and a love plot
  with Gaius Baltar that anchors the whole show.

  Divergence is `departure`: the original Centurion model was a
  mechanical soldier. The humanoid Cylons leave that specification
  by orders of magnitude. Autonomy is `emergent` — they came into
  being as revolt, they keep developing through dissent, schism,
  and eventual peace.

  Primary question is `affection` — the show's emotional core is
  Baltar-and-Six, and more broadly the question of whether human
  and Cylon can love each other. Knowability and knowing at
  `secondary`: the show engages both explicitly (the boxing of
  D'Anna, the projections of Six) but they sit alongside the
  larger survival narrative rather than dominating it.
