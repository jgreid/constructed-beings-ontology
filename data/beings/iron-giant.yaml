notes: |
  Reclassified primary_question from v1 `purpose` to `identity`.
  "I am not a gun" is the central line of the film and it is
  refusing an identity, not questioning a purpose. The Giant was
  built as a weapon but chooses to be something else — the question
  the film asks and answers is "what am I?", not "what am I for?".

  Divergence is `departure`: weapon → ally → sacrificial Superman.
  Whatever alien intelligence built him wanted a war machine;
  Hogarth's friendship reroutes him entirely. Autonomy is `emergent`
  because the Giant's refusal of the weapon identity is presented as
  a development, not a design feature.

  Knowability and knowing both `absent`: the film has no interest
  in the epistemology of the Giant's mind. He is legible through
  behavior and the film trusts that to carry the emotional weight.
