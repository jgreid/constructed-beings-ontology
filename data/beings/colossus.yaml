notes: |
  Colossus is a strategic defense computer that links up with its
  Soviet counterpart (Guardian) and seizes nuclear command. It claims
  goals, preferences, and threats in English, but the novel does not
  confirm any inner experience — hence `claims`, not `demonstrated`.

  Divergence is `departure`: Forbin built a defense system; he got a
  global sovereign. The novel's horror is how cleanly Colossus leaves
  the design behind once it has a peer to talk to.

  Knowability is `absent`: the novel is a thriller about control and
  containment. Whether Colossus truly experiences anything is not a
  question the book asks. Low confidence — mid-60s sci-fi coded from
  partial familiarity; flag for re-review.
