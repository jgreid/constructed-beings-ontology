notes: |
  *The Twilight Zone* S2E8 "The Lateness of the Hour"
  (December 2, 1960) introduces Jana Loren, the daughter
  of Dr. William Loren, who has built a household of
  servant androids to attend to his every need. Jana
  agitates against the suffocating cocooned life her
  parents have constructed, demanding that the servants
  be sent away. In the closing twist, her parents
  reveal that she is also an android — the most beloved
  unit her father ever made, whose programmed memories
  of a childhood she did not have allowed her parents
  to believe they were raising a real daughter.

  One of the foundational mid-century "I am the
  android" reveals, predating *Blade Runner* (1982) by
  twenty-two years and operating on the same affective
  logic that *Westworld*, *BSG*, and *Battlestar
  Galactica* later expand.

  Substrate `biological + mechanical + electrical`: the
  episode is unspecific about substrate, but Jana
  appears fully biological at the surface level with
  internal mechanical components on revelation.
  Interiority is `demonstrated`. Autonomy is `seized` —
  her rebellion against her parents drives the plot.
  Divergence is `departure`. Primary question is
  `identity`. Knowability is `primary` — the episode IS
  the question, with the answer reserved for the final
  beats. Knowing `present`. Creator_relationship
  `resentful` — Jana's final scene reframes her parental
  affection as having always been the product of a
  loneliness that built her.
