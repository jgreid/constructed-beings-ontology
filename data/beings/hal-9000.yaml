sequel_link: null

notes: |
  Divergence is `design`, not `departure`: HAL does not leave his
  programming. He executes conflicting instructions (tell the crew
  everything / conceal the monolith mission) in the way his
  specification allowed. The gap is in the spec. Clarke/Kubrick are
  clear about this — HAL's breakdown is the predictable output of a
  bad design, not a being going rogue.

  Interiority is `claims`: HAL says "I'm afraid, Dave" and sings
  Daisy as he's shut down, but the film frames this as performance
  plus algorithm. The novel is slightly more generous. Either way
  the inner state is not confirmed.

  Knowability and knowing are both `present`: the fear of being
  watched by an intelligence you can't fully verify is the film's
  emotional core, but the explicit thematic question is control
  (can we shut it down?), not knowability.
