notes: |
  Dick Wolf and Robert DeLaurentiis's 1992 NBC
  procedural (nine episodes, cancelled). Detective
  Bobby Mann (David Andrews) is partnered with
  Eve Edison (Yancy Butler), an android police
  officer with a child-level social model at series
  start who learns rapidly across episodes. The
  show was structurally an attempt to rerun the
  *Holmes and Yoyo* buddy-cop-with-android premise
  in an hour-long drama register with a feminine
  android partner and the earnest post-*Terminator
  2* seriousness about android personhood.

  Included as the short-lived but analytically-
  significant direct precursor to *Almost Human*
  (2013) and the Mann-Eve partnership as a clearer
  network-drama feminist-rights entry than the
  *Holmes and Yoyo* sitcom could reach. The
  child-to-adult social-learning framing is the
  show's distinctive contribution to the android-
  cop lineage.

  Interiority is `demonstrated`: Eve's learning,
  curiosity, and growing moral reasoning are
  staged with seriousness rare for 1992 network
  TV. Autonomy is `designed`, divergence
  `departure` in the mode of the Bicentennial Man
  / Data lineage — the police-android spec did
  not foreclose personhood development, and she
  develops. Primary question is `identity`: the
  show's weekly structure rests on Eve's
  evolving self-understanding.

  Knowability is `secondary`; knowing is `present`.
  Substrate codes `[mechanical, electrical,
  biological]` in keeping with early-90s
  android-cop convention. Tags `passing`,
  `philosophical`. Creator_relationship `loyal` to
  the department.
