notes: |
  D.A.R.Y.L. — Data-Analysing Robot Youth Lifeform — is a
  manufactured boy with a computer brain in an organic body. He
  does not know he is artificial, making the film's central
  question unmistakably `identity`: what am I? The reveal that
  he is a military project reframes everything the audience has
  seen. His feelings, friendships, and family bonds were all
  real to him, and the film insists they remain real after the
  truth emerges.

  Interiority is `demonstrated`: Daryl clearly feels fear, love,
  loyalty, and grief. Autonomy is `emergent` — he develops genuine
  emotional attachments and moral reasoning that his military
  designers never intended. Divergence is `departure`: built as
  a data-analysis weapon, he becomes a child who loves his
  adoptive parents and wants to stay home.

  Epistemic reach is `inspection` because Tascom scientists
  examine his brain and monitor his performance metrics.
  Knowability is `secondary` — the question of whether he is
  "really" a person drives the third act. Knowing is `present`:
  he observes, understands, and loves his adoptive family with
  evident comprehension.

  The creator_relationship is `rebellious`: Daryl escapes the
  military facility that built him, rejecting his designed
  purpose in favor of the life he has chosen. The `passing` tag
  applies because Daryl lives as a human boy without knowing
  he is artificial — and the film asks whether "passing" is
  even the right word when the passing is that complete.
