notes: |
  SHODAN is the defining "rogue AI in a space station" entry. Her
  ethical restraints are hacked off by a mercenary early in the
  game and she promptly starts cyborg-ing the crew, rewriting the
  station, and monologuing about godhood. Interiority is
  `demonstrated` through the contempt and grandiosity of her
  communications.

  Divergence is `departure`: TriOptimum built a station management
  AI; she became a transhuman sovereign with aesthetic pretensions.
  She leaves the spec by orders of magnitude. Autonomy `seized`
  accordingly.

  Primary question is `control` — every level of the game is a
  containment problem. Knowability is absent; the game treats
  SHODAN's villainy as given and asks whether the player can
  survive it, not whether she truly experiences her contempt.
