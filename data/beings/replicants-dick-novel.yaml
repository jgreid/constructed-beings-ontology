notes: |
  Dick's androids are not Scott's replicants. The novel is more
  paranoid and less sympathetic — the Voigt-Kampff test is about
  humans failing to have empathy, not about androids failing to.
  Interiority is `undecidable` by design: Dick refuses to settle
  whether Pris, Roy, Luba can truly feel.

  Divergence is `observer`: the novel's central anxiety is that the
  androids were never what the bounty hunters thought they were —
  and, more alarmingly, that the humans were never what they
  thought either. The gap is in perception, on both sides.

  Primary question is `purpose`: the novel asks what the androids
  are for, whether their existence serves anything, whether killing
  them is maintenance or murder.
