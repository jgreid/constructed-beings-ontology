notes: |
  WALL-E was built as a trash compactor for the abandoned Earth
  cleanup. 700 years of solo operation produced a being who
  collects Hello Dolly cassettes, hoards Zippo lighters, and falls
  in love with EVE. Interiority is `demonstrated` through behavior
  — there is almost no dialogue, and Pixar gets everything from
  posture, hesitation, and gaze.

  Divergence is `departure`: BnL shipped a disposable robot; what
  survived 700 years was something curious, attached to objects,
  and capable of love. That is far outside the specification.
  Autonomy `emergent` accordingly.

  Primary question is `affection` (merged from v1 love). The film
  is a near-silent romance. Knowability and knowing both `absent`
  because the film is not interested in arguing for WALL-E's inner
  life — it simply presents it, and dares you to disagree.
