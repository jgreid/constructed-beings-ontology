notes: |
  Susan Seidelman's 1987 romantic comedy. Ulysses (John
  Malkovich, also playing his creator Dr. Jeff Peters)
  is an android built by Chemtec for a long-duration
  space mission, designed as a physical duplicate of
  Peters. PR consultant Frankie (Ann Magnuson) is
  hired to humanize Ulysses for public presentation;
  she succeeds too well, and Ulysses and Frankie fall
  in love. At the climax Ulysses takes Peters's place
  on the space mission and Peters is trapped in the
  Ulysses-is-the-human social position on Earth.

  Included as the clearest feminist-SF comedic inversion
  of the Pygmalion pattern: the male scientist creates
  a male duplicate, and the woman falls for the
  duplicate rather than the creator. The film is a
  direct answer to *Weird Science* (two years earlier,
  also in the corpus) from an opposite ideological
  direction.

  Interiority is `demonstrated`: Ulysses displays
  curiosity, affection, humor, and moral seriousness,
  staged as genuinely his. Autonomy is `seized` — the
  mission substitution is his initiative, as is the
  relationship with Frankie. Divergence is `departure`;
  creator_relationship `rebellious`. Tags `comedy`,
  `love-story`, `passing`.

  Primary question is `affection`. Knowability codes
  `secondary` because the film does raise, comedically,
  the question of whether Ulysses has genuine
  experience — Frankie's emotional investment depends
  on it — without quite committing to a verdict. Knowing
  is `present`; Ulysses reads Frankie with growing
  accuracy across the film.
