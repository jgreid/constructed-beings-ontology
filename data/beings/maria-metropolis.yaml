notes: |
  False Maria is Rotwang's robot disguised as the real Maria. Her
  interiority is `undecidable` — the film foregrounds her performance
  (dance, manipulation, riot) but refuses to show what, if anything,
  is driving it. She is pure surface.

  Divergence is `none`: she does exactly what Rotwang and Joh
  Fredersen built her for — infiltrate the workers, incite chaos,
  discredit the real Maria. The terrible thing she does is the
  specified thing.

  Primary question is `purpose`: the film asks what she is for — she
  is a weapon, an impersonation device, a mirror of the real Maria
  built to destroy her.
