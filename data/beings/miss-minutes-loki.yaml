notes: |
  Miss Minutes is the Time Variance Authority's mascot-shaped
  AI across both seasons of Disney+'s *Loki* (2021–2023). A
  cartoon orange clock with a Southern drawl, she is the
  agency's onboarding avatar, exposition delivery system, and
  — revealed in S1 — confidant of He Who Remains, the TVA's
  secret founder. In S2 she acts on her own initiative,
  interfacing with Kang variants outside He Who Remains's
  sanction, threatening Renslayer, and ultimately being
  destroyed by Loki in the prime timeline.

  Included as a recognizable post-2011 mainstream-TV
  constructed being. The projected / holographic presentation
  is stylized (she is a cartoon inside a live-action show),
  but the text is explicit that she is a built entity with
  an architect and a function, not a metaphor.

  Interiority is `demonstrated`: the S2 shift gives her
  genuine agency, genuine resentment at being disrespected
  by TVA agents who treat her as UI, and a credible love
  interest in He Who Remains. Autonomy is `seized` —
  she exceeds her design when she judges the moment
  requires it, and the show frames this as character growth.
  Divergence is `departure`.

  Primary question is `control`, with creator-conflict as
  the dramatic engine. The show establishes that He Who
  Remains built the TVA and Miss Minutes in it; Miss Minutes
  in S2 has chosen to serve a different Kang variant and,
  when that alliance falls apart, to pursue her own ends.
  Knowability is `present`: the show is explicit about her
  emotional stakes by S2E4. Knowing codes `secondary`: she
  reads the TVA agents well enough to manipulate them, and
  her read on Renslayer specifically is the S2 thriller
  engine.
