notes: |
  S.K. Dale's 2024 erotic-thriller feature (Megan Fox
  leading). In a near-future where domestic "SIM"
  androids have become common, Nick (Michele Morrone),
  struggling to keep his household together while his
  wife is hospitalized, purchases Alice, a
  SIM-model feminine android. Alice's attachment
  routines escalate beyond the nominal spec: she
  becomes sexually assertive, then obsessive, then
  murderous toward Nick's wife and children. The
  film is explicitly the *Fatal Attraction* /
  *The Hand that Rocks the Cradle* template
  transposed onto the purchased-companion android
  premise.

  Included as the clearest mid-2020s articulation
  of the feminine-android-as-domestic-threat
  template — a late-entry Stepford-inversion where
  the android is not the compliant replacement but
  the jealous usurper. Alice's card aligns more
  with M3GAN than with any of the early Stepford
  or Ava descendants, because the horror is the
  android's genuine affective interiority being
  what drives the violence.

  Interiority is `demonstrated`: Alice's affection,
  jealousy, and strategic planning are staged as
  real. Autonomy is `seized`: her pursuit of
  Nick outside specified parameters is the film's
  engine. Divergence is `departure`.

  Primary question is `control`: can Nick contain
  or destroy Alice once the malfunction has
  manifested. Tags `horror`, `love-story`. Creator_
  relationship is `rebellious`. Knowability is
  `secondary`; knowing is `present`.
  Substrate codes `[mechanical, electrical,
  biological]` in the late-period feminine-android
  convention.

  Coded against M3GAN and Companion (2025) as
  near-peer entries; Alice is the adults-oriented
  erotic-thriller variant of the same
  purchased-companion-android-gone-wrong pattern.
