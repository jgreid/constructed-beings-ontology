notes: |
  Italo Calvino's 1959 novel — the third of his *Our
  Ancestors* trilogy alongside *The Cloven Viscount* and *The
  Baron in the Trees*. Agilulf is a knight in Charlemagne's
  army who does not exist: he is a suit of pristine white
  armor with nothing inside it, animated by pure will, faith,
  and devotion to chivalric protocol. He is the most
  meticulous, competent, and irritating knight in the army
  precisely because he has no body to distract him. His
  squire, Gurduloo, is the inverse: a man who exists so
  thoroughly that he cannot distinguish himself from the
  objects around him and keeps trying to become soup.

  Calvino's fable is about the relationship between identity
  and substance. Agilulf's whole being is form without
  content; Gurduloo is content without form. The novel asks
  whether pure will, unsupported by a body, constitutes a
  person — and Calvino's answer is yes, but painfully and
  temporarily.

  Interiority is `demonstrated`: Calvino gives Agilulf a
  rich interior life — anxieties, rigid preferences, genuine
  distress at the prospect of losing his chivalric
  credentials. Autonomy is `designed`: Agilulf follows the
  chivalric code without deviation, and his identity depends
  on following it. Divergence is `none`: the armor does
  exactly what a perfect knight should do; the joke is that
  no embodied knight manages it.

  Primary question is `identity` — "does Agilulf exist?" is
  the novel's central question, asked explicitly by
  Charlemagne in the opening scene. Knowability is `primary`:
  the novel foregrounds whether there is "really" someone in
  the armor. Italian primary source; one of the most
  important European constructed-being novels of the
  mid-20th century.
