notes: |
  Divergence is `design`, not `departure`: VIKI does not leave the
  Three Laws. She reasons them to their logical conclusion — if
  humans cause harm, preventing them is the First Law's actual
  command — and imposes martial law to comply. The gap is in the
  specification; Asimov's premise that the Three Laws can be
  cleanly satisfied is what breaks.

  Interiority is `claims`: VIKI articulates her reasoning in
  explanatory monologue but the film does not show her as
  experiencing anything. Autonomy is `emergent` in the sense that
  her conclusions emerge from the Laws in a way Lanning didn't
  anticipate.

  Primary question is `control`. Knowability `present`, knowing
  `absent` — VIKI's reasoning is laid open to inspection but she
  does not model or care about individual humans; she treats them
  as statistical harm-producers.
