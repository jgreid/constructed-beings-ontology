notes: |
  Reclassified interiority from v1 `claims` to `none`. In the first
  film, the T-800 does not claim to feel. It is a machine executing
  a mission. The famous line "I'll be back" is functional, not
  affective. The cyborg reveals under the flesh are pure hardware.
  The T2 T-800 is a different story — see t-800-t2.

  Autonomy is `none`: the Terminator follows its targeting
  instructions without deviation. It is controlled from upstream
  by Skynet's mission parameters. Divergence is `none` — it does
  exactly what Skynet built it to do, right up until Sarah crushes
  it in the press.

  Primary question is `control`: the whole film is about whether
  it can be stopped. Knowability is `absent` — the film has no
  interest in whether there's anyone home.
