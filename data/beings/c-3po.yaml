notes: |
  Reclassified primary_question from v1 `obedience` to `none`. The
  Star Wars saga does not ask a question about C-3PO's nature, role,
  or standing. He is a comic relief droid. When characters treat him
  as a person it's for gags, not philosophical stakes. When the
  story wants to ask a droid question, it asks about R2 (whose
  mission-critical interventions drive scenes).

  Interiority is `demonstrated` through his anxious commentary.
  Autonomy is `designed` — he was explicitly built to be a protocol
  droid with conversational initiative. Divergence is `none`: he
  performs his diplomatic/translation function essentially as
  designed, notwithstanding the occasional panic.

  Epistemic reach is `inspection` because the saga repeatedly shows
  C-3PO's insides — memory wipes, reassembly, restraining bolts. You
  can literally open him up.
