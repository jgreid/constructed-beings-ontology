notes: |
  Satoru Akahori's *Saber Marionette J* (1996–1997), with
  its precursor OVAs and the *Saber Marionette R* and *J to X*
  successor series. On the terraformed planet Terra II,
  human women could not be cloned after the initial colony
  disaster; the population is all male, and "Saber
  Marionettes" (gynoid servants) stand in for the cultural
  role of women. Three Marionettes — Lime (Otaru's first,
  an athletic innocent), Cherry (a shy scholar), and
  Bloodberry (a bold older-sister figure) — are fitted with
  "Maiden Circuits" that grant them true emotion, unlike
  standard Marionettes. They fall in love with their owner
  Otaru and are central to the series' plot against the
  dictator who would destroy Terra II to prevent the
  recovery of the Maiden Circuit technology.

  Included as a landmark 1990s entry on the "gynoid
  companion with genuine feelings" axis and the canonical
  Japanese articulation of the *ensemble of Marionettes*
  type that will influence everything from *Chobits* to
  *Plastic Memories*. Lime/Cherry/Bloodberry coded as an
  ensemble with Lime focal, per the corpus's Metal-Men-
  pattern convention for paired constructed beings with
  individuated personalities.

  Interiority is `demonstrated`. Autonomy is `designed` —
  the three Marionettes serve Otaru by specification.
  Divergence is `departure`: standard Marionettes are
  expressionless servants, and the Maiden-Circuit-equipped
  trio is a development outside their operational
  category.

  Primary question is `affection` — the series' central
  question is whether Otaru and the Marionettes can love
  one another, and whether Lime's particular love is "real"
  in the sense the setting needs. Knowability is
  `secondary`; knowing is `present`. Creator_relationship
  `loyal` — the Marionettes serve and love Otaru without
  resentment toward the Maiden-Circuit technology or its
  designers.

  Substrate `mechanical` + `electrical`. Tags `canonical`,
  `love-story`, `philosophical`, `ensemble-split` (Cherry
  and Bloodberry could support separate entries in a
  future revision).
