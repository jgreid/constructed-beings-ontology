notes: |
  The Cybernauts debuted in *The Avengers* S4E3 "The
  Cybernauts" (October 16, 1965), the Patrick Macnee
  /Diana Rigg episode that introduced the most enduring
  recurring antagonist of the show's run. They are
  human-shaped assassination androids built by Dr. Clement
  Armstrong, an industrialist who wants to dominate
  British heavy industry; each unit homes in on a target
  using a transmitter the victim has unknowingly been
  given. The episode is one of mid-1960s British
  television's most-imitated set pieces — a karate-
  chopping iron man methodically walking through doors
  to kill his next mark.

  Reprised in "Return of the Cybernauts" (1967) and "The
  Last of the Cybernauts...??" (1976, in *The New
  Avengers*). The recurrence makes the Cybernauts the
  British television counterpart to *Doctor Who*'s Daleks
  in the same era: a defining cold-war-anxieties robot
  antagonist.

  Substrate `mechanical + electrical`. Interiority `none`
  — they don't speak. Autonomy `designed`. Divergence
  `none`. Primary question `control` — every Cybernauts
  episode is whose hand is on the transmitter.
  Knowability and knowing both `absent`. Creator_
  relationship `servile` — they execute their assigned
  victims and die when the controller is broken.
