notes: |
  Stinky Pete is the Prospector antagonist of *Toy Story
  2* (1999): a never-opened "Woody's Roundup" collectible
  who has spent decades in his original box and now wants
  to be sold as a complete set to a museum in Japan,
  rather than risk being loved and discarded. He is the
  film's articulator of the same wound that Toy Story
  toys are built around — the fear of being outgrown.

  Substrate `magical` (corpus convention for Pixar toys).
  Interiority is `demonstrated`. Autonomy is `seized`:
  he is acting on his own decade-old plan throughout
  the film. Divergence is `departure` — Pete is a toy
  who refused his function and re-organized himself
  around museum permanence.

  Primary question is `purpose` — what is a toy for?
  Pete's answer (preservation) differs from Woody's
  (play). The film's argument is that Pete's answer is
  wrong, but the dignity of the position is respected.
  Knowability `absent`. Knowing `present`. Creator_
  relationship `resentful` — Pete's whole story is being
  shelved decades ago and never opened.
