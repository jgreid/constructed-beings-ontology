notes: |
  Plato's Meno (97d–98a) has Socrates compare true opinions to
  the statues of Daedalus: if not tethered, they run away. Plato
  treats the walking statues as cultural common-knowledge — a
  legend already in circulation, referenced casually for a
  philosophical analogy about epistemology. Aristotle's Politics
  (1.4) similarly invokes Daedalus's tripods and self-moving
  statues as a thought experiment about slavery ("if every tool
  could perform its work on command… foremen would have no need
  of subordinates, or masters of slaves").

  Coded here as "poem" medium, the closest available enum value
  for a Greek philosophical dialogue; flagged because none of
  the schema's media quite fit the Platonic dialogue form. A
  future schema revision might add `dialogue` or `prose`; the
  analytical content is what matters.

  Interiority is `none` and primary_question is `none` because
  Plato does not make a question about the statues — they are
  the analogical vehicle, not the subject. Autonomy `designed`:
  they are self-moving craftsman-products. The passage matters
  because it is one of the earliest Western texts to treat the
  possibility of constructed agents philosophically rather than
  mythologically. The chain Plato → Aristotle → medieval
  automaton-legends (Albertus, Bacon) → Romantic-era automata is
  recognizable here in its first link.

  Substrate `mechanical` + `magical` captures the ambiguity —
  Daedalus is a craftsman (mechanical) but the legendary statues
  are described as self-moving in a way that only myth can
  account for. Included on its own because the Plato reference
  is the canonical philosophical citation of Greek automata and
  belongs in the corpus as the foundational *philosophical*
  (as opposed to narrative) entry in the ancient tradition.
