notes: |
  The 1963 anime adaptation of Tezuka's manga — the first
  animated television series produced in Japan and broadcast
  internationally. The card is stable from the manga: same
  identity question, same departure divergence, same
  demonstrated interiority. The anime adds `service` to the
  motivation list because the episodic structure emphasizes
  Atom's weekly heroic missions more than the manga's
  longer-form identity arcs.

  This entry is historically significant as the work that
  launched the anime industry worldwide and introduced
  Japanese constructed-being storytelling to Western audiences.
  NBC broadcast a dubbed version in the United States in 1963,
  making Astro Boy one of the first anime characters recognized
  by American audiences.
