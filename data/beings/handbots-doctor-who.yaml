notes: |
  *Doctor Who*, "The Girl Who Waited" (Tom MacRae, Eleventh
  Doctor, September 2011). Amy Pond is trapped in a quarantine
  facility on Apalapucia, where visitors afflicted with the
  one-day-lethal Chen-7 virus have been placed in time-
  accelerated "kindness" streams so they can live out their
  remaining hours as full subjective lifetimes. The facility's
  staff consist entirely of the Handbots — faceless humanoid
  robots whose glowing palms deliver soothing injections. The
  injections are calibrated for the two-hearted Apalapucian
  biology. They are fatal to humans. The Handbots greet Amy
  pleasantly, smilelessly, and attempt to kill her throughout
  the episode.

  A striking entry in the Doctor Who robot canon and a clear
  articulation of the "designed kindness as threat" pattern.
  The Handbots are exemplary `divergence: design`: they are
  performing their designed function perfectly, and the
  function is incompatible with the patient. MacRae's script
  makes explicit that the Handbots are not malfunctioning;
  they are working as specified. The specification was not
  written for humans.

  Interiority is `none` — the Handbots do not speak, do not
  emote, and the episode does not ask what they might be
  thinking. Primary question is `none`; they are the
  environment, not characters. Epistemic reach is `behavioral`.
  Creator_relationship `servile`. Autonomy `designed` —
  everything they do is the Two Streams Facility's default
  operational policy.

  The Handbots belong in the corpus as the clearest modern
  Doctor Who example of the Bradbury Mechanical Hound lineage
  — infrastructural enforcement automata the text does not
  individuate. Tag `horror` is the register the episode
  explicitly plays in.
