notes: |
  Interiority is `narrated`: Shelley gives the Creature his own
  first-person chapters inside the frame narrative. He speaks in his
  own voice, quoting Paradise Lost, articulating his desires.

  Divergence is `departure`: Victor wanted a "new species" to bless
  him; what he got was a moral philosopher with his own demands. The
  gap is in where the Creature went, not in the specification.

  Primary question is `affection` (merging v1's fellow-feeling and
  love): the Creature's central demand is to be loved, to have a
  companion, to not be alone. The refusal of that demand is what
  drives the rest of the plot.
