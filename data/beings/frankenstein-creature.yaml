notes: |
  Interiority is `narrated`: Shelley gives the Creature his own
  first-person chapters inside the frame narrative. He speaks in his
  own voice, quoting Paradise Lost, articulating his desires.

  Epistemic reach is `conversational`: the Creature's three
  first-person chapters constitute the reader's highest-fidelity
  channel to his interior. His articulate self-narration — reasoning
  about desires, quoting Milton, making moral claims — means language
  is the primary access mode, not mere behavioral observation.

  Divergence is `departure`: Victor wanted a "new species" to bless
  him; what he got was a moral philosopher with his own demands. The
  gap is in where the Creature went, not in the specification.

  Primary question is `affection`: the Creature's central demand is
  to be loved, to have a companion, to not be alone. The refusal of
  that demand is what drives the rest of the plot.
