notes: |
  Peter Brown's 2016 middle-grade novel — the source text for
  the 2024 DreamWorks film. The novel gives Roz first-person
  narrated access (interiority `narrated` rather than the film's
  `demonstrated`) and treats the knowability question more gently
  (`present` rather than `secondary` — the novel raises it without
  foregrounding it).

  The core card is stable across novel and film: departure
  divergence, affection primary question, emergent autonomy.
  The novel spawned two sequels (*The Wild Robot Escapes*, 2018
  and *The Wild Robot Protects*, 2023) that develop the
  relationship between Roz and Brightbill further.
