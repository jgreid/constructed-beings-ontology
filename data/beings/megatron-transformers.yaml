notes: |
  Counterpart entry to `optimus-prime-transformers`. Megatron
  is the leader of the Decepticons — the faction of
  Cybertronians whose response to the Quintesson slave-system
  was not liberation but domination. Where Optimus embodies
  the "constructed beings deserve rights" position, Megatron
  embodies "constructed beings deserve power," and the
  franchise's entire ethical structure depends on the contrast.

  Interiority is `demonstrated`: Megatron is given extensive
  monologues and clear motivations across decades. Autonomy is
  `seized` — more aggressively than Optimus's `emergent`,
  because Megatron's whole character is the will to take.
  Divergence is `departure`. Primary question is `control`:
  Megatron's driving concern is dominion, and the franchise
  presents this as the wrong answer to the Quintesson
  question.

  Included as the Optimus counterpart because the
  Autobot/Decepticon split is structurally the rights/control
  contrast that runs through the whole constructed-beings
  corpus — Megatron is the Skynet answer to the Data question,
  and the franchise is explicit about this.
