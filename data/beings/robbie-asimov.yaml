notes: |
  Key test case for the Knowability/Knowing split: knowability is
  `absent` (no one in the story doubts that Robbie is a machine) but
  knowing is `present` (Robbie demonstrably knows Gloria — her games,
  her preferences, her danger). The story is about whether a child's
  attachment to a machine is a real relationship, and the answer
  depends on the machine's ability to know her.

  Divergence is `none`: Robbie performs his caretaking function
  exactly as designed. No gap between intent and outcome. Primary
  question is `affection` (merging v1 fellow-feeling and love) —
  specifically, the story asks whether Gloria's love for Robbie is
  misplaced. Asimov's answer is that it isn't, and the answer hinges
  on Robbie's reciprocal knowing.
