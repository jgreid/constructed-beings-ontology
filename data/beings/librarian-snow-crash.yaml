notes: |
  The Librarian is the daemon program Hiro Protagonist
  rents from the Central Intelligence Corporation in
  Neal Stephenson's *Snow Crash* (1992) — a research
  assistant who appears as a tweedy older man in the
  Metaverse and conducts the novel's substantial mid-
  book lecture on Sumerian linguistics, viral memes,
  and the deep history of language. The Librarian
  carries roughly half of Stephenson's expository
  argument about the metaphysics of the novel's
  proper-noun "Snow Crash" virus.

  Substrate `electrical`. Embodiment `projected` (a
  Metaverse avatar) — he has no physical body in the
  novel's frame, but he interacts conversationally with
  Hiro and others. Interiority is `claims` — the
  novel treats him as a sophisticated retrieval-and-
  presentation system that Hiro repeatedly asks to
  clarify whether it has its own opinions ("does this
  unit have a soul?" 's literary cousin); the Librarian
  answers in the negative each time.

  Autonomy is `designed`. Divergence is `none`. Primary
  question is `knowledge` — the Librarian's whole role
  in the novel is acting as the channel for information.
  Knowability `secondary`. Knowing `primary` — he is
  literally the knowledge interface. Creator_relationship
  `servile`.

  Foundational entry in the corpus's "AI research
  assistant" lineage. Direct ancestor of much later
  retrieval-augmented-generation framing in actual AI
  systems.
