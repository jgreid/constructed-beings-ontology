notes: |
  Reclassified primary_question from v1 `control` to `none`. The
  Argonautica does not ask a question about Talos. He is a guard the
  Argonauts must get past. Medea defeats him by exploiting the ichor
  vein at his ankle; the text treats him as an obstacle with a known
  weakness, not as a subject of narrative inquiry. This is the
  prototypical `primary_question: none` case — the being is plot
  furniture.
