notes: |
  Iris is an AI companion robot whose relationship with her
  human partner reveals hidden layers of programming, autonomy,
  and manipulation. The film operates as a thriller where the
  question of who is controlling whom keeps shifting.

  Divergence is `observer`: Iris is not what her partner (or
  the audience) initially believes. The gap is in perception —
  the reveal restructures everything the audience thought they
  understood about the relationship. This places Iris in the
  observer cluster with Ava, Bernard, and Trent.

  Interiority is `undecidable`: the film refuses to settle
  whether Iris's emotional responses are genuine or
  strategically performed. The ambiguity is the point.

