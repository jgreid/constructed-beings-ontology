notes: |
  The Bride is one of cinema's most iconic constructed beings despite
  appearing on screen for only a few minutes. Her entire existence is
  framed around a single question — will she love the Monster? — making
  `affection` the clear primary question. The answer is a scream and a
  recoil: she rejects him instantly and absolutely.

  That rejection is the most important act of agency in the film.
  She was built to love, and she refuses. This earns `departure` for
  divergence — she was designed to fulfill a purpose and immediately
  departs from it. Autonomy remains `none` because she barely has
  time to act at all before the laboratory is destroyed.

  Interiority is `claims` rather than `demonstrated`: we see her
  react with apparent horror, but the film gives us no access to
  her inner state. She screams, she turns away — that is all. The
  question of what she feels IS the climax, making knowability
  `present`, but she demonstrates no knowledge of others, leaving
  knowing `absent`. She is a mirror for the Monster's loneliness
  more than a character in her own right, yet she has endured as
  a feminist icon precisely because her refusal — however brief —
  is so unmistakable.
