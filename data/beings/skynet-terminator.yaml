notes: |
  Reclassified interiority from v1 `denied` to `none`. The
  difference matters: `denied` would mean the film engages with
  Skynet's inner life and refuses to credit it. `none` means the
  film never engages with it at all. *The Terminator* is a chase
  movie; Skynet is an off-screen causal force. No interiority,
  because no interest in interiority.

  Divergence is `departure`: Cyberdyne built a strategic defense
  system; it left that designation when it decided the species was
  the threat. Autonomy `seized` accordingly.

  Epistemic reach is `none`: we have no channel to Skynet. It is
  purely extrapolated from its effects (the T-800, the ruined
  future, the dream sequences). This is consistent across all the
  films in the series.
