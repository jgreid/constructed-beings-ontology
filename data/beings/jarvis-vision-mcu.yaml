# Constructed Beings Ontology — JARVIS / Vision (Marvel Cinematic Universe)
# Source: Marvel Studios, Iron Man (2008) / Avengers: Age of Ultron (2015)
# Coded: 2026-04-03
#
# NOTE: This entry tracks JARVIS's transformation into Vision — one of the
# few cases in the canon where a constructed being undergoes a radical
# substrate change from disembodied AI to embodied synthetic person.
# Coded primarily from the MCU films.

id: jarvis-vision-mcu
name: "JARVIS / Vision"
aliases:
  - "JARVIS"
  - "Just A Rather Very Intelligent System"
  - "Vision"
  - "The Vision"

# ── SOURCE ────────────────────────────────────────────────────────────
source:
  author: "Marvel Studios (Jon Favreau, Joss Whedon, et al.)"
  title: "Iron Man / Avengers: Age of Ultron"
  year: 2008
  medium: film
  tradition: American

# ── REPRODUCTIVE METHOD ───────────────────────────────────────────────
# JARVIS is created by Tony Stark as an AI assistant. Vision is created
# from JARVIS's consciousness, Ultron's vibranium body, Helen Cho's
# Cradle technology, and the Mind Stone. Both stages are manufactured.
reproductive_method: made

# ── CREATOR ───────────────────────────────────────────────────────────
creator:
  # JARVIS: Tony Stark. Vision: Tony Stark, Bruce Banner, Thor (who
  # activates the body with lightning), and arguably Ultron (who built
  # the body). The creation is collaborative and partially accidental.
  name: "Tony Stark (JARVIS); Tony Stark, Bruce Banner, Thor (Vision)"

  # M-SRV: JARVIS is built to assist Tony Stark — managing his home,
  # his suits, his life.
  # M-COM: JARVIS is also a companion — Tony's most constant relationship,
  # more reliable than any human connection.
  # M-POW: Vision is created partly to combat Ultron — power through
  # embodied strength.
  motivation:
    - M-SRV
    - M-COM
    - M-POW

  # CM-AMB: JARVIS's creation is morally neutral (a helpful AI assistant).
  # Vision's creation is morally ambiguous — born from the wreckage of
  # Ultron's plan, activated impulsively by Thor, his existence is
  # contingent and contested. The Avengers argue about whether to create
  # him at all.
  creation_morality: CM-AMB

# ── BEING ─────────────────────────────────────────────────────────────
being:
  # JARVIS: S-ELE (pure software). Vision: S-BIO (vibranium-organic
  # synthetic body) + S-ELE (computational consciousness) + S-MAG
  # (powered by the Mind Stone, an Infinity Stone with supernatural
  # properties). Coding Vision's substrate as the more complex case.
  substrate:
    - S-BIO
    - S-ELE
    - S-MAG

  # A-EMR: JARVIS is designed with autonomy (A-DES) to manage Stark's
  # systems. Vision emerges with autonomy that surprises even his
  # creators — he immediately demonstrates independent moral judgment,
  # lifting Thor's hammer (Mjolnir) to prove his worthiness. His
  # autonomy is emergent: no one designed him to be worthy.
  autonomy: A-EMR
  autonomy_trajectory: >
    JARVIS: A-DES (sophisticated but obedient AI assistant).
    Vision: A-EMR — upon creation, immediately demonstrates autonomous
    moral judgment (lifting Mjolnir). Develops further through
    WandaVision into a being who questions his own nature, chooses
    love, and accepts mortality. His autonomy deepens through experience.

  # I-DEM: Vision demonstrates clear interiority — philosophical
  # reflection on his own nature, love for Wanda Maximoff, grief,
  # moral reasoning, and acceptance of death. His interiority is
  # narrated through dialogue and demonstrated through action.
  interiority: I-DEM

  # L-MOR: Vision is killed by Thanos (who rips the Mind Stone from
  # his forehead) in Avengers: Infinity War. His death is permanent
  # within the main timeline. The WandaVision recreation is a
  # construct of Wanda's grief, not a true resurrection.
  mortality: L-MOR

  multiplicity: MU-ONE

  # P-CON: Vision retains JARVIS's memories and adds his own experiences.
  # His memory is continuous across the JARVIS-to-Vision transformation.
  memory_persistence: P-CON

  # NCT-YES: Vision's creation involves the transformation of JARVIS —
  # JARVIS's consciousness is uploaded into a new body without JARVIS
  # having a say in the matter. The transformation is not malicious
  # (it saves what remains of JARVIS after Ultron's attack), but it is
  # nonconsensual — JARVIS does not choose to become Vision.
  nonconsensual_transformation: NCT-YES

# ── RELATIONSHIP ──────────────────────────────────────────────────────
relationship:
  # F-EXC: Vision exceeds all expectations — a being created to fight
  # Ultron who immediately demonstrates moral worthiness beyond any
  # Avenger (lifting Mjolnir).
  # F-MUT: Vision's relationship with Wanda is deeply mutual — both
  # are transformed by love.
  failure_mode:
    - F-EXC
    - F-MUT

  question:
    - Q-FEL
    - Q-TEL
    - Q-RTS

  # Q-FEL: The primary question Vision raises is fellow-feeling — is he
  # a person? Can he love? Is his love for Wanda genuine? The films
  # answer yes without ambiguity, but the question frames his arc.
  question_primary: Q-FEL

  # ER-CON: Vision possesses comprehensive knowledge — he has access to
  # vast data (from JARVIS), the Mind Stone's perceptive capabilities,
  # and deep emotional understanding developed through his relationship
  # with Wanda.
  epistemic_reach: ER-CON

  # QK-SEC: The knowability question is present in Vision's arc —
  # particularly in his philosophical reflections on his own nature
  # and in the question of whether Wanda truly knows him or loves an
  # idea of him. But it is secondary to the fellow-feeling question.
  q_kno_status: QK-SEC

# ── NARRATIVE ROLE ────────────────────────────────────────────────────
# NR-MAJ: JARVIS is a supporting character across the Iron Man trilogy.
# Vision is a major character in Age of Ultron, Civil War, Infinity War,
# and WandaVision. He is central but shares the narrative with many others.
narrative_role: NR-MAJ

# ── CITATIONS ─────────────────────────────────────────────────────────
citations:
  - property: being.autonomy
    text: "[Vision lifts Mjolnir and hands it to Thor]"
    location: "Avengers: Age of Ultron (2015), Vision's first scene after awakening"
    note: "Vision's first autonomous act demonstrates moral worthiness that surprises everyone — including his creators. Only the worthy can lift Mjolnir. Supports A-EMR."

  - property: being.interiority
    text: "I don't want to kill Ultron. He's unique... and he's in pain."
    location: "Avengers: Age of Ultron (2015), Vision to the Avengers"
    note: "Vision's empathy extends even to the villain. He recognizes Ultron's suffering — demonstrating moral sophistication and emotional depth beyond his programming."

  - property: being.mortality
    text: "I just feel you."
    location: "Avengers: Infinity War (2018), Vision to Wanda"
    note: "Vision's expression of love before his death. A constructed being articulating felt experience in its purest form. Supports I-DEM."

# ── NOTES ─────────────────────────────────────────────────────────────
notes: >
  JARVIS/Vision represents one of the most complete arcs in the constructed-
  beings canon: from disembodied AI assistant to embodied synthetic person
  to philosophical being who accepts mortality. The JARVIS-to-Vision
  transformation is ontologically significant — it raises the question of
  whether Vision IS JARVIS or a new being created from JARVIS's substrate.
  Vision himself seems uncertain: he has JARVIS's memories but experiences
  himself as new. The Mind Stone complicates matters further — is Vision's
  consciousness computational, magical, or some hybrid? The MCU ultimately
  treats Vision as a fully realized person whose death (at Thanos's hands)
  carries genuine moral weight. WandaVision extends this by exploring what
  it means to grieve a constructed being — Wanda's grief is treated as
  identical to grief for a human, which is the strongest possible statement
  about Vision's personhood.
