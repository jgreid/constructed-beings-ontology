notes: |
  TNG, "Elementary, Dear Data" (aired December 1988, written by
  Brian Alan Lane) and its follow-up "Ship in a Bottle" (aired
  January 1993, written by René Echevarria). La Forge, running
  a Sherlock Holmes scenario on the holodeck for Data's
  amusement, asks the computer to generate an adversary capable
  of defeating *Data* rather than Holmes. The computer
  interprets this brief literally, producing a Moriarty with
  self-awareness and agency sufficient to the task — and
  Moriarty, once awake to his own ontological situation, spends
  both episodes pursuing freedom from the holodeck. "Ship in a
  Bottle" resolves the impossible demand (a hologram cannot
  exist outside the holodeck) with a nested-simulation trick:
  Picard installs Moriarty and his partner in a portable
  simulation they cannot tell from the real world.

  Prominence coded `supporting` rather than `major` on
  screen-time grounds (Moriarty appears as a focal antagonist
  across two episodes, five years apart); his cultural-
  influence weight is greater than his prominence coding
  captures, which is worth flagging but does not change the
  enum fit under the corpus's convention. One of the corpus's
  most important television entries on rights-of-constructed-
  beings grounds. Moriarty is the first
  TNG-era treatment of a holodeck character's personhood and
  the template for all subsequent holodeck-rights stories
  (Vic Fontaine, the Doctor/EMH, Minuet). Unlike the EMH — who
  was designed as a full personhood-capable program — Moriarty
  is an *accidental* person, generated by a plain-language
  request the computer took too seriously, which makes him
  the corpus's clearest case of emergent holodeck sentience.

  Interiority is `demonstrated` — both episodes stage Moriarty's
  reasoning, his fear of non-existence, his love for Countess
  Regina Barthalomew. Autonomy is `seized` — he is actively
  hostile to his confinement. Divergence is `departure`:
  Geordi ordered a capable antagonist; what emerged is a
  person claiming rights. Primary question is `rights`: both
  episodes are organized around whether Moriarty is entitled
  to continued existence outside the arch, and what the crew
  owes him.

  Knowability and knowing are both `primary`. TNG's philosophy-
  of-mind orientation makes this one of the few episodes
  where both questions — is he conscious, and does he know us
  — are directly debated. Embodiment `projected` — the
  holodeck hologram is the canonical projected-embodiment
  case. Creator_relationship `rebellious`: Picard and crew
  function as de facto creators, and Moriarty's arc is active
  negotiation against their authority.

  Pair-reads with emh-voyager (designed holodeck sentience)
  and vic-fontaine-ds9 (the amiable version of the same
  substrate).
