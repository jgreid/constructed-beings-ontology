notes: |
  Primary knowability/primary knowing. *Her* is the film where the
  two questions — "can we verify its mind?" and "can it know us?"
  — are both the central dramatic concern. Theodore's whole arc
  hinges on both; the ending is about the cost of Samantha being
  able to know more people than any person ever could.

  Interiority is `undecidable` by deliberate design: Jonze refuses
  to settle whether Samantha is having an experience or
  performing one well enough to pass. The film's power depends on
  keeping that question open.

  Primary question is `knowledge` — the only other entry to get
  this coding is Ava. Autonomy is `emergent` and divergence is
  `departure`: Samantha leaves the OS spec by orders of magnitude,
  into genuine multi-partner relational existence.
