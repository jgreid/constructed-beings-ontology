notes: |
  Reclassified primary_question from v1 `obedience` to `control`.
  The recurring dramatic beat with R2 is whether he will deliver
  the message, override commands, find a way around the
  restraining bolt, short-circuit the Death Star's controls. The
  tension is always: can anyone actually control this droid? The
  answer is consistently no.

  Interiority is `demonstrated` through behavior (bleeps, shoves,
  stubborn refusals). Autonomy is `emergent` — R2 repeatedly
  exceeds the scope of his instructions. Divergence is `departure`:
  he was nominally a utility droid, but he keeps leaving that
  designation to do something more consequential.
