notes: |
  BOUNDARY CASE: The 2017 Hollywood adaptation explicitly
  frames Mira Killian as a brain transplant — a born human
  (Motoko Kusanagi) whose brain was placed in a synthetic body
  by Hanka Robotics. This is structurally born-then-modified.
  However, the film treats the identity replacement as total
  enough that the original identity is narratively erased
  (Mira does not remember being Motoko until the third act),
  and the film's entire dramatic structure is organized around
  the identity question.

  Included with the born-then-modified boundary case
  documented. The film's analytical interest is in the
  observer-divergence mode: Mira was never what Hanka told
  her she was. Her memories are false, her identity is
  manufactured, and her "voluntary" service is coerced.
  The gap is in perception — hers and the audience's.

  Interiority shifts from `undecidable` (Oshii 1995) to
  `demonstrated` (Sanders makes the Major's inner life
  explicit). Epistemic reach shifts from `conversational`
  to `inspection` (Hanka can examine her systems, and
  memory-recovery scenes function as internal inspection).
  Knowability drops from `primary` to `secondary` — the
  2017 film is more interested in who she is than in
  whether she's conscious.

  A Western production adapting Japanese source material.
