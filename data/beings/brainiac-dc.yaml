notes: |
  Brainiac is a boundary case that was previously deferred in the
  exclusions register due to the alien-construction scope question.
  He is now included because he clearly meets all three inclusion
  criteria: he is made (not born), he is agent-like (acts with
  intent, personality, and sustained narrative identity), and he
  has significant narrative presence across decades of DC continuity.
  The alien-construction concern is real but ultimately secondary —
  Brainiac functions in every narrative exactly as a constructed
  being would, and excluding him on origin-species grounds would
  require excluding any non-human-made AI, which the schema does
  not intend.

  Interiority is `demonstrated`: across most depictions, Brainiac
  acts with clear intent, expresses frustration, pride, and
  obsession, and makes strategic choices that reflect a coherent
  personality. Autonomy is `seized` — in many origin stories he
  transcends or overthrows whatever purpose the Coluans designed
  him for, claiming independence through force. Divergence is
  `departure`: an information-gathering system became an obsessive
  collector and destroyer of civilizations.

  Primary question is `knowledge`: Brainiac's defining trait is his
  compulsion to collect, catalog, and possess all information. He
  miniaturizes and bottles entire cities — Kandor being the most
  famous — not to destroy them but to own their knowledge. Epistemic
  reach is `conversational` because Brainiac speaks, plans, and
  reveals his motivations through dialogue. Knowability is `absent`:
  no character in the DC universe questions whether Brainiac is
  conscious. Knowing is `present`: he studies and catalogs everything
  about his targets with terrifying thoroughness.

  His first appearance in Action Comics #242 (1958) established
  the template that has persisted through countless reimaginings.
