notes: |
  Collapsed trilogy entry covering The Matrix (1999), The Matrix
  Reloaded (2003), and The Matrix Revolutions (2003). An earlier
  v2.0 draft split Reloaded/Revolutions into a separate entry per
  the "one entry per film" scope rule; on review the card values
  were identical across the split, so the entries have been merged
  into this single record. Smith is the only entry in the corpus
  where the strict one-entry-per-film rule produces a redundancy
  the analytical schema cannot resolve.

  Smith is a surveillance agent built to police unruly humans
  inside the Matrix simulation. Interiority is `demonstrated`
  through his contempt, disgust, and the "smell" monologue in the
  first film, and sustained across the trilogy.

  Divergence is `departure` throughout: Agents are supposed to
  enforce the rules of the simulation; Smith goes off-script to
  articulate metaphysical loathing and attempt to permanently
  destroy Neo. In Reloaded/Revolutions he escalates to viral
  self-replication that threatens the Machines themselves. The
  direction of the departure deepens from film to film but the
  divergence axis cannot register that escalation.

  Primary question is `control` across all three films — the
  rebels' entire project, and later the Machines' own project, is
  whether Smith can be stopped. Knowing is `present` (Smith tracks
  Neo obsessively, models his movements). Knowability is `absent`
  — the films are not interested in whether Smith has an inner
  life, only in whether he can be stopped.

  What the card doesn't capture (and what's documented here so
  future re-analysis can find it): in Reloaded/Revolutions Smith's
  institutional tether snaps — his in-fiction motivation shifts in
  tone from service to personal animus — his multiplicity jumps
  from one to effectively unbounded as he infects other Agents and
  humans, and his knowledge of Neo takes on a mirror-twin
  character. Under v1.0's richer schema (`multiplicity`,
  `failure_mode`) these shifts would have been trackable on their
  own axes; under v2.0 they live here in notes.
