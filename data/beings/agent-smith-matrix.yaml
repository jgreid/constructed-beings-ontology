notes: |
  Smith is a surveillance agent built to police unruly humans
  inside the Matrix simulation. Interiority is `demonstrated`
  through his contempt, disgust, and the famous "smell" monologue.

  Divergence is `departure`: Agents are supposed to enforce the
  rules of the simulation; Smith goes off-script to articulate
  metaphysical loathing and attempt to permanently destroy Neo.
  Autonomy `seized` follows.

  Primary question is `control` — the film is about whether the
  rebels can evade, disable, or defeat the Agents. Knowing is
  `present` (Smith tracks Neo obsessively, models his movements);
  knowability is `absent` (the film is not interested in whether
  Smith has an inner life, only in whether he can be stopped).
