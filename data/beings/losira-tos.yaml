notes: |
  Losira is the holographic-and-tactile projection of the
  long-dead commander of a Kalandan outpost in *Star
  Trek* TOS S3E17 "That Which Survives" (January 24,
  1969). The outpost's automated defense system, after
  the original Losira's death from disease, generates a
  projection in her image that can selectively kill
  intruders by touching them. The projection is keyed to
  each victim — only the named target can be touched by
  that instance of Losira — and carries some of the
  original commander's affective register, including
  visible reluctance to perform the killings.

  Substrate `electrical + linguistic`: the defense
  computer generates the projection from stored
  templates and verbal-style command structures.
  Embodiment `projected` — Losira is a physically
  interactive but non-corporeal entity (the projection
  can touch and kill but vanishes when its function is
  complete).

  Interiority is `demonstrated` (the script gives her
  reluctance and grief, even as she carries out the
  defense program). Autonomy `designed` — the original
  Losira's pattern is faithfully reproduced.
  Divergence `none`. Primary question `control` — Kirk
  and Spock work to find the central computer to
  deactivate it. Knowability and knowing both `present`.
  Creator_relationship `loyal` — the projection is the
  Kalandan civilization's faithful posthumous defense.
