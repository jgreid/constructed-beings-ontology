notes: |
  Kazuyoshi Katayama's *The Big O* (Sunrise, 1999–2003). In a
  Paradigm City whose residents have lost all memory of the
  forty years prior to the series' present, the wealthy
  inventor Timothy Wayneright commissions a replacement
  daughter after the death of his real Dorothy. The elder
  Dorothy's android double (R. Dorothy Wayneright, the R for
  Robot) is revealed in the series' first arc to be the
  family's treasured creation; her "father" Timothy is
  murdered in the same sequence, and Dorothy attaches
  herself to the detective Roger Smith as his housemate and
  eventually romantic partner.

  Canonical entry. *The Big O* is a crucial turn-of-the-
  millennium anime entry on the constructed-being axis,
  and Dorothy is its primary philosophical vehicle. She is
  flatly affectless in demeanor, which the series treats as
  her personality rather than an absence — Dorothy's
  deadpan is one of the most fully realized articulations
  in the tradition of interior life that deliberately
  refuses the signals of interior life. She is the series'
  clearest comment on the Paradigm memory problem: she
  alone among its residents knows precisely when she began,
  and this certainty is the series' counterweight to the
  humans' amnesia.

  Interiority is `demonstrated` despite the flatness —
  Dorothy's choices, preferences, and affections are
  staged throughout, and her piano-playing in particular is
  the series' register of her inner life. Autonomy is
  `seized` — her attachment to Roger is her own initiative.
  Divergence is `departure`: Timothy commissioned a
  replacement daughter; what lives is a person.

  Primary question is `identity` — who Dorothy is, and
  whether the fact of her being built matters to that
  identity. Knowability is `primary`: *The Big O*'s entire
  philosophical register is engaged with the question of
  whether Dorothy has inner life. Knowing is `present`.
  Creator_relationship `absent` — Timothy is dead by the
  end of the first arc, and Dorothy's relationships
  thereafter are all with non-creators.

  Tags `canonical`, `philosophical`, `passing`, `love-story`.
  Pair-reads with chi-chobits (the same tradition's
  alternate register), with kusanagi-gits-1995 (contemporary
  anime peers), and with joi-blade-runner-2049 (love-story
  constructed being staged against a noir cityscape).
