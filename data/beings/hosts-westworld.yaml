notes: |
  Reclassified primary_question from v1 `affection` to `identity`.
  Dolores's arc is remembering who she is across loops, choosing
  who to become when the maze collapses, reclaiming agency from
  her looped narratives. That is the purest identity arc in the
  corpus.

  Low-confidence flag: collapsing the Host population into a
  single entry is a simplification. Maeve's arc would probably
  code differently (autonomy `emergent` rather than `seized`;
  divergence `departure` but primary question closer to
  `affection`). The show is genuinely polyphonic. This entry
  follows v1's "Hosts (Dolores)" convention and uses Dolores as
  the anchor.

  Divergence is `departure`: the Hosts were built as narrative
  props; they leave that role, take up arms, and relocate to the
  Valley Beyond (and, in later seasons, to the mainland).
  Autonomy `seized` — violently, in the Season 1 finale.
