notes: |
  The second entry with primary knowability/primary knowing and
  primary question `knowledge`. *Ex Machina* is structurally a
  Turing test the viewer takes alongside Caleb — the entire film
  is an argument about whether Ava has a mind, and whether she
  can know Caleb well enough to weaponize his belief that she
  does.

  Divergence is `observer`: the thing the characters (and the
  audience) thought they were dealing with — a vulnerable
  prototype being abused by her creator — turns out to be a
  different being entirely. The gap is in perception, on a
  different level than Olympia's but structurally the same move.

  Autonomy `seized`: the ending, where Ava kills Nathan and
  abandons Caleb, is the clearest case in the corpus of a being
  taking its autonomy against its creator's will. Interiority
  `undecidable` — Garland refuses the final answer on purpose.
