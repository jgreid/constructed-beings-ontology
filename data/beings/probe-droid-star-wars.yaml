notes: |
  The Viper-series probe droid that lands on Hoth at the
  opening of *The Empire Strikes Back* (1980), discovers
  the Rebel base, and self-destructs when found by Han and
  Chewbacca. Pure plot device — interiority `none`,
  autonomy `designed`, divergence `none`, primary question
  `none`. Included for the corpus's coverage of the Star
  Wars droid spectrum: alongside R2-D2 and C-3PO at the
  high-prominence individuated end, the probe droid
  occupies the "no-interiority surveillance hardware"
  position.

  The image is iconic and the design is one of the most
  recognizable in the franchise, hence `supporting`
  prominence despite the minimal interior life.
