notes: |
  Divergence is `design`: Sirius Cybernetics gave Marvin a "Genuine
  People Personality" along with a "brain the size of a planet" and
  assigned him to open doors on a starship. His chronic depression
  is the spec working as written. The gap is in what they specified,
  not in what Marvin does.

  Primary question is `purpose`: Adams's joke is that Marvin asks
  what he's for, loudly and constantly, and the universe's answer
  is "opening doors." That's a telos gag whose sadness is real.

  Epistemic reach is `conversational` — Marvin is verbally
  forthcoming about his state, and conversation is the only channel
  to him. We don't see his circuitry; we hear his monologue.
