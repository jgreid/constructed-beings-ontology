notes: |
  The Pygmalion myth is the first `affection` entry in the corpus:
  can an artifact be loved? Ovid's answer is yes, and Venus's
  animation collapses the question into consummation. Interiority is
  `none` — we never see inside her. Autonomy is `none` — she is
  animated, then married, with no independent agency depicted. The
  primary question is about the love, which the text frames as
  entirely Pygmalion's achievement.
