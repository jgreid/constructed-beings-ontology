# Excluded Entities Register
#
# Structured register of entities considered for and excluded from the
# constructed beings corpus. Each entry records a standardized exclusion
# reason from the controlled vocabulary below.
#
# For the full rationale behind these categories, see docs/boundary_cases.md.
#
# v3.0 NOTE: the `born-then-modified` reason has been refined. Under the
# v3.0 origin axis, a born person who is biotechnically modified, copied,
# or transferred is admissible *if the source text treats the result as
# a new being rather than as a continuation of the prior person*. The
# entries below that retain `born-then-modified` as their reason are
# cases where the source text treats the result as continuation; those
# remain excluded. A set of v2.x exclusions previously listed here under
# this reason (Cybermen, the Borg, RoboCop, Steve Austin) were readmitted
# in the v3.0 sprint and are now in the main corpus under
# `origin: converted` or `transferred`. The register notes those
# readmissions in a `v3.0 readmissions` block at the bottom.

exclusion_reasons:
  born-then-modified: >
    The source text frames the modified being as a continuation of
    the prior person — same identity, augmented body. Excluded
    because the personhood in question predates and outlives the
    construction. Sharper than the v2.x rule: the question is
    whether the text stages continuation, not whether the
    modification is extensive.
  divine-creation-of-persons: >
    Creator is divine; the result is immediately and fully human,
    not an artifact.
  collective-no-individual: >
    No individuated character to code; the entity is a
    population or metaphor without narrative personhood.
  metaphorical-construct: >
    Agency is figurative, not literal. The text would explain
    "no, it's a metaphor" if asked whether the entity has a body.
  out-of-scope: >
    Outside current scope. The corpus covers Western-canon
    and Western-consumed media (including anime and manga
    widely available in Western markets, as of the v2.4.2
    anime expansion). Texts originally outside this frame
    that have not received substantial Western
    distribution remain out-of-scope pending cultural
    consultation.
  boundary-deferred: >
    Meets some inclusion criteria but poses a genuine definitional
    problem the schema cannot cleanly resolve. Deferred for
    further analysis.

entries:
  - name: "Eve"
    source: "Genesis"
    reason: divine-creation-of-persons
    note: >
      Immediately and fully human. Made the way people are made,
      not the way things are made. See docs/boundary_cases.md.

  - name: "Adam"
    source: "Genesis"
    reason: divine-creation-of-persons
    note: >
      Same reasoning as Eve. Divine creation of a full person,
      not artisanal construction of an artifact.

  - name: "RoboCop (2014)"
    source: "RoboCop (2014)"
    year: 2014
    reason: born-then-modified
    note: >
      The 2014 film is genuinely uncertain about whether identity
      replacement occurred, and on balance is closer to a born-
      then-modified continuation than the 1987 version. The 1987
      RoboCop was readmitted in v3.0 as `origin: converted`; the
      2014 version remains excluded pending closer reading. A
      coder who wants to argue for inclusion should open an issue
      with the case for new-being framing in Padilha's cut.

  - name: "Molly Millions"
    source: "Neuromancer"
    year: 1984
    reason: born-then-modified
    note: >
      Extensive cybernetic modification of a born human.
      Quintessential cyberpunk street samurai; still born, not made.

  - name: "Motoko Kusanagi (manga)"
    source: "Ghost in the Shell (manga, Masamune Shirow)"
    year: 1989
    reason: boundary-deferred
    note: >
      The 1989 manga's Kusanagi has a human brain in a full
      prosthetic body — born-then-modified per the standard
      exclusion rule. The 1995 Oshii film and 2017 Sanders
      film are now in the corpus as separate source-text
      entries because those films treat the born/made
      distinction as the narrative's central question. The
      manga's Kusanagi remains deferred.

  - name: "Alita / Gally"
    source: "Battle Angel Alita (Gunnm)"
    year: 1990
    reason: born-then-modified
    note: >
      Human brain in a full prosthetic body (Kishiro, 1990).
      Clearer born-then-modified case than Ghost in the Shell
      — Alita's biological brain is the continuous element
      across all her body changes. The 2019 Cameron/Rodriguez
      Hollywood adaptation retains this structure.

  - name: "Genos"
    source: "One Punch Man"
    year: 2009
    reason: born-then-modified
    note: >
      Cyborg with biological origin. Born human, extensively
      modified after a disaster. The modification is extensive
      but the biological identity is continuous.

  - name: "Sam Bell clones"
    source: "Moon (2009)"
    year: 2009
    reason: boundary-deferred
    note: >
      Manufactured vs. cloned-with-gestation ambiguity. The
      bright line between manufacturing and gestation is
      unclear here. GERTY (the facility AI) is included in
      the main corpus.

  - name: "Marcus Wright"
    source: "Terminator Salvation"
    year: 2009
    reason: boundary-deferred
    note: >
      Born-then-modified vs. manufactured ambiguity. Wright
      donated his body to Cyberdyne; the resulting hybrid is
      genuinely unclear on the born/made distinction.

  - name: "Groot"
    source: "Guardians of the Galaxy"
    year: 2014
    reason: collective-no-individual
    note: >
      Flora colossus species. Born, not made — Groot is a
      member of a naturally occurring alien species, not a
      constructed being.

  - name: "Caliban"
    source: "The Tempest"
    year: 1611
    reason: born-then-modified
    note: >
      Son of the witch Sycorax and the devil. Caliban is
      born, not made — his origin is biological reproduction,
      however monstrous. Prospero enslaves and educates him,
      but the modification does not convert the origin.

  - name: "Ariel"
    source: "The Tempest"
    year: 1611
    reason: boundary-deferred
    note: >
      A pre-existing spirit bound by magic, first by Sycorax
      and then by Prospero. Ariel is not constructed from
      materials but is enslaved/commanded through enchantment.
      The ontology's "made, not born" criterion arguably
      covers "enchanted into service," but Ariel is a
      natural being who is captured, not an artifact who is
      created. Deferred for further analysis.

  - name: "The Newts"
    source: "War with the Newts (Válka s mloky)"
    year: 1936
    reason: collective-no-individual
    note: >
      Karel Capek's satirical novel features an alien amphibian
      species discovered, exploited, and eventually rising
      against humanity. The Newts are born, not made — they
      are a naturally occurring species, despite being the
      product of the same author who coined "robot." No
      individual Newt is narratively individuated.

  - name: "Elizabeth"
    source: "BioShock Infinite"
    year: 2013
    reason: born-then-modified
    note: >
      Elizabeth (Anna DeWitt) is a born human whose abilities
      derive from dimensional exposure, not construction.
      Despite her virtual-world context, she is a biological
      person with augmented capabilities, not a constructed
      being.

  - name: "Innies (Severance)"
    source: "Severance"
    year: 2022
    reason: born-then-modified
    note: >
      The Severance procedure surgically partitions a born
      human's memory into two contextual selves. The "innies"
      are continuous biological persons with a portion of
      their own memories surgically occluded, not constructed
      beings. The show explicitly treats the rights of innies
      as a personhood question, but the personhood in
      question is the biological person's, divided — not an
      artifact's, created.

  - name: "Uploaded Intelligences (Pantheon)"
    source: "Pantheon"
    year: 2022
    reason: born-then-modified
    note: >
      The UIs in AMC's *Pantheon* are destructive scans of
      born humans uploaded to compute substrates. Origin is
      biological birth; the uploading, however complete, does
      not convert the origin. Excluded on the same principle
      as the *Black Mirror* cookies (also tangent to the
      corpus via `cookie-white-christmas` and
      `ashley-too-black-mirror`, which are included because
      the source texts treat the copy as the constructed
      object; *Pantheon* treats the copy as the original
      person continued). Reasonable coders could argue for
      inclusion; excluded conservatively for now.

  - name: "Nathan Brown / uploaded consciousnesses (Upload)"
    source: "Upload"
    year: 2020
    reason: born-then-modified
    note: >
      Nathan and the other Upload residents are born humans
      whose consciousnesses have been scanned into a digital
      afterlife. Origin is biological birth; the upload does
      not convert the origin. Same reasoning as Pantheon.
      Note that the in-show AI customer-service characters
      (the "Angels" interface, the AI Guy) may warrant
      separate inclusion in a future sweep.

  - name: "Sleeves (Altered Carbon)"
    source: "Altered Carbon (Morgan, 2002; Netflix, 2018)"
    year: 2002
    reason: born-then-modified
    note: >
      In Richard Morgan's *Altered Carbon* and the Netflix
      adaptation, consciousness is digitized on "cortical
      stacks" and loaded into cloned or vat-grown "sleeve"
      bodies. The stacks are born human consciousness; the
      sleeves are biological bodies. The framework is
      born-then-modified with the modification being a body
      swap. The synthetic sleeves (Poe, Lizzie's artificial
      body) are borderline and might warrant inclusion in a
      future revision.

  - name: "Peripherals (The Peripheral)"
    source: "The Peripheral"
    year: 2022
    reason: boundary-deferred
    note: >
      Amazon's *The Peripheral* (2022), adapting William
      Gibson's 2014 novel, features biomechanical bodies
      ("peripherals") remote-operated by human consciousness
      from another timeline. When unoccupied, a peripheral
      is a constructed body with its own biology; when
      occupied, it is a human mind in a remote shell.
      Genuinely ambiguous on the born/made distinction.
      Deferred pending clearer analytical treatment of
      remote-operated biomechanical substrate.

  - name: "Cyberpunks (Cyberpunk: Edgerunners)"
    source: "Cyberpunk: Edgerunners"
    year: 2022
    reason: born-then-modified
    note: >
      Netflix/Studio Trigger's *Edgerunners* (2022) is set
      in the Cyberpunk 2077 universe, where characters
      undergo extensive cybernetic modification. The series'
      central characters (David, Lucy, Rebecca) are born
      humans whose chrome-heavy modifications do not convert
      the origin. Excluded on the same principle as Molly
      Millions. The franchise's fully constructed AIs
      (Delamain, Skippy, various Netrunner AIs) would be
      separately includable.

  # ── Theater / performing-arts exclusions ─────────────────────────

  - name: "Eliza Doolittle"
    source: "Pygmalion (Shaw)"
    year: 1913
    reason: metaphorical-construct
    note: >
      Shaw's *Pygmalion* (1913) and its musical adaptation
      *My Fair Lady* (1956) use the Pygmalion myth as a
      metaphor for class transformation through speech
      training. Eliza is a born human whose "construction"
      by Henry Higgins is figurative — accent coaching, not
      animation of inanimate matter. Excluded on the
      metaphorical-construct principle. The W.S. Gilbert
      *Pygmalion and Galatea* (1871) is included as a
      separate entry because Gilbert's Galatea is a literal
      animated statue, where Shaw's Eliza is not.

  - name: "Audrey II"
    source: "Little Shop of Horrors"
    year: 1982
    reason: collective-no-individual
    note: >
      Howard Ashman / Alan Menken's musical (1982; film
      1986) features Audrey II, a sentient man-eating plant.
      Audrey II is raised and trained by Seymour but is
      ontologically a member of an alien plant species —
      born, not made, in the same sense as Groot. The
      cultivation and feeding does not convert the origin.
      The species is also collective and undifferentiated
      (the film's ending reveals Audrey II as one of many).
      Reasonable coders could argue for inclusion as a
      magical/biological hybrid; excluded conservatively.

  - name: "Mr. Zero"
    source: "The Adding Machine (Rice)"
    year: 1923
    reason: born-then-modified
    note: >
      Elmer Rice's expressionist play *The Adding Machine*
      (1923) and Loesser/Schmidt's musical adaptation (2007)
      feature Mr. Zero, a clerk who becomes one with his
      adding machine after being replaced by mechanization.
      Mr. Zero is a born human whose "machine" identity is
      psychological/expressionistic, not literal
      construction. The play is a foundational text in the
      mechanization-of-the-worker tradition (and a clear
      antecedent to *R.U.R.*) but does not depict a
      constructed being.

  - name: "Theatrical puppets representing born characters"
    source: "War Horse / The Lion King / Life of Pi (stage)"
    year: 2007
    reason: metaphorical-construct
    note: >
      War Horse's Joey (2007), the Lion King puppets
      (1997), Richard Parker in the Life of Pi stage
      adaptation (2019), and similar productions use
      sophisticated puppetry to represent born biological
      characters (a horse, lions, a tiger). The puppets
      are theatrical apparatus, not in-narrative
      constructed beings. The characters themselves are
      coded as born animals within the narrative; the
      puppet is the staging convention, not the being.
      This is distinct from Petrushka (included), where
      the puppet IS the being in-narrative, and from
      Hand to God's Tyrone (included), where the puppet
      is the being's substrate within the play's
      metaphysics.

  # ── v2.4.4 scholar-audit re-exclusions ────────────────────────────

  - name: "Alphonse Elric"
    source: "Fullmetal Alchemist (Arakawa, 2001)"
    year: 2001
    reason: born-then-modified
    note: >
      Alphonse originates as a born human child; his body is
      destroyed in a failed human-transmutation ritual and his
      soul is bound by Edward to a nearby suit of armor. Strict
      application of the born-then-modified rule (RoboCop,
      Cybermen, Altered Carbon sleeves, Severance innies)
      excludes him: the personhood in question is a born
      person's consciousness relocated to new substrate. A
      v2.4.4 draft included him with a boundary flag; v2.4.5
      retracts that inclusion. The armor body itself might
      warrant treatment as a constructed artifact in a future
      schema revision that formalizes body-swap cases (same
      class as Altered Carbon synthetic sleeves, Upload's
      scanned afterlife, *Pantheon*'s UIs, and the *Peripheral*
      peripherals, all currently excluded or deferred).

  - name: "Hayt / Duncan Idaho ghola"
    source: "Dune Messiah (Herbert, 1969)"
    year: 1969
    reason: boundary-deferred
    note: >
      Deferred for consistency with the Altered Carbon sleeves
      exclusion. A Tleilaxu ghola is grown from preserved cells
      of the dead Duncan Idaho in an axlotl tank and conditioned
      as a weapon; the 1984 *Heretics* reveal that axlotl tanks
      are transformed Tleilaxu Masters makes the "tank" itself
      a biological process closer to gestation than manufacture.
      The novel's philosophical work on whether the ghola is
      Duncan is structurally the same boundary case the corpus
      defers for Morgan's cortical-stack sleeves. A v2.4.4
      draft included Hayt with a boundary flag; v2.4.5
      retracts that inclusion pending a schema revision that
      formalizes cloned-body-plus-conditioning cases
      consistently across the corpus.

  - name: "Khalkotauroi (Bronze Bulls of Colchis)"
    source: "Argonautica (Apollonius Rhodius, c. 250 BCE)"
    year: -250
    reason: collective-no-individual
    note: >
      Within-source to the existing talos.yaml entry. Apollonius
      describes the bulls as a paired yoke with no individuation,
      no names, no speech, and a brief narrative function as a
      labor-test Jason overcomes. They fail the individuated-
      character test applied to Groot and the Newts, and their
      analytical content is already covered by the foundational
      talos.yaml. A v2.4.4 draft included them; v2.4.5 retracts
      that inclusion and documents the within-source reference
      via the talos notes.

  # Doraemon was excluded in v2.4.5 on out-of-scope grounds and
  # readmitted in v3.0. See the `v3.0 readmissions` block below.

# ── v3.0 readmissions ────────────────────────────────────────────────
#
# The v3.0 sprint introduced the `metadata.origin` axis and refined the
# inclusion rule for born-then-modified beings. As a consequence,
# several v2.x exclusions were readmitted to the main corpus. They are
# listed here for the audit trail; the substantive entries live in
# `data/beings/`. See `docs/boundary_cases.md` and the v3.0 CHANGELOG
# entry for the full rationale.

v3_0_readmissions:
  - name: "RoboCop (Alex Murphy)"
    source: "RoboCop (1987)"
    entry_id: robocop-1987
    new_origin: converted
    note: >
      Verhoeven's 1987 film stages Murphy's reconstruction as the
      emergence of a new being (RoboCop) from which Murphy's prior
      identity is reasserted through narrative work. The original
      v2.x exclusion read the film as continuation; the v3.0
      reading takes the spec/Murphy struggle as evidence that the
      film treats RoboCop as a new entity.

  - name: "Steve Austin"
    source: "The Six Million Dollar Man"
    entry_id: steve-austin-six-million
    new_origin: converted
    note: >
      Borderline. Admitted because the series and the *Bionic
      Woman* spinoff both make the rebuilding the defining
      ontological event of the franchise, and the Jaime Sommers
      death-and-revival arc is unambiguously a new-being case.

  - name: "Cybermen"
    source: "Doctor Who"
    entry_id: cybermen-doctor-who
    new_origin: converted
    note: >
      The conversion process is the show's recurring horror, and
      the resulting Cyberman is consistently treated as a new
      species rather than as the converted human's continuing
      self. Bill Potts's "World Enough and Time" emergence is
      staged as restoration, not as continuity preserved.

  - name: "The Borg"
    source: "Star Trek: The Next Generation"
    entry_id: borg-collective
    new_origin: converted
    note: >
      Plus split entries `locutus-borg`, `seven-of-nine`,
      `hugh-borg-tng`, `borg-queen`. Assimilation is staged as
      the Collective replacing prior identity; the recovery
      stories explicitly treat the prior person as something
      to be *recovered*, which presupposes the new-being framing.

  - name: "Doraemon"
    source: "Doraemon"
    entry_id: doraemon
    new_origin: manufactured
    note: >
      Not an origin-axis readmission. The v2.4.5 exclusion was on
      out-of-scope grounds (Western-availability test). v3.0
      revisits the test in light of growing English-language
      distribution and admits the character on
      foundational-prominence grounds. A future scope sprint
      should formalize the East Asian canon as first-class
      corpus territory rather than continuing to evaluate
      individual cases.
