name: Validate Being Entries

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

jobs:
  validate:
    name: Schema Validation & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation
        run: python schema/validate.py

      - name: Validate entry template
        run: python schema/validate.py schema/entry_template.yaml

      - name: Run analysis
        run: python analysis/analyze.py --all

      - name: Sanity-check outputs
        run: |
          test -s output/summary_table.md
          test -s output/property_coverage.md
          test -s output/question_analysis.md
          test -s output/timeline_analysis.md
          test -s analysis/influence_graph.html
