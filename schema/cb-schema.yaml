# Constructed Beings Ontology — v2.0 Entry Schema Definition
# Machine-readable schema for validating being entries in data/beings/*.yaml
# Human-readable reference: SCHEMA.md

schema_version: "2.0"
description: >
  Defines the structure, types, and allowed enum values for every field
  in a constructed-being entry. v2.0 replaces v1.0 entirely — see CHANGELOG.md.

properties:

  # ── IDENTIFICATION ──────────────────────────────────────────────────
  id:
    type: string
    required: true
    format: kebab-case
    description: Unique identifier in kebab-case. Matches the filename.

  name:
    type: string
    required: true
    description: Display name of the constructed being.

  # ── CARD ────────────────────────────────────────────────────────────
  card:
    type: object
    required: true
    properties:

      the_being:
        type: object
        required: true
        properties:

          interiority:
            type: enum
            required: true
            allowed:
              - none
              - claims
              - narrated
              - demonstrated
              - undecidable

          autonomy:
            type: enum
            required: true
            allowed:
              - none
              - designed
              - emergent
              - seized

          divergence:
            type: enum
            required: true
            allowed:
              - none
              - design
              - departure
              - observer

      the_lens:
        type: object
        required: true
        properties:

          primary_question:
            type: enum
            required: true
            allowed:
              - none
              - control
              - affection
              - purpose
              - rights
              - knowledge
              - identity

          epistemic_reach:
            type: enum
            required: true
            allowed:
              - none
              - behavioral
              - conversational
              - inspection

          knowability:
            type: enum
            required: true
            allowed:
              - absent
              - present
              - secondary
              - primary

          knowing:
            type: enum
            required: true
            allowed:
              - absent
              - present
              - secondary
              - primary

  # ── METADATA ────────────────────────────────────────────────────────
  metadata:
    type: object
    required: true
    properties:

      source:
        type: string
        required: true

      year:
        type: integer
        required: true

      medium:
        type: enum
        required: true
        allowed:
          - poem
          - epic
          - folklore
          - play
          - novel
          - short-story
          - film
          - television
          - video-game

      creator:
        type: string
        required: true

      substrate:
        type: list
        required: true
        min_items: 1
        items:
          type: enum
          allowed:
            - mechanical
            - biological
            - electrical
            - magical
            - cloned
            - linguistic

      motivation:
        type: list
        required: true
        min_items: 1
        items:
          type: enum
          allowed:
            - service
            - knowledge
            - power
            - companionship
            - art
            - mirror
            - child
            - other

  # ── SEQUEL LINK ─────────────────────────────────────────────────────
  sequel_link:
    type: string_or_null
    required: true
    description: >
      Entry id of a related sequel, successor, or adaptation, or null.
      See SCHEMA.md for direction and use-cases.

  # ── NOTES ───────────────────────────────────────────────────────────
  notes:
    type: string
    required: false
    description: >
      Free-text researcher notes. This is the only place scholarly
      context lives in v2.0 (no structured citations array).
