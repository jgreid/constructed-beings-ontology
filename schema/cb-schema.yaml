# Constructed Beings Ontology — v3.0 Entry Schema Definition
# Machine-readable schema for validating being entries in data/beings/*.yaml
# Human-readable reference: SCHEMA.md

schema_version: "3.0"
description: >
  Defines the structure, types, and allowed enum values for every field
  in a constructed-being entry. v3.0 — origin axis. Adds a required
  `metadata.origin` enum to record the pathway by which a being came
  into existence (manufactured, assembled, cloned, copied, converted,
  transferred). Replaces the v2.x implicit "made not born" exclusion
  rule with an explicit-but-narrower coding axis: born-then-modified
  beings whose source texts treat them as new entities (the Borg,
  Cybermen, RoboCop, etc.) are now admissible under
  `origin: converted` or `transferred`, while beings whose source
  texts treat them as continuations of a prior person remain
  excluded. See CHANGELOG.md and docs/boundary_cases.md for the full
  rationale, the readmitted set, and the new exclusion criterion.

properties:

  # ── IDENTIFICATION ──────────────────────────────────────────────────
  id:
    type: string
    required: true
    format: kebab-case
    description: Unique identifier in kebab-case. Matches the filename.

  name:
    type: string
    required: true
    description: Display name of the constructed being.

  # ── CARD ────────────────────────────────────────────────────────────
  card:
    type: object
    required: true
    properties:

      the_being:
        type: object
        required: true
        properties:

          interiority:
            type: enum
            required: true
            allowed:
              - none
              - claims
              - narrated
              - demonstrated
              - undecidable

          autonomy:
            type: enum
            required: true
            allowed:
              - none
              - designed
              - emergent
              - seized

          divergence:
            type: enum
            required: true
            allowed:
              - none
              - design
              - departure
              - observer

      the_lens:
        type: object
        required: true
        properties:

          primary_question:
            type: enum
            required: true
            allowed:
              - none
              - control
              - affection
              - purpose
              - rights
              - knowledge
              - identity

          epistemic_reach:
            type: enum
            required: true
            allowed:
              - none
              - behavioral
              - conversational
              - inspection

          knowability:
            type: enum
            required: true
            allowed:
              - absent
              - present
              - secondary
              - primary

          knowing:
            type: enum
            required: true
            allowed:
              - absent
              - present
              - secondary
              - primary

  # ── METADATA ────────────────────────────────────────────────────────
  metadata:
    type: object
    required: true
    properties:

      source:
        type: string
        required: true

      year:
        type: integer
        required: true

      medium:
        type: enum
        required: true
        allowed:
          - poem
          - epic
          - folklore
          - play
          - opera
          - ballet
          - musical
          - novel
          - short-story
          - comics
          - film
          - television
          - video-game

      creator:
        type: string
        required: true

      substrate:
        type: list
        required: true
        min_items: 1
        items:
          type: enum
          allowed:
            - mechanical
            - biological
            - electrical
            - magical
            - cloned
            - linguistic

      origin:
        type: enum
        required: true
        description: >
          The pathway by which the being came into existence. Distinct
          from `substrate` (what it is made of) and `autonomy` (where
          its agency comes from). Codes whether a specific prior person
          is involved at the origin and, if so, how. The default value
          for beings constructed without a specific prior person at
          narrative issue is `manufactured`.
        allowed:
          - manufactured
          - assembled
          - cloned
          - copied
          - converted
          - transferred

      motivation:
        type: list
        required: true
        min_items: 1
        items:
          type: enum
          allowed:
            - service
            - knowledge
            - power
            - companionship
            - art
            - mirror
            - child
            - other

      presentation:
        type: enum
        required: true
        description: >
          How the being presents in terms of gender. Codes the text's
          depiction, not inference about the being's identity.
        allowed:
          - masculine
          - feminine
          - androgynous
          - none
          - variable

      embodiment:
        type: enum
        required: true
        description: >
          The being's primary mode of physical existence as depicted.
        allowed:
          - embodied
          - disembodied
          - projected
          - virtual

      prominence:
        type: enum
        required: true
        description: >
          Cultural prominence of this character/work. How recognizable
          is this being outside its immediate fandom?
        allowed:
          - foundational
          - major
          - supporting
          - minor

      creator_relationship:
        type: enum
        required: true
        description: >
          The being's dominant depicted stance toward its creator(s).
        allowed:
          - servile
          - loyal
          - indifferent
          - resentful
          - rebellious
          - patricidal
          - absent

      tags:
        type: list
        required: true
        min_items: 0
        items:
          type: enum
          allowed:
            - canonical
            - love-story
            - rebellion
            - turing-test
            - passing
            - creator-conflict
            - child-arc
            - military
            - comedy
            - horror
            - philosophical
            - ensemble-split

  # ── SEQUEL LINK ─────────────────────────────────────────────────────
  sequel_link:
    type: string_or_null
    required: true
    description: >
      Entry id of a related sequel, successor, or adaptation, or null.
      See SCHEMA.md for direction and use-cases.

  # ── LINK TYPE ──────────────────────────────────────────────────────
  link_type:
    type: enum_or_null
    required: true
    description: >
      Classifies the relationship when sequel_link is non-null.
    allowed:
      - sequel
      - adaptation
      - successor

  # ── NOTES ───────────────────────────────────────────────────────────
  notes:
    type: string
    required: false
    description: >
      Free-text researcher notes. The only place scholarly context lives
      in the current schema.
